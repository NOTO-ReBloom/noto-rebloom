name: Bump cinematic K

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate cinematic scripts
        run: |
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          node --check rebloom-fun.js
          node --check rebloom-cinematic.js
          test -f rebloom-cinematic.css
          test -f rebloom-cinematic-addon.css
      - name: Bump public page cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              p=Path(name)
              t=p.read_text(encoding='utf-8')
              for old in ['rebloom-unified.js?v=20260817i','rebloom-unified.js?v=20260817j']:
                  t=t.replace(old,'rebloom-unified.js?v=20260817k')
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "全画面泥演出と動く企画図を全ページへ反映"
          git push
