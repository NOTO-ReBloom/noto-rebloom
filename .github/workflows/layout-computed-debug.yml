name: Layout computed debug
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.55.0
      - name: Inspect computed layout
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 1
          cat > debug.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});const p=await b.newPage({viewport:{width:1440,height:1000}});await p.route('**/*',r=>{const u=r.request().url();if(u.startsWith('http://127.0.0.1:8000/')||u.startsWith('data:')||u.startsWith('blob:'))return r.continue();return r.abort()});
          for(const file of ['partner.html','event.html','index.html']){await p.goto('http://127.0.0.1:8000/'+file,{waitUntil:'load'});await p.waitForTimeout(1200);const out=await p.evaluate(()=>{
            const info=sel=>{const e=document.querySelector(sel);if(!e)return null;const s=getComputedStyle(e),r=e.getBoundingClientRect();return {sel,cls:e.className,display:s.display,grid:s.gridTemplateColumns,width:r.width,height:r.height,gap:s.gap,overflow:s.overflow,padding:s.padding}};
            const rules=sel=>{const e=document.querySelector(sel);if(!e)return[];const hits=[];for(const sheet of [...document.styleSheets]){let rr;try{rr=sheet.cssRules}catch{continue}for(const rule of [...(rr||[])]){if(rule.type===1){try{if(e.matches(rule.selectorText)&&(/display|grid-template-columns|overflow|height/.test(rule.style.cssText)))hits.push({href:sheet.href,selector:rule.selectorText,css:rule.style.cssText})}catch{}}else if(rule.cssRules){for(const sub of [...rule.cssRules])if(sub.type===1){try{if(e.matches(sub.selectorText)&&(/display|grid-template-columns|overflow|height/.test(sub.style.cssText)))hits.push({href:sheet.href,selector:sub.selectorText,css:sub.style.cssText})}catch{}}}}return hits};
            const logistics=document.querySelector('.rbpc-logistics-grid');
            return {body:document.body.className,value:info('.nr-value-grid'),valueRules:rules('.nr-value-grid'),logistics:info('.rbpc-logistics-grid'),logisticsKids:logistics?[...logistics.children].map((e,i)=>({i,cls:e.className,style:getComputedStyle(e).gridColumn,width:e.getBoundingClientRect().width})):[],tile:info('.visual-tile'),caption:info('.visual-tile figcaption'),flow:info('.rbpc-schedule-flow article'),flowTime:info('.rbpc-schedule-flow article .flow-time')};
          });console.log('\nFILE',file,'\n',JSON.stringify(out,null,2));}await b.close()})().catch(e=>{console.error(e);process.exit(1)})
          JS
          node debug.cjs
