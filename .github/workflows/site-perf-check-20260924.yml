name: NOTO ReBloom performance check 2026-09-24

on:
  push:
    paths:
      - '.github/workflows/site-perf-check-20260924.yml'
  workflow_dispatch:

concurrency:
  group: noto-rebloom-perf-check
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lighthouse
        run: |
          npm install --no-save lighthouse puppeteer-core
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Serve site
        run: |
          node .github/scripts/static-gzip-server.cjs >/tmp/rebloom-perf-http.log 2>&1 &
          sleep 2
      - name: Browser smoke test
        continue-on-error: true
        run: node .github/scripts/site-browser-smoke.cjs

      - name: Trace layout shifts
        run: node .github/scripts/site-layout-shift-trace.cjs

      - name: Measure
        run: |
          mkdir -p perf
          for p in index thoughts learn event report partner contact photo-credits 404 diagnosis; do
            npx lighthouse "http://127.0.0.1:8000/$p.html" --quiet --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="perf/$p-mobile.json" || true
            npx lighthouse "http://127.0.0.1:8000/$p.html" --quiet --preset=desktop --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="perf/$p-desktop.json" || true
          done
          node - <<'NODE'
          const fs=require('fs');
          const out=[];
          for(const f of fs.readdirSync('perf').filter(x=>x.endsWith('.json')).sort()){
            const j=JSON.parse(fs.readFileSync('perf/'+f,'utf8'));
            const c=j.categories||{},a=j.audits||{};
            out.push({
              file:f,
              performance:Math.round((c.performance?.score||0)*100),
              accessibility:Math.round((c.accessibility?.score||0)*100),
              bestPractices:Math.round((c['best-practices']?.score||0)*100),
              seo:Math.round((c.seo?.score||0)*100),
              lcp:Math.round(a['largest-contentful-paint']?.numericValue||0),
              cls:Number((a['cumulative-layout-shift']?.numericValue||0).toFixed(4)),
              tbt:Math.round(a['total-blocking-time']?.numericValue||0),
              lcpElement:(a['lcp-breakdown-insight']?.details?.items||[]).find(x=>x.type==='node')?.selector||null,
              shifts:(a['layout-shifts']?.details?.items||[]).slice(0,3).map(x=>({
                score:Number((x.score||0).toFixed(4)),
                selector:x.node?.selector||null,
                cause:x.subItems?.items?.[0]?.cause||null
              })),
              renderBlockers:(a['render-blocking-insight']?.details?.items||[]).slice(0,5).map(x=>({
                url:(x.url||'').split('/').pop(),
                ms:Math.round(x.wastedMs||0)
              })),
              accessibilityFailures:Object.entries(a)
                .filter(([id,x])=>x?.scoreDisplayMode==='binary'&&x?.score===0&&x?.details?.items?.length)
                .map(([id,x])=>({id,title:x.title,count:x.details.items.length,items:x.details.items.slice(0,5).map(i=>({selector:i.node?.selector||null,label:i.node?.nodeLabel||null}))}))
            });
          }
          console.log('PERF_SUMMARY='+JSON.stringify(out));
          NODE

