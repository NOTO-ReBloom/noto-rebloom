name: Text only conversion stabilize
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stabilize-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final text-only refinement
        env:
          JS_PATCH_B64: ""
          CSS_PATCH_B64: ""
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          marker='/* Text-only conversion stabilization 20260817ab */'
          j=Path('rebloom-experience.js'); s=j.read_text(encoding='utf-8')
          patch=base64.b64decode(os.environ['JS_PATCH_B64']).decode('utf-8')
          if marker not in s: j.write_text(s.rstrip()+"\n\n"+patch.strip()+"\n",encoding='utf-8')
          c=Path('rebloom-experience.css'); s=c.read_text(encoding='utf-8')
          cp=base64.b64decode(os.environ['CSS_PATCH_B64']).decode('utf-8')
          if marker not in s: c.write_text(s.rstrip()+"\n\n"+cp.strip()+"\n",encoding='utf-8')
          d=Path('rebloom-detail.js'); s=d.read_text(encoding='utf-8')
          s=s.replace('rebloom-experience.css?v=20260817z','rebloom-experience.css?v=20260817ab')
          s=s.replace('rebloom-experience.js?v=20260817z','rebloom-experience.js?v=20260817ab')
          d.write_text(s,encoding='utf-8')
          PY
      - name: Install browser runtime
        run: npm install --no-save playwright-core@1.55.0
      - name: Audit final order and copy
        run: |
          cat > stabilize-audit.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            for(const [vp,w,h] of [['desktop',1440,1000],['mobile',390,844]]){
              const ctx=await browser.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'});
              for(const file of ['index.html','event.html']){
                const page=await ctx.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
                await page.route('**/*',r=>{const u=r.request().url();if(u.startsWith('http://127.0.0.1:8000/')||u.startsWith('data:')||u.startsWith('blob:'))r.continue();else r.abort();});
                const res=await page.goto('http://127.0.0.1:8000/'+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(1600);
                const m=await page.evaluate(file=>{
                  const overflow=document.documentElement.scrollWidth-document.documentElement.clientWidth;
                  if(file==='index.html') return {overflow,lead:document.querySelector('.hero-lead')?.textContent||'',formula:document.querySelectorAll('.rb-project-formula span').length,glance:!!document.querySelector('.rb-project-glance')};
                  const s=document.querySelector('.event-summary'),p=document.querySelector('.rb-mud-play-section');
                  return {overflow,hero:[...document.querySelectorAll('.page-hero--event p')].map(x=>x.textContent).join(' '),cards:document.querySelectorAll('.rb-play-grid article').length,status:document.querySelector('.rb-play-status')?.textContent||'',after:!!(s&&p&&s.nextElementSibling===p),cta:!!document.querySelector('.rb-play-cta')};
                },file);
                if(!res||res.status()>=400||errors.length||m.overflow>2)throw new Error(file+'/'+vp+' base '+JSON.stringify({errors,m}));
                if(file==='index.html'&&(!m.lead.includes('学生プロジェクト')||m.formula!==3||!m.glance))throw new Error('home '+vp+' '+JSON.stringify(m));
                if(file==='event.html'&&(!m.hero.includes('走る、探す、投げる、運ぶ')||m.cards!==4||!m.status.includes('内容は検討中です')||!m.after||!m.cta))throw new Error('event '+vp+' '+JSON.stringify(m));
                await page.close();
              }
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1; node stabilize-audit.cjs
      - name: Commit final text-only refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rebloom-experience.js rebloom-experience.css rebloom-detail.js
          git diff --cached --quiet && exit 0
          git commit -m 'ホーム概要と泥ん子運動会の楽しさを最終調整'
          git push
