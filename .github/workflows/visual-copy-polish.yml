name: Visual copy polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-copy-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce text density
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ('安全面を準備中','保険・救護を準備'),
            ('READYFORで実施したクラウドファンディングは、2026年8月15日に終了しました。10名の方から、合計186,000円のご支援をいただきました。','2026年8月15日に終了し、10名の方から合計186,000円のご支援をいただきました。'),
            ('いただいたご支援を、9月20日の泥ん子運動会の開催と、その先の活動につなげていきます。募集は終了していますが、これまでの活動報告や結果は引き続きREADYFORでご覧いただけます。','ご支援を9月20日の開催につなげます。結果・活動報告はREADYFORで引き続きご覧いただけます。'),
            ('きっかけは「NOTO-REBOOST U-23」で能登を訪れ、使われなくなった農地を見たことでした。土地をきれいにするだけではなく、まずここに人が来て、地域の方と話して、能登のことを知る時間をつくれないだろうか。そこからこの企画を考え始めました。','「NOTO-REBOOST U-23」で能登を訪れ、使われなくなった農地を見たことが始まりでした。まず人が来て、話して、能登を知る時間をつくれないか。そこから泥ん子運動会を考えました。'),
            ('<p>一度のイベントで農地の問題が解決するわけではありません。それでも、泥だらけになって遊んだ一日が「また来たい」「今度は別の形でも関わりたい」と思うきっかけになれば、その一歩には意味があると思っています。まずは自分たちにできる形から始めます。</p>',''),
            ('9月20日の一日を楽しい思い出にすることはもちろん、その先にも何かが残るイベントにしたいと考えています。','楽しい一日を、その次の「また能登に来たい」につなげます。'),
            ('最初から全部が決まっていたわけではありません。現地で話を聞き、土地を探し、相談を重ねながら形にしてきました。','現地で話を聞き、土地を探し、少しずつ形にしてきました。')
          ]
          for a,b in pairs:
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "トップページの文字量を整理"
          git push
