name: Visual layout final V
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: npm install --no-save playwright-core@1.55.0
      - name: Render and inspect
        run: |
          mkdir -p visual-layout-final
          python3 -m http.server 8000 >/tmp/rebloom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > visual-layout-final.cjs <<'JS'
          const { chromium } = require('playwright-core');
          const fs=require('fs');
          const base='http://127.0.0.1:8000/';
          const files=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html'];
          const vps=[{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            const report=[];
            for(const vp of vps){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              for(const file of files){
                const page=await ctx.newPage(); const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                await page.route('**/*',route=>{const u=route.request().url();if(u.startsWith(base)||u.startsWith('data:')||u.startsWith('blob:'))return route.continue();return route.abort();});
                const res=await page.goto(base+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(900);
                await page.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=650){scrollTo(0,y);await new Promise(r=>setTimeout(r,12));}scrollTo(0,0)});
                await page.waitForTimeout(150);
                const m=await page.evaluate(()=>{
                  const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>8&&r.height>8};
                  const cards=[...new Set([...document.querySelectorAll('article,.join-fact,.nr-choice,.rb-detail-card,.definition-card,.faq-card,.story-step,.rbpc-venue-facts>span')])].filter(visible);
                  const outside=[];
                  for(const card of cards){
                    const r=card.getBoundingClientRect(); const walker=document.createTreeWalker(card,NodeFilter.SHOW_TEXT); let n; let bad=false; let sample='';
                    while(n=walker.nextNode()){
                      if(!n.textContent.trim()) continue; const range=document.createRange(); range.selectNodeContents(n);
                      for(const tr of range.getClientRects()){
                        if(tr.width<1||tr.height<1) continue;
                        if(tr.left<r.left-2||tr.right>r.right+2||tr.top<r.top-2||tr.bottom>r.bottom+2){bad=true;sample=n.textContent.trim().slice(0,60);break;}
                      }
                      if(bad) break;
                    }
                    if(bad) outside.push({tag:card.tagName.toLowerCase(),cls:(card.className||'').toString().slice(0,160),text:(card.innerText||'').trim().replace(/\s+/g,' ').slice(0,90),sample,w:Math.round(r.width),h:Math.round(r.height)});
                  }
                  const sections=[...document.querySelectorAll('main>section')].filter(visible).map(sec=>{const r=sec.getBoundingClientRect(),s=getComputedStyle(sec);return {cls:(sec.className||'').toString().slice(0,150),h:Math.round(r.height),pt:Math.round(parseFloat(s.paddingTop)||0),pb:Math.round(parseFloat(s.paddingBottom)||0)}});
                  const excessive=sections.filter(x=>x.h>680&&(x.pt+x.pb)>145);
                  return {docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,textOutside:outside,excessive};
                });
                report.push({file,viewport:vp.name,status:res?.status(),errors,m});
                await page.screenshot({path:`visual-layout-final/${file.replace('.html','')}-${vp.name}.png`,fullPage:true});
                await page.close();
              }
              await ctx.close();
            }
            fs.writeFileSync('visual-layout-final/report.json',JSON.stringify(report,null,2));
            const summary=report.map(x=>({file:x.file,vp:x.viewport,status:x.status,docOverflow:x.m.docOverflow,textOutside:x.m.textOutside.length,excessive:x.m.excessive.length,errors:x.errors.length}));
            console.log(JSON.stringify(summary,null,2));
            const hard=report.filter(x=>x.status>=400||x.errors.length||x.m.docOverflow>2||x.m.textOutside.length);
            if(hard.length){console.error('HARD',JSON.stringify(hard.map(x=>({file:x.file,vp:x.viewport,textOutside:x.m.textOutside,errors:x.errors,doc:x.m.docOverflow})),null,2));process.exit(1)}
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-layout-final.cjs
      - name: Upload final audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-layout-final-v
          path: visual-layout-final
          retention-days: 2
