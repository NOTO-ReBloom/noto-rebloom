name: Polish round Q

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css=Path('rebloom-purpose-complete.css')
          t=css.read_text(encoding='utf-8')
          old='body.rb-unified.page-diagnosis .rbpc-atlas-filters button{min-height:40px;padding:8px 13px!important}'
          new='body.rb-unified.page-diagnosis .rbpc-atlas-filters button{min-height:44px!important;min-width:44px;padding:9px 13px!important}'
          if old in t:
              t=t.replace(old,new)
          elif new not in t:
              raise SystemExit('atlas filter rule not found')
          marker='/* FINAL POLISH: upcoming milestone remains readable on the light dashed marker. */'
          if marker not in t:
              t += '\n\n'+marker+'\nbody.rb-unified #project-story .story-step.is-next .story-dot{color:var(--rbpc-green)!important;font-size:11px!important;font-weight:900!important}\n'
          css.write_text(t,encoding='utf-8')

          home=Path('index.html')
          t=home.read_text(encoding='utf-8')
          old='<span class="story-dot">9.20</span><small>次へ</small><h3>報告会、そして泥ん子運動会</h3>'
          new='<span class="story-dot">9.20</span><small>9.19報告会 → 9.20本番</small><h3>報告会から、泥ん子運動会へ</h3>'
          if old in t:
              t=t.replace(old,new)
          elif new not in t:
              raise SystemExit('home final timeline text not found')
          home.write_text(t,encoding='utf-8')

          p=Path('404.html')
          t=p.read_text(encoding='utf-8').replace('site.js?v=20260813e','site.js?v=20260813i')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Validate polish
        run: |
          node --check rebloom-tight.js
          node --check rebloom-unified.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('rebloom-purpose-complete.css').read_text(encoding='utf-8')
          assert css.count('{')==css.count('}')
          assert 'min-height:44px!important;min-width:44px' in css
          home=Path('index.html').read_text(encoding='utf-8')
          assert '9.19報告会 → 9.20本番' in home
          assert '報告会から、泥ん子運動会へ' in home
          assert 'site.js?v=20260813i' in Path('404.html').read_text(encoding='utf-8')
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebloom-purpose-complete.css index.html 404.html
          git diff --cached --quiet || git commit -m "表示監査で見つかった細部を修正"
          git push
