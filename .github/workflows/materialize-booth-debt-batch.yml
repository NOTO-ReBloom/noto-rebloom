name: Materialize BOOTH paid debt batch

on:
  push:
    paths:
      - '.github/workflows/materialize-booth-debt-batch.yml'
      - 'sidehustle-autopublish/builders/materialize_booth_debt_batch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: booth-debt-batch-materialization
  cancel-in-progress: false

jobs:
  build-encrypt-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check cryptography pillow
      - name: Build, QA, encrypt and queue 14 complete products
        run: python sidehustle-autopublish/builders/materialize_booth_debt_batch.py
      - name: Commit encrypted queue materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add booth-autopublish/queue booth-autopublish/monitor/cloud_materialization_20260822.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize 14 encrypted BOOTH debt-recovery products'
          git push
