name: Quality Pass Temp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused improvements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          appeal = r'''(()=>{
            'use strict';
            const body=document.body;
            if(!body||body.dataset.rbAppealReady==='1')return;
            body.dataset.rbAppealReady='1';
            if(body.classList.contains('nr-new-event')){
              const summary=document.querySelector('.event-summary');
              if(summary&&!document.querySelector('.rb-mud-energy')){
                const energy=document.createElement('section');
                energy.className='rb-mud-energy';
                energy.innerHTML=`<div class="rb-mud-energy__inner"><small>MUD SPORTS DAY</small><h2>走るだけじゃない。探す、投げる、運ぶ、そして笑う。</h2><p>泥の中だから、いつもの運動会とはちょっと違う。うまく走れなくても、泥だらけになるだけで面白い。子どもも大人も一緒に楽しめる一日にします。</p><div class="rb-mud-verbs" aria-label="泥ん子運動会の楽しみ方"><span>泥に入る</span><span>みんなで協力</span><span>思いきり笑う</span><span>全身どろんこ</span></div></div>`;
                summary.insertAdjacentElement('afterend',energy);
              }
            }
          })();
          '''
          Path('rebloom-appeal.js').write_text(appeal,encoding='utf-8')

          p=Path('rebloom-experience.css'); s=p.read_text(encoding='utf-8')
          old='''@media(max-width:430px){\n  .rb-glance-flow{grid-template-columns:1fr 1fr}\n  .rb-glance-ill{height:84px}\n  .rb-glance-flow article{padding:10px}\n  .rb-glance-flow article h3{font-size:15px}\n  .rb-glance-flow article p{font-size:10px}\n  .nr-new-event .rb-play-grid article{grid-template-columns:1fr!important}\n  .rb-play-ill{height:150px}\n  .rb-play-copy h3{font-size:21px!important}\n  .rb-play-copy p{font-size:11.5px!important}\n}'''
          new='''@media(max-width:430px){\n  .rb-glance-flow{grid-template-columns:1fr 1fr}\n  .rb-glance-ill{height:84px}\n  .rb-glance-flow article{padding:10px}\n  .rb-glance-flow article h3{font-size:15px}\n  .rb-glance-flow article p{font-size:10px}\n  .nr-new-event .rb-mud-play-section{padding-top:22px!important;padding-bottom:22px!important}\n  .rb-mud-play-section .section-heading{margin-bottom:14px!important}\n  .rb-mud-play-section .section-heading>p:last-child{font-size:12px!important;line-height:1.65!important}\n  .rb-play-status{margin-top:10px}\n  .nr-new-event .rb-play-grid{gap:8px!important}\n  .nr-new-event .rb-play-grid article{grid-template-columns:94px minmax(0,1fr)!important;gap:9px!important;padding:10px!important}\n  .rb-play-ill{height:100px;border-radius:13px}\n  .rb-play-copy h3{font-size:17.5px!important;margin-top:1px!important;margin-bottom:4px!important}\n  .rb-play-copy p{font-size:10.5px!important;line-height:1.5!important}\n  .rb-play-copy b{display:none!important}\n  .rb-play-note{margin-top:9px!important;padding:9px 10px;font-size:10px!important;line-height:1.55!important}\n  .rb-play-cta{margin-top:9px;padding:12px 13px;gap:9px}\n  .rb-play-cta strong{font-size:15px}\n  .rb-play-cta span{display:none}\n}'''
          if old not in s: raise SystemExit('experience block missing')
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          p=Path('rebloom-appeal.css'); s=p.read_text(encoding='utf-8')
          s += '''\n@media(max-width:520px){\n  .rb-mud-energy{padding:18px 0 4px}\n  .rb-mud-energy__inner{padding:16px 15px;border-radius:20px}\n  .rb-mud-energy h2{font-size:23px;line-height:1.32}\n  .rb-mud-energy p{font-size:12.5px;line-height:1.65}\n  .rb-mud-verbs{gap:5px;margin-top:10px}\n  .rb-mud-verbs span{padding:5px 8px;font-size:10px}\n}\n'''
          p.write_text(s,encoding='utf-8')

          p=Path('reboost-studio.css'); s=p.read_text(encoding='utf-8')
          old='''  .rb-reboost-program{grid-template-columns:1fr;gap:6px}\n  .rb-reboost-highlight{font-size:13px}\n}'''
          new='''  .rb-reboost-program{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}\n  .rb-reboost-program li{flex:0 1 auto;padding:7px 9px;border-radius:999px;font-size:11px;line-height:1.35}\n  .rb-reboost-highlight{font-size:13px}\n}'''
          if old not in s: raise SystemExit('reboost block missing')
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          p=Path('rebloom-detail.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("ensureStyle('rebloom-experience.css','rebloom-experience.css?v=20260817ab');","ensureStyle('rebloom-experience.css','rebloom-experience.css?v=20260817ad');")
          s=s.replace("ensureStyle('rebloom-appeal.css','rebloom-appeal.css?v=20260817a1');","ensureStyle('rebloom-appeal.css','rebloom-appeal.css?v=20260817ad');\n  ensureStyle('reboost-studio.css','reboost-studio.css?v=20260817ad');")
          s=s.replace("ensureScript('rebloom-experience.js','rebloom-experience.js?v=20260817ab');","ensureScript('rebloom-experience.js','rebloom-experience.js?v=20260817ad');")
          s=s.replace("ensureScript('rebloom-appeal.js','rebloom-appeal.js?v=20260817a1');","ensureScript('rebloom-appeal.js','rebloom-appeal.js?v=20260817ad');")
          p.write_text(s,encoding='utf-8')
          PY
      - run: npm install --no-save playwright-core@1.55.0
      - name: Audit all pages
        run: |
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            for(const [view,w,h] of [['desktop',1440,1000],['mobile',390,844]]){
              const ctx=await b.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'});
              for(const file of ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']){
                const p=await ctx.newPage(), errors=[]; p.on('pageerror',e=>errors.push(String(e)));
                const res=await p.goto('http://127.0.0.1:8000/'+file,{waitUntil:'domcontentloaded',timeout:20000}); await p.waitForTimeout(1400);
                const m=await p.evaluate(()=>{const H=s=>{const e=document.querySelector(s);return e?Math.round(e.getBoundingClientRect().height):0};return {overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,height:document.documentElement.scrollHeight,snapshot:document.querySelectorAll('.rb-project-snapshot').length,glance:document.querySelectorAll('.rb-project-glance').length,playCards:document.querySelectorAll('.rb-play-grid article').length,playSvgs:document.querySelectorAll('.rb-play-grid .rb-play-ill svg').length,playH:H('.rb-mud-play-section'),reboostH:H('#reboost-studio'),reboostTags:document.querySelectorAll('#reboost-studio .rb-reboost-program li').length}});
                if(!res||res.status()>=400||errors.length||m.overflow>2)throw new Error(file+'/'+view+' '+JSON.stringify({errors,m}));
                if(file==='index.html'&&(m.snapshot||m.glance!==1))throw new Error('home duplicate '+view+' '+JSON.stringify(m));
                if(file==='event.html'&&(m.playCards!==4||m.playSvgs!==4||m.reboostTags!==7))throw new Error('event content '+view+' '+JSON.stringify(m));
                if(file==='event.html'&&view==='mobile'&&m.playH>1450)throw new Error('play height '+JSON.stringify(m));
                if(file==='event.html'&&view==='mobile'&&m.reboostH>1150)throw new Error('reboost height '+JSON.stringify(m));
                console.log(file,view,m); await p.close();
              } await ctx.close();
            } await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8000 >/tmp/q.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1; node audit.cjs
      - name: Commit improvements
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f audit.cjs
          git add rebloom-appeal.js rebloom-experience.css rebloom-appeal.css reboost-studio.css rebloom-detail.js
          git commit -m '重複説明を整理しスマホの情報密度を改善'
          git push
