name: Post-crowdfunding cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-crowdfunding-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove ended crowdfunding CTAs and keep result links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          READYFOR = 'https://readyfor.jp/projects/kousakuhoukiti-saisei'
          anchor_re = re.compile(
              r'<a\b[^>]*href=["\'][^"\']*readyfor\.jp/projects/kousakuhoukiti-saisei[^"\']*["\'][^>]*>.*?</a>',
              re.I | re.S,
          )

          def clean_anchor(match):
              html = match.group(0)
              text = re.sub(r'<[^>]+>', '', html)
              # 終了後に見るための「結果・活動報告」リンクだけは残す。
              if any(word in text for word in ('結果', '活動報告')):
                  return html
              return ''

          for path in Path('.').glob('*.html'):
              original = path.read_text(encoding='utf-8')
              text = anchor_re.sub(clean_anchor, original)

              # READYFORへの履歴リンクがないページには、フッターに小さく追加する。
              if '2026年クラウドファンディング結果' not in text and '</footer>' in text:
                  history = (
                      f'<a class="text-link crowdfunding-history-link" href="{READYFOR}" '
                      'target="_blank" rel="noopener">2026年クラウドファンディング結果</a>'
                  )
                  text = text.replace('</footer>', history + '</footer>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'updated: {path}')

          # 念のため残存リンクを確認。結果・活動報告リンク以外があれば失敗させる。
          bad = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              for m in anchor_re.finditer(text):
                  label = re.sub(r'<[^>]+>', '', m.group(0))
                  if not any(word in label for word in ('結果', '活動報告')):
                      bad.append((str(path), label.strip()))
          if bad:
              raise SystemExit('Unexpected READYFOR CTA remains: ' + repr(bad))
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "終了済みクラファンの支援導線を全ページから削除"
          git push
