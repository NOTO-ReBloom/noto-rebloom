name: Audit sponsor effect and crowdfunding fix

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit runtime
        run: npm install --no-save playwright-core@1.55.0
      - name: Run rendered checks
        run: |
          mkdir -p visual-audit
          python3 -m http.server 8000 >/tmp/rebloom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > visual-audit.cjs <<'JS'
          const { chromium } = require('playwright-core');
          const base='http://127.0.0.1:8000/';
          const files=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html'];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            for(const vp of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              for(const file of files){
                const page=await ctx.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                await page.route('**/*',route=>{
                  const u=route.request().url();
                  if(u.startsWith(base)||u.startsWith('data:')||u.startsWith('blob:')) return route.continue();
                  return route.abort();
                });
                const res=await page.goto(base+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(700);
                if(!res||res.status()>=400) throw new Error(`${file}/${vp.name}: HTTP`);
                if(errors.length) throw new Error(`${file}/${vp.name}: ${errors.join(' | ')}`);
                const common=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,broken:[...document.images].filter(i=>i.offsetParent!==null&&i.naturalWidth===0).map(i=>i.src)}));
                if(common.overflow>2) throw new Error(`${file}/${vp.name}: horizontal overflow ${common.overflow}`);
                if(common.broken.length) throw new Error(`${file}/${vp.name}: broken images ${common.broken}`);
                if(file==='index.html'||file==='partner.html'){
                  const sponsor=await page.evaluate(()=>{
                    const section=document.querySelector('.nr-sponsor-feature--spotlight');
                    const logo=section?.querySelector('.nr-sponsor-logo img');
                    const cta=section?.querySelector('.nr-sponsor-primary');
                    const features=section?.querySelectorAll('.nr-navi-features span,.nr-navi-guide article').length||0;
                    const sr=section?.getBoundingClientRect(),lr=logo?.getBoundingClientRect(),cr=cta?.getBoundingClientRect();
                    return {section:!!section,logoNatural:logo?.naturalWidth||0,logoVisible:!!lr&&lr.width>80&&lr.height>30,ctaVisible:!!cr&&cr.width>100&&cr.height>=44,features,sectionWidth:sr?.width||0};
                  });
                  if(!sponsor.section||!sponsor.logoNatural||!sponsor.logoVisible||!sponsor.ctaVisible||sponsor.features<3) throw new Error(`${file}/${vp.name}: sponsor ${JSON.stringify(sponsor)}`);
                  await page.locator('.nr-sponsor-feature--spotlight').screenshot({path:`visual-audit/${file.replace('.html','')}-sponsor-${vp.name}.png`});
                }
                if(file==='index.html'){
                  const proof=await page.evaluate(()=>{
                    const section=document.querySelector('#crowdfunding-result');
                    const cards=[...section.querySelectorAll('.rb-proof-card')];
                    return cards.map(card=>{
                      const h=card.querySelector('h3'); const r=card.getBoundingClientRect(); const hr=h.getBoundingClientRect();
                      return {text:h.textContent.trim(),inside:hr.left>=r.left-1&&hr.right<=r.right+1&&hr.top>=r.top-1&&hr.bottom<=r.bottom+1,cardW:r.width,hW:hr.width,scrollW:card.scrollWidth,clientW:card.clientWidth};
                    });
                  });
                  if(proof.length!==2||!proof.every(x=>x.inside&&x.scrollW<=x.clientW+2)||proof[0].text!=='186,000円'||proof[1].text!=='10名') throw new Error(`proof/${vp.name}: ${JSON.stringify(proof)}`);
                  await page.locator('#crowdfunding-result').screenshot({path:`visual-audit/crowdfunding-${vp.name}.png`});
                }
                await page.close();
              }
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-audit.cjs
      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-crowdfunding-visual-audit
          path: visual-audit
          retention-days: 2
