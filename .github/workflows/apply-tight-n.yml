name: Apply tight N

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and files
        run: |
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          node --check rebloom-refine.js
          node --check rebloom-tight.js
          test -f rebloom-tight.css
          test -f rebloom-balance.css
      - name: Bump loading chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('rebloom-unified.js')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'rebloom-detail\.js\?v=20260817[a-z]', 'rebloom-detail.js?v=20260817n', t)
          p.write_text(t,encoding='utf-8')
          assert 'rebloom-detail.js?v=20260817n' in t
          for name in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              p=Path(name)
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'rebloom-unified\.js\?v=20260817[a-z]', 'rebloom-unified.js?v=20260817n', t)
              p.write_text(t,encoding='utf-8')
              assert 'rebloom-unified.js?v=20260817n' in t, name
          PY
      - name: Commit cache update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebloom-unified.js index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "余白最適化版を全公開ページへ反映"
          git push
