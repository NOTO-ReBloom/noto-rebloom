name: Visual layout audit U
# rerun after layout fit pass
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit runtime
        run: npm install --no-save playwright-core@1.55.0
      - name: Audit layouts
        run: |
          mkdir -p visual-layout-audit
          python3 -m http.server 8000 >/tmp/rebloom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > visual-layout-audit.cjs <<'JS'
          const { chromium } = require('playwright-core');
          const fs=require('fs');
          const base='http://127.0.0.1:8000/';
          const files=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html'];
          const viewports=[{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            const report=[];
            for(const vp of viewports){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              for(const file of files){
                const page=await ctx.newPage();
                const pageErrors=[];
                page.on('pageerror',e=>pageErrors.push(String(e)));
                await page.route('**/*',route=>{
                  const u=route.request().url();
                  if(u.startsWith(base)||u.startsWith('data:')||u.startsWith('blob:')) return route.continue();
                  return route.abort();
                });
                const res=await page.goto(base+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(900);
                await page.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=700){scrollTo(0,y);await new Promise(r=>setTimeout(r,15));}scrollTo(0,0)});
                await page.waitForTimeout(200);
                const metrics=await page.evaluate(()=>{
                  const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>4&&r.height>4};
                  const label=el=>({tag:el.tagName.toLowerCase(),id:el.id||'',cls:(el.className||'').toString().slice(0,180),text:(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,100)});
                  const els=[...document.querySelectorAll('article,[class*="card"],[class*="grid"]>*,.join-fact,.status-chips>span,.rbpc-venue-facts>span,.story-step')].filter(visible);
                  const overflow=[]; const dense=[];
                  for(const el of els){
                    const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                    if(el.scrollWidth>el.clientWidth+3||el.scrollHeight>el.clientHeight+3){overflow.push({...label(el),w:Math.round(r.width),h:Math.round(r.height),sw:el.scrollWidth,cw:el.clientWidth,sh:el.scrollHeight,ch:el.clientHeight,overflowX:s.overflowX,overflowY:s.overflowY});}
                    const heads=[...el.querySelectorAll(':scope > h2,:scope > h3,:scope > strong,:scope > b')].filter(visible);
                    for(const h of heads){const hr=h.getBoundingClientRect(),hs=getComputedStyle(h);const font=parseFloat(hs.fontSize);const lines=Math.max(1,Math.round(hr.height/parseFloat(hs.lineHeight||font*1.2)));if(r.width<270&&font>=20&&lines>=3){dense.push({...label(el),cardW:Math.round(r.width),heading:(h.innerText||'').trim().slice(0,80),font:Math.round(font),lines});}}
                  }
                  const sections=[...document.querySelectorAll('main>section')].filter(visible).map(sec=>{const r=sec.getBoundingClientRect(),s=getComputedStyle(sec);const kids=[...sec.children].filter(visible);let top=Infinity,bottom=-Infinity;if(kids.length){for(const k of kids){const kr=k.getBoundingClientRect();top=Math.min(top,kr.top);bottom=Math.max(bottom,kr.bottom)}}const empty=Math.max(0,r.height-(bottom-top));return {...label(sec),height:Math.round(r.height),padTop:Math.round(parseFloat(s.paddingTop)||0),padBottom:Math.round(parseFloat(s.paddingBottom)||0),empty:Math.round(empty)};});
                  const largeSpace=sections.filter(x=>x.height>600&&(x.padTop+x.padBottom>150||x.empty>240));
                  return {docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,overflow,dense,largeSpace,sections};
                });
                report.push({file,viewport:vp.name,status:res?.status(),pageErrors,metrics});
                await page.screenshot({path:`visual-layout-audit/${file.replace('.html','')}-${vp.name}.png`,fullPage:true});
                await page.close();
              }
              await ctx.close();
            }
            fs.writeFileSync('visual-layout-audit/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report.map(x=>({file:x.file,vp:x.viewport,docOverflow:x.metrics.docOverflow,overflow:x.metrics.overflow.length,dense:x.metrics.dense.length,largeSpace:x.metrics.largeSpace.length,errors:x.pageErrors.length})),null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-layout-audit.cjs
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-layout-audit-u
          path: visual-layout-audit
          retention-days: 2
