name: Final refine M

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and final layer
        run: |
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          node --check rebloom-refine.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('rebloom-refine.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'unbalanced CSS braces'
          detail=Path('rebloom-detail.js').read_text(encoding='utf-8')
          unified=Path('rebloom-unified.js').read_text(encoding='utf-8')
          for legacy in ['rebloom-mudfx.js','rebloom-fun.js','rebloom-cinematic.js']:
              assert legacy not in detail, f'legacy layer still loaded: {legacy}'
              assert legacy not in unified, f'legacy layer still loaded: {legacy}'
          assert 'rebloom-refine.css?v=20260817l' in detail
          assert 'rebloom-refine.js?v=20260817l' in detail
          assert 'rebloom-detail.js?v=20260817l' in unified
          PY
      - name: Bump public cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']
          for name in pages:
              p=Path(name)
              t=p.read_text(encoding='utf-8')
              for old in ['rebloom-unified.js?v=20260817i','rebloom-unified.js?v=20260817j','rebloom-unified.js?v=20260817k','rebloom-unified.js?v=20260817l']:
                  t=t.replace(old,'rebloom-unified.js?v=20260817m')
              assert 'rebloom-unified.js?v=20260817m' in t, name
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "最終調整版を全公開ページへ反映"
          git push
