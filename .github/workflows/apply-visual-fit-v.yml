name: Apply visual fit V
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive visual fit layer
        run: |
          cat > rebloom-fit.css <<'CSS'
          /* NOTO Re:Bloom — responsive visual fit pass / 2026-08-17 */
          /* Goal: readable cards at every width, with less dead space and no text forced into narrow fixed boxes. */
          body.rb-unified .rb-detail-card,
          body.rb-unified .rb-detail-card>*{box-sizing:border-box;min-width:0}
          body.rb-unified :is(.rb-detail-card,.join-fact,.summary-grid>div,.faq-card) :is(h2,h3,p,strong,b,span,small,a){max-width:100%;overflow-wrap:break-word;word-break:normal}
          body.rb-unified :is(.btn,.nr-btn,.rb-mobile-join a){white-space:normal;text-align:center;line-height:1.35}

          /* Global vertical rhythm: retain separation, remove poster-like empty bands. */
          body.rb-unified .section{padding-top:clamp(40px,4.2vw,54px)!important;padding-bottom:clamp(40px,4.2vw,54px)!important}
          body.rb-unified .rb-tight-sparse{padding-top:clamp(30px,3.5vw,42px)!important;padding-bottom:clamp(30px,3.5vw,42px)!important}
          body.rb-unified .section-heading{margin-bottom:16px!important}
          body.rb-unified :is(.nr-home-hero,.page-hero):not(.page-hero--diagnosis){padding-top:112px!important;padding-bottom:34px!important}
          body.rb-unified :is(.hero-grid,.page-hero-grid){gap:clamp(24px,3.2vw,40px)!important}
          body.rb-unified :is(.nr-home-hero,.nr-new-event .page-hero,.page-learn .page-hero,.nr-new-partner .page-hero) .photo-frame img{height:clamp(300px,34vw,430px)!important}
          body.rb-unified .visual-mosaic-section{padding-top:28px!important;padding-bottom:38px!important}
          body.rb-unified .nr-value-prop,body.rb-unified .nr-sponsor-feature{padding-top:38px!important;padding-bottom:38px!important}

          /* Home facts: keep the 4-value scan, but never clip the third line. */
          body.rb-unified .join-facts{grid-template-columns:repeat(4,minmax(0,1fr))!important}
          body.rb-unified .join-fact{height:auto!important;min-height:112px!important;padding:13px 14px!important;overflow:visible!important;align-content:center}
          body.rb-unified .join-fact strong{font-size:clamp(26px,2.5vw,34px)!important;line-height:1.08!important;letter-spacing:-.025em}
          body.rb-unified .join-fact span{font-size:12.5px!important;line-height:1.45!important}

          /* General content cards: content determines height. Equal-height rows come from grid stretch, not clipping. */
          body.rb-unified :is(.event-values article,.definition-card,.cause-grid article,.game-grid article,.check-list>div,.nr-value-grid article,.industry-grid article,.faq-card){height:auto!important;min-height:0!important}
          body.rb-unified :is(.event-values article,.definition-card,.cause-grid article,.game-grid article,.check-list>div,.nr-value-grid article,.industry-grid article,.faq-card) h3{line-height:1.35!important}
          body.rb-unified :is(.event-values article,.definition-card,.cause-grid article,.game-grid article,.check-list>div,.nr-value-grid article,.industry-grid article,.faq-card) p{line-height:1.68!important}

          /* Event facts: fixed 74px shells were too short for labels + values. */
          body.rb-unified .rbpc-logistics-grid>div,body.rb-unified .summary-grid>div{height:auto!important;min-height:88px!important;padding:12px 14px!important;overflow:visible!important;justify-content:center!important}
          body.rb-unified .rbpc-logistics-grid>div b,body.rb-unified .summary-grid>div b{font-size:clamp(19px,1.7vw,23px)!important;line-height:1.18!important;overflow-wrap:normal}
          body.rb-unified .rbpc-logistics-grid>div span,body.rb-unified .summary-grid>div span{font-size:11.5px!important;line-height:1.35!important}
          body.rb-unified .rbpc-schedule-flow article{height:auto!important;min-height:0!important}

          /* Sponsor: use the available width. The previous 820px shell made both desktop columns and mobile copy unnecessarily narrow. */
          body.rb-unified .nr-main-sponsor--navi{width:100%!important;max-width:1040px!important;margin-inline:auto!important;box-sizing:border-box!important}
          body.rb-unified .nr-main-sponsor--navi::after{display:none!important}
          body.rb-unified .nr-main-sponsor--navi>*{min-width:0!important}
          body.rb-unified .nr-sponsor-thanks{max-width:100%;white-space:normal!important}
          body.rb-unified .nr-navi-guide article{height:auto!important;min-height:0!important;min-width:0!important}
          body.rb-unified .nr-main-sponsor--navi .nr-sponsor-story h3{font-size:clamp(24px,2.5vw,34px)!important;line-height:1.35!important}

          /* Sponsor benefits: four cards in one row produced ~200px text columns. Use a 2×2 decision grid. */
          body.rb-unified .nr-new-partner .nr-value-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;max-width:1040px;margin-inline:auto}
          body.rb-unified .nr-new-partner .nr-value-grid article{padding:20px 21px!important;display:grid!important;grid-template-columns:42px minmax(0,1fr)!important;column-gap:12px;align-items:start!important}
          body.rb-unified .nr-new-partner .nr-value-grid article>span{grid-row:1/3!important;margin:0!important}
          body.rb-unified .nr-new-partner .nr-value-grid article h3{margin:1px 0 5px!important;font-size:21px!important;line-height:1.35!important}
          body.rb-unified .nr-new-partner .nr-value-grid article p{font-size:14px!important;line-height:1.65!important}

          /* FAQ is utility content. On phones, one full-width answer is easier than two narrow columns. */
          body.rb-unified .nr-new-event .faq-card{height:auto!important;min-height:0!important}

          /* At laptop widths, 4-step process cards become cramped. Switch before they reach that point. */
          @media(max-width:1120px){
            body.rb-unified #purpose .rbpc-process-flow{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            body.rb-unified #purpose .rbpc-process-flow::before{display:none!important}
          }

          @media(max-width:900px){
            body.rb-unified .join-facts{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            body.rb-unified .join-fact{min-height:94px!important;padding:11px 12px!important}
            body.rb-unified .join-fact strong{font-size:27px!important}
            body.rb-unified .nr-main-sponsor--navi{max-width:680px!important}
          }

          @media(max-width:700px){
            body.rb-unified .nr-new-event :is(.rbpc-question-grid,.faq-grid){grid-template-columns:1fr!important}
            body.rb-unified .nr-new-event .rbpc-question-grid .faq-card{border-right:0!important}
            body.rb-unified .nr-new-partner .nr-value-grid{grid-template-columns:1fr!important}
            body.rb-unified .rbpc-logistics-grid>div,body.rb-unified .summary-grid>div{min-height:82px!important;padding:11px 12px!important}
          }

          @media(max-width:620px){
            body.rb-unified :is(.nr-home-hero,.page-hero):not(.page-hero--diagnosis){padding-top:86px!important;padding-bottom:24px!important}
            body.rb-unified :is(.hero-grid,.page-hero-grid){gap:18px!important}
            body.rb-unified :is(.nr-home-hero,.nr-new-event .page-hero,.page-learn .page-hero,.nr-new-partner .page-hero) .photo-frame img{height:225px!important}
            body.rb-unified .section{padding-top:28px!important;padding-bottom:28px!important}
            body.rb-unified .rb-tight-sparse{padding-top:24px!important;padding-bottom:24px!important}
            body.rb-unified .visual-mosaic-section{padding-top:22px!important;padding-bottom:28px!important}
            body.rb-unified .nr-value-prop,body.rb-unified .nr-sponsor-feature{padding-top:28px!important;padding-bottom:28px!important}
            body.rb-unified .nr-main-sponsor--navi{width:100%!important;max-width:none!important;padding:18px 16px!important}
            body.rb-unified .nr-main-sponsor--navi .nr-sponsor-story h3{font-size:24px!important}
            body.rb-unified .nr-sponsor-thanks{font-size:9.5px!important;line-height:1.35!important;padding:6px 9px!important}
            body.rb-unified .nr-new-partner .nr-value-grid article{padding:16px 17px!important;grid-template-columns:38px minmax(0,1fr)!important}
            body.rb-unified .nr-new-partner .nr-value-grid article h3{font-size:19px!important}
            body.rb-unified .nr-new-partner .nr-value-grid article p{font-size:13.5px!important}
            body.rb-unified .section-heading h2,body.rb-unified .split-story h2{line-height:1.24!important}
          }

          @media(max-width:420px){
            body.rb-unified .join-fact strong{font-size:24px!important}
            body.rb-unified .join-fact span{font-size:11.5px!important}
            body.rb-unified .join-fact small{font-size:9px!important}
            body.rb-unified .rbpc-logistics-grid>div b,body.rb-unified .summary-grid>div b{font-size:20px!important}
          }
          CSS
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('rebloom-detail.js')
          s=p.read_text(encoding='utf-8')
          if "ensureStyle('rebloom-fit.css'" not in s:
              needle="ensureStyle('rebloom-purpose-complete.css','rebloom-purpose-complete.css?v=20260817u');"
              if needle not in s:
                  raise SystemExit('purpose-complete loader not found')
              s=s.replace(needle,needle+"\n  ensureStyle('rebloom-fit.css','rebloom-fit.css?v=20260817v');")
          else:
              s=re.sub(r"rebloom-fit\.css\?v=20260817[a-z]","rebloom-fit.css?v=20260817v",s)
          p.write_text(s,encoding='utf-8')

          p=Path('rebloom-unified.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'rebloom-detail\.js\?v=20260817[a-z]','rebloom-detail.js?v=20260817v',s)
          p.write_text(s,encoding='utf-8')

          for name in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=re.sub(r'rebloom-unified\.js\?v=20260817[a-z]','rebloom-unified.js?v=20260817v',s)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate source
        run: |
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('rebloom-fit.css').read_text(encoding='utf-8')
          assert css.count('{')==css.count('}')
          assert 'nr-new-partner .nr-value-grid{grid-template-columns:repeat(2' in css
          assert 'faq-grid){grid-template-columns:1fr' in css
          assert "rebloom-fit.css?v=20260817v" in Path('rebloom-detail.js').read_text(encoding='utf-8')
          for n in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              assert 'rebloom-unified.js?v=20260817v' in Path(n).read_text(encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit runtime
        run: npm install --no-save playwright-core@1.55.0
      - name: Render and inspect card fit
        run: |
          mkdir -p visual-fit-v
          python3 -m http.server 8000 >/tmp/rebloom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > visual-fit-v.cjs <<'JS'
          const { chromium }=require('playwright-core');
          const fs=require('fs');
          const base='http://127.0.0.1:8000/';
          const files=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html'];
          const viewports=[{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            const report=[];
            for(const vp of viewports){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              for(const file of files){
                const page=await ctx.newPage();
                const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
                await page.route('**/*',route=>{const u=route.request().url();if(u.startsWith(base)||u.startsWith('data:')||u.startsWith('blob:'))return route.continue();return route.abort()});
                const res=await page.goto(base+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(1000);
                await page.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=650){scrollTo(0,y);await new Promise(r=>setTimeout(r,10));}scrollTo(0,0)});
                await page.waitForTimeout(200);
                const metrics=await page.evaluate(()=>{
                  const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>4&&r.height>4};
                  const grids=[...document.querySelectorAll('.join-facts,.summary-grid,.event-values,.game-grid,.check-list,.nr-value-grid,.industry-grid,.faq-grid,.rbpc-logistics-grid')].filter(visible).map(g=>({cls:g.className.toString(),cols:getComputedStyle(g).gridTemplateColumns,width:Math.round(g.getBoundingClientRect().width)}));
                  const cards=[...document.querySelectorAll('.join-fact,.summary-grid>div,.event-values article,.definition-card,.cause-grid article,.game-grid article,.check-list>div,.nr-value-grid article,.industry-grid article,.faq-card,.nr-main-sponsor--navi,.diagnosis-start-card')].filter(visible);
                  const textOutside=[];
                  for(const card of cards){
                    const cr=card.getBoundingClientRect();
                    const nodes=[...card.querySelectorAll('h2,h3,p,strong,b,small,a')].filter(visible);
                    for(const n of nodes){
                      if(getComputedStyle(n).position==='absolute')continue;
                      const r=n.getBoundingClientRect();
                      if(r.left<cr.left-3||r.right>cr.right+3||r.top<cr.top-3||r.bottom>cr.bottom+3){textOutside.push({card:(card.className||card.tagName).toString().slice(0,100),text:(n.innerText||'').trim().replace(/\s+/g,' ').slice(0,80),cardW:Math.round(cr.width),nodeW:Math.round(r.width),left:Math.round(r.left-cr.left),right:Math.round(r.right-cr.right),top:Math.round(r.top-cr.top),bottom:Math.round(r.bottom-cr.bottom)});break;}
                    }
                  }
                  return {docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,textOutside,grids};
                });
                if(!res||res.status()>=400) throw new Error(`${file}/${vp.name}: HTTP ${res&&res.status()}`);
                if(errors.length) throw new Error(`${file}/${vp.name}: ${errors.join(' | ')}`);
                if(metrics.docOverflow>2) throw new Error(`${file}/${vp.name}: document overflow ${metrics.docOverflow}`);
                if(metrics.textOutside.length) throw new Error(`${file}/${vp.name}: text outside ${JSON.stringify(metrics.textOutside.slice(0,4))}`);
                report.push({file,viewport:vp.name,...metrics});
                await page.screenshot({path:`visual-fit-v/${file.replace('.html','')}-${vp.name}.png`,fullPage:true});
                await page.close();
              }
              await ctx.close();
            }
            fs.writeFileSync('visual-fit-v/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report.map(x=>({file:x.file,viewport:x.viewport,docOverflow:x.docOverflow,grids:x.grids})),null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-fit-v.cjs
      - name: Commit site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rebloom-fit.css rebloom-detail.js rebloom-unified.js index.html learn.html event.html partner.html diagnosis.html 404.html
          git commit -m 'PC・スマホの余白とカード文字収まりを改善'
          git push
      - name: Upload visual review
        uses: actions/upload-artifact@v4
        with:
          name: visual-fit-v
          path: visual-fit-v
          retention-days: 2
