name: Text only conversion refinement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply copy and ordering refinement
        env:
          JS_PATCH_B64: ""
          CSS_PATCH_B64: ""
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          j=Path('rebloom-experience.js')
          js=j.read_text(encoding='utf-8')
          patch=base64.b64decode(os.environ['JS_PATCH_B64']).decode('utf-8')
          marker='/* Text-only conversion refinement 20260817aa */'
          if marker not in js:
              j.write_text(js.rstrip()+"\n\n"+patch.strip()+"\n",encoding='utf-8')
          c=Path('rebloom-experience.css')
          css=c.read_text(encoding='utf-8')
          cpatch=base64.b64decode(os.environ['CSS_PATCH_B64']).decode('utf-8')
          if marker not in css:
              c.write_text(css.rstrip()+"\n\n"+cpatch.strip()+"\n",encoding='utf-8')
          d=Path('rebloom-detail.js')
          s=d.read_text(encoding='utf-8')
          s=s.replace('rebloom-experience.css?v=20260817z','rebloom-experience.css?v=20260817aa')
          s=s.replace('rebloom-experience.js?v=20260817z','rebloom-experience.js?v=20260817aa')
          d.write_text(s,encoding='utf-8')
          PY
      - name: Install browser runtime
        run: npm install --no-save playwright-core@1.55.0
      - name: Audit home and event on PC and mobile
        run: |
          cat > conversion-audit.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            fs.mkdirSync('conversion-audit',{recursive:true});
            for(const [vp,w,h] of [['desktop',1440,1000],['mobile',390,844]]){
              const ctx=await browser.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'});
              for(const file of ['index.html','event.html']){
                const page=await ctx.newPage(); const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                await page.route('**/*',r=>{
                  const u=r.request().url();
                  if(u.startsWith('http://127.0.0.1:8000/')||u.startsWith('data:')||u.startsWith('blob:')) r.continue(); else r.abort();
                });
                const res=await page.goto('http://127.0.0.1:8000/'+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(1000);
                const m=await page.evaluate((file)=>{
                  const overflow=document.documentElement.scrollWidth-document.documentElement.clientWidth;
                  if(file==='index.html'){
                    const lead=document.querySelector('.nr-home-hero .hero-lead')?.textContent||'';
                    const formula=document.querySelectorAll('.rb-project-formula span').length;
                    const glance=!!document.querySelector('.rb-project-glance');
                    return {overflow,lead,formula,glance};
                  }
                  const summary=document.querySelector('.event-summary');
                  const play=document.querySelector('.rb-mud-play-section');
                  return {
                    overflow,
                    hero:[...document.querySelectorAll('.page-hero--event p')].map(x=>x.textContent).join(' '),
                    playCards:document.querySelectorAll('.rb-play-grid article').length,
                    playStatus:document.querySelector('.rb-play-status')?.textContent||'',
                    playAfterSummary:!!(summary&&play&&summary.nextElementSibling===play),
                    cta:!!document.querySelector('.rb-play-cta')
                  };
                },file);
                if(!res||res.status()>=400||errors.length||m.overflow>2) throw new Error(file+'/'+vp+' base '+JSON.stringify({status:res&&res.status(),errors,m}));
                if(file==='index.html'&&(!m.lead.includes('学生プロジェクト')||m.formula!==3||!m.glance)) throw new Error('home '+vp+' '+JSON.stringify(m));
                if(file==='event.html'&&(!m.hero.includes('走る、探す、投げる、運ぶ')||m.playCards!==4||!m.playStatus.includes('内容は検討中です')||!m.playAfterSummary||!m.cta)) throw new Error('event '+vp+' '+JSON.stringify(m));
                await page.screenshot({path:`conversion-audit/${file.replace('.html','')}-${vp}.png`,fullPage:true});
                await page.close();
              }
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8000 >/tmp/rebloom-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node conversion-audit.cjs
      - name: Upload audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: text-only-conversion-audit
          path: conversion-audit
          retention-days: 2
      - name: Commit refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rebloom-experience.js rebloom-experience.css rebloom-detail.js
          git diff --cached --quiet && exit 0
          git commit -m 'ホームの一目理解と泥ん子運動会の参加動機を強化'
          git push
