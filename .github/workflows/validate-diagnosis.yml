name: Validate Flower Diagnosis

on:
  push:
    paths:
      - 'diagnosis.html'
      - 'diagnosis.js'
      - 'diagnosis-visual-v2.js'
      - 'diagnosis-ux-v3.css'
      - 'diagnosis-v2.css'
      - 'diagnosis-fixes.css'
      - '.github/workflows/validate-diagnosis.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check diagnosis.js
          node --check diagnosis-visual-v2.js
      - name: Validate diagnosis model invariants
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('diagnosis.js','utf8');

          function jsonBetween(startToken,endToken){
            const a=src.indexOf(startToken);
            const b=src.indexOf(endToken,a+startToken.length);
            if(a<0||b<0) throw new Error('Could not locate '+startToken);
            return JSON.parse(src.slice(a+startToken.length,b).trim().replace(/;\s*$/,''));
          }

          const flowers=jsonBetween('const FLOWERS=','const FLOWER_MAP=');
          const map=jsonBetween('const FLOWER_MAP=','const QUESTIONS=');
          const questions=jsonBetween('const QUESTIONS=','const AXIS_LABELS=');
          const axes=['G','A','P','H','F'];

          if(flowers.length!==32) throw new Error('Expected 32 flowers, got '+flowers.length);
          if(new Set(flowers.map(x=>x.slug)).size!==32) throw new Error('Flower slugs must be unique');
          if(Object.keys(map).length!==32) throw new Error('FLOWER_MAP must contain all 32 bit patterns');
          for(let i=0;i<32;i++){
            const bits=i.toString(2).padStart(5,'0');
            if(!map[bits]) throw new Error('Missing FLOWER_MAP pattern '+bits);
          }
          const flowerSlugs=new Set(flowers.map(x=>x.slug));
          for(const [bits,slug] of Object.entries(map)){
            if(!/^[01]{5}$/.test(bits)) throw new Error('Invalid pattern '+bits);
            if(!flowerSlugs.has(slug)) throw new Error('Unknown flower slug '+slug);
          }
          if(map['01111']!=='renge') throw new Error('Neutral reference pattern must remain renge');
          if(questions.length!==40) throw new Error('Expected 40 questions, got '+questions.length);
          const directions=Object.fromEntries(axes.map(k=>[k,{pos:0,neg:0}]));
          for(const [i,q] of questions.entries()){
            if(!q.text||!q.category||!q.axes) throw new Error('Malformed question '+(i+1));
            const entries=Object.entries(q.axes);
            if(entries.length!==1) throw new Error('Question '+(i+1)+' must measure exactly one axis');
            for(const [k,w] of entries){
              if(!axes.includes(k)||![-1,1].includes(w)) throw new Error('Invalid axis weight at question '+(i+1));
              directions[k][w>0?'pos':'neg']++;
            }
          }
          for(const k of axes){
            if(directions[k].pos!==4||directions[k].neg!==4) throw new Error('Axis '+k+' must have 4 positive and 4 negative questions');
          }

          // Every flower pattern must be reachable by a coherent extreme response profile.
          for(let i=0;i<32;i++){
            const bits=i.toString(2).padStart(5,'0');
            const wanted=Object.fromEntries(axes.map((k,j)=>[k,bits[j]==='1'?1:-1]));
            const positive=Object.fromEntries(axes.map(k=>[k,0]));
            const negative=Object.fromEntries(axes.map(k=>[k,0]));
            const positiveWeight=Object.fromEntries(axes.map(k=>[k,0]));
            const negativeWeight=Object.fromEntries(axes.map(k=>[k,0]));
            questions.forEach(q=>{
              const [k,w]=Object.entries(q.axes)[0];
              const v=2*w*wanted[k];
              if(w>0){positive[k]+=v;positiveWeight[k]++;}
              else{negative[k]+=v;negativeWeight[k]++;}
            });
            const got=axes.map(k=>{
              const score=((positive[k]/positiveWeight[k])-(negative[k]/negativeWeight[k]))/4;
              return score>0?'1':'0';
            }).join('');
            if(got!==bits) throw new Error('Unreachable flower pattern '+bits+' -> '+got);
          }
          for(const required of ['CLASSIFICATION_EPS=.04','NEUTRAL_BITS={G:\'0\',A:\'1\',P:\'1\',H:\'1\',F:\'1\'}','completed=true','前回の結果を見る','v===-2||v===-1||v===1||v===2']){
            if(!src.includes(required)) throw new Error('Missing scoring/state safeguard: '+required);
          }
          console.log('OK: 32 flower mappings, 40 single-axis questions, balanced directions, four-choice scale and saved-result safeguards.');
          NODE
      - name: Check diagnosis HTML and required hooks
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          html = Path('diagnosis.html').read_text(encoding='utf-8')
          js = Path('diagnosis.js').read_text(encoding='utf-8')
          visual = Path('diagnosis-visual-v2.js').read_text(encoding='utf-8')
          css_files = [Path(x).read_text(encoding='utf-8') for x in ['diagnosis-v2.css','diagnosis-fixes.css','diagnosis-ux-v3.css']]

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k=='id' and v:
                          self.ids.append(v)

          p=IdParser(); p.feed(html)
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          if dup:
              raise SystemExit(f'Duplicate ids: {dup}')

          required=[
              'startDiagnosis','resumeDiagnosis','diagnosisQuestionAnchor','diagnosisPanel',
              'questionCount','remainingCount','progressPercent','questionText',
              'diagnosisResult','resultTitle','resultStrengths','resultEnergyStyle',
              'resultPaceStyle','resultDecisionStyle','resultMotivationStyle',
              'resultStressStyle','resultMisreadStyle','resultAxisNarratives',
              'resultShareImage','downloadCard','downloadStoryCard','shareDiagnosisCard','copyDiagnosisResult','resultReasonList','resultReasonNote'
          ]
          missing=[x for x in required if x not in p.ids]
          if missing:
              raise SystemExit(f'Missing required ids: {missing}')

          for text,name in [(html,'diagnosis.html'),(js,'diagnosis.js'),(visual,'diagnosis-visual-v2.js')]:
              if re.search(r'\bMBTI\b',text,re.I):
                  raise SystemExit(f'Prohibited external diagnosis name found in {name}')

          banned_fonts=('Yu Mincho','Hiragino Mincho','Noto Serif')
          for i,text in enumerate(css_files):
              for font in banned_fonts:
                  if font.lower() in text.lower():
                      raise SystemExit(f'Diagnosis CSS contains unwanted Mincho font: {font} in css index {i}')

          if 'M PLUS Rounded 1c' not in ''.join(css_files):
              raise SystemExit('Rounded display font is missing from diagnosis CSS')
          if 'family=M+PLUS+Rounded+1c' not in html:
              raise SystemExit('Diagnosis page is not loading the shared rounded font family')

          if '答えるたびに、小さな花が咲きます' in html:
              raise SystemExit('Decorative flower progress copy must not return')

          if html.count('href="diagnosis-ux-v3.css') != 1:
              raise SystemExit('diagnosis-ux-v3.css must be linked exactly once')

          if len(re.findall(r'class="diagnosis-answer"', html)) != 4:
              raise SystemExit('Diagnosis must expose exactly four answer buttons')
          if 'data-value="0"' in html:
              raise SystemExit('Neutral answer must not return in the four-choice scale')
          if '1 / 40' not in html or 'あと39問' not in html:
              raise SystemExit('Initial 40-question progress copy is missing')

          print(f'OK: {len(p.ids)} unique ids; required hooks present; JS syntax checked.')
          PY
