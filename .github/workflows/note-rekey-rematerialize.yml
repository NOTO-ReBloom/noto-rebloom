name: Rematerialize pending NOTE after device rekey

on:
  push:
    paths:
      - 'sidehustle-autopublish/keys/device_public_key.pem'
      - '.github/workflows/note-rekey-rematerialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-rekey-rematerialize
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install crypto
        run: python -m pip install --quiet cryptography
      - name: Rebuild five encrypted paid NOTE payloads
        shell: python
        run: |
          import os, json, base64, hashlib, pathlib, datetime
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root=pathlib.Path('.')
          key_path=root/'sidehustle-autopublish/keys/device_public_key.pem'
          pub_bytes=key_path.read_bytes()
          pub=serialization.load_pem_public_key(pub_bytes)
          pub_sha=hashlib.sha256(pub_bytes).hexdigest()
          qpath=root/'sidehustle-autopublish/note/queue/index.json'
          q=json.loads(qpath.read_text(encoding='utf-8-sig'))
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).replace(microsecond=0)
          stamp=now.isoformat()
          nonce=now.strftime('%Y%m%dT%H%M%S+0900')

          articles={
          'note_20260822_12_event_cancel_decision':{
            'title':'イベント中止判断を「勘」にしない｜雨・警報・交通・会場条件を1枚で決める判断表','price':980,
            'tags':['イベント運営','安全管理','リスク管理','学生団体','意思決定'],
            'coverCopy':'中止判断を、勘ではなく基準で決める','coverAlt':'イベント中止判断の基準表を示す見出し画像',
            'freeBody':'''イベントの中止判断が難しいのは、「雨が降るか」だけでは決められないからです。警報、交通、会場、参加者の移動、安全確保、撤収可能性まで同時に見ないと、判断が遅れます。\n\nこの記事では、主催者が当日の空気に流されず、事前に決めた基準で「実施・縮小・延期・中止」を選ぶための判断表を作ります。ポイントは、天気予報そのものではなく、**条件が悪化したときに運営が安全を維持できるか**を見ることです。''',
            'paidBody':'''## 1. 判断を4ブロックに分ける\n\n判断表は「気象」「交通」「会場」「運営能力」の4ブロックに分けます。各項目を0=問題なし、1=注意、2=重大で記録します。\n\n### 気象\n- 大雨・暴風・雷・高温などの警報や注意報\n- 開始前だけでなく撤収時間帯の予報\n- 屋外設備やテントが耐えられる風速か\n\n### 交通\n- 鉄道・バス・道路の運休や通行止め\n- 参加者が安全に帰宅できる見込み\n- スタッフの集合率が維持できるか\n\n### 会場\n- 排水、ぬかるみ、転倒、浸水、落下物など\n- 救護・避難場所が使えるか\n- 電源、音響、備品を安全に扱えるか\n\n### 運営能力\n- 必要人数を確保できるか\n- 監視、誘導、受付、救護を削らず回せるか\n- 悪天候対応に必要な追加備品が揃っているか\n\n## 2. 1枚の判断表\n\n|項目|0|1|2|現在|根拠|担当|\n|---|---|---|---|---|---|---|\n|警報|なし|注意報|警報級| | | |\n|交通|通常|一部乱れ|帰宅困難| | | |\n|会場|通常|部分制限|安全確保不可| | | |\n|運営人数|100%|代替で維持|必須配置不足| | | |\n|撤収|通常|前倒し必要|安全に撤収不可| | | |\n\n合計点だけで機械的に決めず、**2が1つでも「安全確保不可」に直結する項目なら中止候補**とします。特に避難、帰宅、救護、監視のどれかが成立しない場合は、売上や期待人数より優先します。\n\n## 3. 4段階の結論を先に定義する\n\n- 実施：通常体制で安全を維持できる\n- 縮小：一部種目・時間・区域を削れば安全を維持できる\n- 延期：当日は成立しないが代替日で価値を保てる\n- 中止：安全確保または帰宅導線が成立しない\n\n「中止か実施か」の二択にしないことで、判断を早められます。\n\n## 4. 判断時刻を固定する\n\n例：前日18:00、当日6:00、開始3時間前、開始1時間前。各時点で同じ表を更新します。判断者、情報収集者、連絡担当を分けておくと、代表者一人に情報が集中しません。\n\n## 5. 連絡テンプレ\n\n**縮小時**\n「安全確保のため、○○を中止し、△△のみ実施します。受付時間は○時、終了は○時へ変更します。」\n\n**中止時**\n「気象・交通・会場条件を確認した結果、安全な運営と帰宅導線の確保が難しいため、本日の開催を中止します。今後の対応は○時までに案内します。」\n\n## 6. AIに判断を丸投げしない使い方\n\nAIには決定ではなく整理を任せます。\n\n「以下の気象、交通、会場、スタッフ情報を、判断表の4分類に整理してください。事実と推測を分け、不足情報を列挙してください。最終判断は人間が行います。」\n\nこの型を一度作れば、毎回の中止判断を“その場の雰囲気”ではなく、更新可能な運営基準として残せます。'''
          },
          'note_20260822_13_meeting_decision_log':{
            'title':'学生団体の会議が長いのに何も決まらない理由｜決定・保留・宿題を分ける議事録テンプレ','price':780,
            'tags':['学生団体','会議','議事録','タスク管理','チーム運営'],
            'coverCopy':'会議は「決定・保留・宿題」に分ける','coverAlt':'会議の決定事項を整理する見出し画像',
            'freeBody':'''会議が長いのに前へ進まない原因は、話す量ではなく「会議後に何が残るか」が曖昧なことです。議論、共有、アイデア、決定、宿題が同じ文章に混ざると、翌週また同じ話をします。\n\nそこで議事録を文章ではなく、**決定・保留・宿題**の3種類に分けます。''',
            'paidBody':'''## 1. 会議中に3分類する\n\n### 決定\n今この場で確定したこと。誰が見ても同じ行動になる粒度で書きます。\n\n### 保留\n判断材料が足りず、まだ決めないこと。「何が揃えば決められるか」も書きます。\n\n### 宿題\n会議後に誰かが行う行動。担当・期限・完了条件を必須にします。\n\n## 2. そのまま使えるテンプレ\n\n|分類|内容|担当|期限|完了条件・再判断条件|\n|---|---|---|---|---|\n|決定|9/20は13:00開始|運営全員|-|告知物を同時刻へ統一|\n|保留|雨天時の縮小案|安全担当|9/10|会場排水条件を確認後に再判断|\n|宿題|学校配布先を確認|広報担当|8/30|配布可能校と部数を一覧化|\n\n## 3. 「担当」を名前だけで終わらせない\n\n宿題は「担当：Aさん」だけでは弱いです。期限と完了条件まで入れます。\n\n悪い例：協賛企業に連絡する。\n良い例：A社へ協賛資料を送付し、返信がなければ3営業日後に再連絡する。期限8/28。\n\n## 4. 会議の進行を短くする順番\n\n1. 前回宿題の完了確認\n2. 今日決める項目を宣言\n3. 必要な事実だけ共有\n4. 選択肢を比較\n5. 決定・保留・宿題へ分類\n6. 最後3分で読み上げ確認\n\n「今日決めなくてよい話」を保留へ逃がせるため、議論が横に広がりにくくなります。\n\n## 5. 保留に期限をつける\n\n保留は放置すると消えます。「次回会議」ではなく、必要情報・取得担当・再判断日をセットにします。\n\n## 6. AIを使う場合のプロンプト\n\n「以下の会議メモを、①決定、②保留、③宿題に分類してください。宿題には担当・期限・完了条件の不足を指摘し、勝手に補完せず“不明”としてください。」\n\nこの形式なら、議事録を読むための記録ではなく、次の行動を生む運営台帳として使えます。'''
          },
          'note_20260822_14_sponsor_menu_design':{
            'title':'協賛メニューを金額から作ると失敗する｜企業が社内説明しやすいスポンサー提案の設計法','price':1280,
            'tags':['協賛','スポンサー','営業','イベント','提案書'],
            'coverCopy':'協賛メニューは「金額」より先に価値を設計','coverAlt':'スポンサー提案の価値設計を示す見出し画像',
            'freeBody':'''協賛メニューを「1万円＝ロゴ小、5万円＝ロゴ大、10万円＝SNS投稿」のように金額から作ると、企業側は社内で説明しにくくなります。企業が買っているのはロゴの大きさではなく、地域貢献、採用、認知、顧客接点、社員参加などの目的に対する成果です。\n\n先に設計するべきなのは価格表ではなく、**企業が社内稟議で説明できる価値と証拠**です。''',
            'paidBody':'''## 1. まず企業目的を5種類に分ける\n\n- 地域・CSR：地域課題への貢献を示したい\n- 採用：学生・若者との接点を作りたい\n- 認知：地域内でブランド想起を増やしたい\n- 顧客接点：商品・サービスを体験してほしい\n- 社員参加：社員の地域活動機会を作りたい\n\n同じ5万円でも、目的が違えば提供すべき価値は変わります。\n\n## 2. 「権利」ではなく「成果物」で書く\n\n悪い例：SNS掲載あり。\n良い例：開催前1回・当日1回・終了後報告1回の計3回、企業名と協力内容を明記。終了後に掲載URL一覧を報告。\n\n企業担当者が社内報告に転用できる粒度まで具体化します。\n\n## 3. 協賛メニューの5列\n\n|企業目的|提供価値|実施物|証拠|必要コスト|\n|---|---|---|---|---|\n|地域貢献|地域活動への参画|会場掲示・報告書掲載|写真・報告PDF|印刷・制作|\n|採用|学生との接点|学生向け紹介枠|参加数・写真|運営時間|\n|認知|名称露出|Web・SNS・会場掲示|URL・掲示写真|制作費|\n\n価格はこの表を作った後で、履行コスト、独占性、接触人数、制作負担を見て決めます。\n\n## 4. 3段階メニューの作り方\n\n### Entry\n参加しやすく、履行負担も小さい。Web掲載、報告書掲載など。\n\n### Standard\n企業目的に直接つながる接点を追加。SNS複数回、当日掲示、サンプリングなど。\n\n### Partner\n共同企画、社員参加、独占カテゴリー、ドキュメント素材提供など、単純な露出以上の連携。\n\n上位プランほどロゴを大きくするのではなく、**得られる成果の種類を増やす**のが基本です。\n\n## 5. 稟議に必要な6情報\n\n1. 何の事業か\n2. 誰に届くか\n3. 企業に何が返るか\n4. 何を証拠として残すか\n5. 金額はいくらか\n6. リスク・中止時にどう扱うか\n\nこれを提案書1枚目で説明できると、担当者が上司へ説明しやすくなります。\n\n## 6. 履行表を契約前に作る\n\n|約束|期限|担当|証拠|状態|\n|---|---|---|---|---|\n|Webロゴ掲載|契約後3日|広報|URL|未着手|\n|当日掲示|前日|会場|写真|未着手|\n|終了報告|開催後14日|代表|PDF|未着手|\n\n売る前に履行可能性を確認することで、「取れたが返せない協賛」を防げます。\n\n## 7. AIで企業別に変換するプロンプト\n\n「この企業の公開情報から、地域貢献・採用・認知・顧客接点・社員参加のどれが今回の企画と接続しやすいか仮説を3つ出してください。根拠と推測を分け、協賛金額ではなく提供価値・成果物・証拠の組み合わせで提案してください。」\n\n協賛メニューは価格表ではなく、企業目的と履行可能な成果を接続する設計図です。'''
          },
          'note_20260822_15_research_interview_coding':{
            'title':'卒論インタビューが「いい話」で終わる前に｜発言をコード化して分析へつなぐ最小手順','price':980,
            'tags':['卒論','質的研究','インタビュー','コーディング','大学生'],
            'coverCopy':'インタビューを「分析できるデータ」に変える','coverAlt':'インタビュー発言のコード化手順を示す見出し画像',
            'freeBody':'''インタビューは実施しただけでは分析になりません。「印象的だった」「多くの人が困っていた」で終えると、結論が自分の感想に近づきます。必要なのは、発言→コード→テーマ→解釈をつなぎ、どの結論がどの発言に支えられているか追える状態です。\n\nここでは卒論でも回せる最小構成に絞ります。''',
            'paidBody':'''## 1. まず分析単位を決める\n\n文字起こし全文を一気に要約せず、意味が一つになる発言単位へ分けます。1発言が長い場合は、主張が変わる位置で分割します。\n\n## 2. 4列から始める\n\n|発言ID|発言要約・引用|初期コード|メモ|\n|---|---|---|---|\n|A-12|募集しても若い人が来ない|若年層への到達不足|チャネル問題の可能性|\n|B-07|仕事を任せる人が決まらない|役割設計不足|採用後の受入にも関連|\n\nコードは文章を綺麗に言い換えるのではなく、「この発言は何を示しているか」を短く付けます。\n\n## 3. 初期コードをテーマへまとめる\n\n似たコードを並べ、上位テーマを作ります。\n\n例：\n- 若年層への到達不足\n- 求人媒体が限定的\n- 大学との接点不足\n→「採用チャネルの弱さ」\n\n- 引継ぎ不足\n- 配置が曖昧\n- 育成担当不在\n→「受入・育成基盤の弱さ」\n\n## 4. コードブックを作る\n\n|コード|定義|含める例|含めない例|\n|---|---|---|---|\n|役割設計不足|担当・責任範囲が不明確|誰がやるか決まらない|単純な人手不足|\n\n同じ言葉を違う意味で使うのを防ぎます。\n\n## 5. 反対事例を残す\n\n自分の仮説に合う発言だけ集めないよう、「うまくいっている例」「仮説に反する例」も同じ表へ残します。反対事例があるほど、条件差を考えられます。\n\n## 6. 結論から発言へ戻れるようにする\n\n本文で「多くの団体が役割分担に課題を抱える」と書くなら、どの対象のどの発言IDが根拠か一覧にします。研究メモには、テーマ→コード→発言IDの対応を残します。\n\n## 7. 最小分析フロー\n\n1. 文字起こし\n2. 発言単位へ分割\n3. 初期コード\n4. コードの統合・分割\n5. テーマ化\n6. 反対事例確認\n7. 結論と根拠引用を接続\n\n## 8. AIを使う場合\n\nAIに最終コードを決めさせず、候補出しと揺れの検出に使います。\n\n「以下の発言について初期コード候補を3つ出してください。発言に書かれていない原因を補わず、各候補がどの語句に基づくか示してください。」\n\n最後に研究者自身が定義を揃え、コードブックへ反映します。これでインタビューが“いい話のまとめ”ではなく、追跡可能な分析になります。'''
          },
          'note_20260822_16_jobhunt_company_research':{
            'title':'企業研究を「情報収集」で終わらせない｜ES・面接回答につながる5列の比較シート','price':780,
            'tags':['就活','企業研究','ES','面接','大学生'],
            'coverCopy':'企業研究を、面接で使える5列に変える','coverAlt':'企業研究の5列比較シートを示す見出し画像',
            'freeBody':'''企業研究で会社概要、売上、理念、ニュースを大量に集めても、ESや面接で使えないことがあります。原因は「情報」と「自分がその情報をどう使うか」が分離しているからです。\n\n企業研究は5列に固定すると、収集から回答作成までつながります。''',
            'paidBody':'''## 1. 5列の比較シート\n\n|事実|意味・解釈|自分との接点|回答での使い道|確認したい質問|\n|---|---|---|---|---|\n|新規事業比率を拡大|既存事業だけでなく挑戦を重視|改善提案を実行した経験|志望動機|若手の提案プロセスは？|\n\n第1列以外は自分の思考です。これが企業サイトの要約で終わらないポイントです。\n\n## 2. 事実の情報源を分ける\n\n- 公式採用サイト：仕事内容、制度、社員事例\n- IR・統合報告書：事業構造、課題、投資領域\n- ニュースリリース：直近の重点施策\n- 募集要項：配属、勤務地、評価条件\n\n出典URLと確認日も残します。\n\n## 3. 「強み」ではなく「課題」も見る\n\n面接で差が出やすいのは、企業の良い点を列挙するより、企業が今後どこを伸ばそうとしているかを理解している回答です。\n\n例：海外売上拡大を掲げている→単に「グローバル企業だから志望」ではなく、「国内で培った強みを海外市場へ展開する局面で○○経験を生かしたい」と接続します。\n\n## 4. ESへ変換する順番\n\n1. 企業の事実\n2. そこから読み取れる方向性\n3. 自分の経験・価値観との一致\n4. 入社後にやりたい行動\n\nこの順番なら「理念に共感しました」だけで終わりにくくなります。\n\n## 5. 面接用の3問を作る\n\n企業ごとに、以下を言える状態にします。\n- なぜこの業界か\n- なぜこの会社か\n- 入社後に何をしたいか\n\n5列シートのどの行が各回答の根拠か紐づけます。\n\n## 6. 比較は3社以上で行う\n\n1社だけ調べると、特徴なのか業界共通なのか分かりません。同業2社以上と並べ、同じ観点で比較します。違いが出た列が「なぜこの会社か」の材料になります。\n\n## 7. AIプロンプト\n\n「以下は企業の公式情報です。事実を勝手に追加せず、①事実、②意味・解釈候補、③就活生が確認すべき追加情報、④面接で深掘りされる可能性、の4点で整理してください。推測には必ず“推測”と付けてください。」\n\nAIの出力をそのまま志望動機にせず、自分との接点だけは自分で埋めます。これで企業研究が情報収集から回答設計へ変わります。'''
          }}

          byid={e['id']:e for e in q.get('entries',[])}
          for iid,a in articles.items():
              obj={
                  'title':a['title'],'freeBody':a['freeBody'],'paidBody':a['paidBody'],'tags':a['tags'],'price':a['price'],
                  'coverCopy':a['coverCopy'],'coverAlt':a['coverAlt']
              }
              raw=json.dumps(obj,ensure_ascii=False,separators=(',',':')).encode('utf-8')
              key=os.urandom(32); iv=os.urandom(12)
              sealed=AESGCM(key).encrypt(iv,raw,None); ciphertext,tag=sealed[:-16],sealed[-16:]
              wrapped=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
              env={
