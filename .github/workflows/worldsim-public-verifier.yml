name: Verify AI World Observatory publications

on:
  workflow_dispatch:
  push:
    paths:
      - 'sidehustle-autopublish/note/worldsim/publication_queue.json'
      - 'sidehustle-autopublish/note/worldsim/rebuild_request.json'
      - '.github/workflows/worldsim-public-verifier.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: worldsim-public-verifier
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify reader-visible worldsim state from NOTE public API
        run: |
          cat > verify-worldsim.mjs <<'NODE'
          import fs from 'node:fs';

          const qPath='sidehustle-autopublish/note/worldsim/publication_queue.json';
          const rPath='sidehustle-autopublish/note/worldsim/rebuild_request.json';
          const q=JSON.parse(fs.readFileSync(qPath,'utf8'));
          const req=JSON.parse(fs.readFileSync(rPath,'utf8'));
          const account=q.account||'royal_lion645';
          const norm=s=>String(s||'').replace(/\s+/g,' ').trim();

          async function fetchPublicInventory(){
            const out=[];
            for(let page=1;page<=100;page++){
              const u='https://note.com/api/v2/creators/'+account+'/contents?kind=note&disabled_pinned=true&page='+page+'&audit='+Date.now();
              const res=await fetch(u,{headers:{'cache-control':'no-cache','user-agent':'worldsim-public-verifier/2.0'}});
              if(!res.ok) throw new Error('NOTE_PUBLIC_API_HTTP_'+res.status+'_PAGE_'+page);
              const obj=await res.json();
              const d=obj.data||{};
              const xs=Array.isArray(d.contents)?d.contents:[];
              for(const x of xs){
                if(!x||x.status!=='published') continue;
                out.push({
                  key:x.key,
                  title:norm(x.name),
                  price:x.price==null?0:Number(x.price)||0,
                  status:x.status,
                  url:'https://note.com/'+account+'/n/'+x.key
                });
              }
              if(d.isLastPage||xs.length===0)break;
            }
            return out;
          }

          async function verifyArticle(item,entry){
            const res=await fetch(item.url+'?verify='+Date.now(),{headers:{'cache-control':'no-cache','user-agent':'worldsim-public-verifier/2.0'}});
            if(!res.ok)return false;
            const html=await res.text();
            const titleOk=html.includes(entry.title)||html.includes(item.title);
            const paidMarker=/購入して続きをみる|この記事を購入|購入手続き/.test(html);
            return titleOk && !paidMarker && item.price===0;
          }

          const inventory=await fetchPublicInventory();
          const byTitle=new Map();
          for(const x of inventory){
            const arr=byTitle.get(x.title)||[];
            arr.push(x);byTitle.set(x.title,arr);
          }

          let changed=false;
          for(const e of q.entries||[]){
            if(e.publicUrlVerified===true)continue;
            const hits=byTitle.get(norm(e.title))||[];
            if(hits.length!==1)continue;
            if(!(await verifyArticle(hits[0],e)))continue;
            e.publicUrlVerified=true;
            e.publicUrl=hits[0].url;
            e.enabled=false;
            e.verifiedAt=new Date().toISOString();
            changed=true;
            console.log('WORLDSIM_VERIFIED',e.id,hits[0].url);
          }

          const launchIds=new Set(req.launchIds||[]);
          const launch=(q.entries||[]).filter(e=>launchIds.has(e.id));
          const allLaunchVerified=launch.length===launchIds.size && launchIds.size>0 && launch.every(e=>e.publicUrlVerified===true);
          if(allLaunchVerified && req.launchVerified!==true){
            req.launchVerified=true;
            req.launchVerifiedAt=new Date().toISOString();
            changed=true;
          }

          if(allLaunchVerified){
            const profileRes=await fetch('https://note.com/'+account+'?profileVerify='+Date.now(),{headers:{'cache-control':'no-cache','user-agent':'worldsim-public-verifier/2.0'}});
            const profileHtml=profileRes.ok?await profileRes.text():'';
            const profileOk=profileHtml.includes('AI世界観測所')||profileHtml.includes('5,451人が暮らす3つの架空社会');
            const launchTitles=new Set(launch.map(e=>norm(e.title)));
            const onlyLaunch=inventory.length===launch.length && inventory.every(x=>launchTitles.has(x.title));
            if(profileOk && onlyLaunch && req.status!=='completed'){
              req.status='completed';
              req.completedAt=new Date().toISOString();
              req.finalPublicUrls=launch.map(e=>e.publicUrl);
              req.profileVerified=true;
              changed=true;
              console.log('WORLDSIM_REBUILD_PUBLICLY_COMPLETE');
            }
          }

          q.publicInventoryCount=inventory.length;
          q.lastPublicAuditAt=new Date().toISOString();
          q.lastPublicAuditLaunchVerified=allLaunchVerified;
          if(changed)q.updatedAt=new Date().toISOString();

          fs.writeFileSync(qPath,JSON.stringify(q,null,2)+'\n');
          fs.writeFileSync(rPath,JSON.stringify(req,null,2)+'\n');
          console.log('WORLDSIM_PUBLIC_CHECK_DONE inventory='+inventory.length+' launchVerified='+allLaunchVerified+' rebuildStatus='+req.status);
          NODE
          node verify-worldsim.mjs

      - name: Commit verified state
        run: |
          git config user.name 'worldsim-public-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add sidehustle-autopublish/note/worldsim/publication_queue.json sidehustle-autopublish/note/worldsim/rebuild_request.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify AI World Observatory public state'
          git pull --rebase origin main
          git push origin HEAD:main
