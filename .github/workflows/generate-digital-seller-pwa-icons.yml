name: Generate Digital Seller PWA icons

on:
  push:
    paths:
      - '.github/workflows/generate-digital-seller-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG icons from SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          cd auto-tools/digital-seller-profit
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
          file icon-192.png icon-512.png
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-tools/digital-seller-profit/icon-192.png auto-tools/digital-seller-profit/icon-512.png
          git diff --cached --quiet || git commit -m "Generate PWA PNG icons"
          git push
