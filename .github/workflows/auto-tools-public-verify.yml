name: Verify one unverified auto-tool on demand

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tools-public-verify-on-demand
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify newest unverified tool on public GitHub Pages
        shell: python
        run: |
          import json,pathlib,time,urllib.request,re,datetime
          idx=json.loads(pathlib.Path('auto-tools/index.json').read_text(encoding='utf-8-sig'))
          p=pathlib.Path('auto-tools/publication_ledger.json')
          ledger=json.loads(p.read_text(encoding='utf-8-sig')) if p.exists() else {'version':1,'updatedAt':None,'entries':[]}
          done={e.get('slug') for e in ledger.get('entries',[]) if e.get('publicUrlVerified')}
          candidates=[t for t in idx.get('tools',[]) if t.get('slug') not in done]
          if not candidates:
              print('NO_UNVERIFIED_TOOLS');raise SystemExit(0)
          tool=candidates[-1];url='https://noto-rebloom.github.io/noto-rebloom/'+tool['path'];last=''
          for _ in range(12):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 verifier','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as r:status=r.status;src=r.read().decode('utf-8','replace')
                  if status==200 and tool['title'] in src:break
                  last=f'status={status}'
              except Exception as e:last=repr(e)
              time.sleep(10)
          else:
              print('NOT_READY_YET',url,last);raise SystemExit(0)
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds')
          m=re.search(r'<title>(.*?)</title>',src,re.I|re.S);page_title=re.sub(r'\s+',' ',m.group(1)).strip() if m else ''
          ledger.setdefault('entries',[]).append({'slug':tool['slug'],'title':tool['title'],'publicUrl':url,'publicUrlVerified':True,'verifiedAt':now,'httpStatus':status,'pageTitle':page_title,'verificationMode':'GitHub Actions public HTTPS fetch'})
          ledger['updatedAt']=now;p.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit only a new verified URL
        run: |
          if git diff --quiet -- auto-tools/publication_ledger.json; then exit 0; fi
          git config user.name 'auto-tools-public-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add auto-tools/publication_ledger.json
          git commit -m 'Verify auto-tool buyer-visible GitHub Pages URL'
          git push origin HEAD:main
