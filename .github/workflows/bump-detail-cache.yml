name: Bump ReBloom detail cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update asset versions on every public page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']
          replacements={
            'rebloom-unified.js?v=20260817b':'rebloom-unified.js?v=20260817e',
            'rebloom-unified.css?v=20260817b':'rebloom-unified.css?v=20260817e',
            'rebloom-polish.css?v=20260817c':'rebloom-polish.css?v=20260817e'
          }
          for name in pages:
            p=Path(name)
            text=p.read_text(encoding='utf-8')
            for old,new in replacements.items():
              text=text.replace(old,new)
            p.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "全公開ページを最終デザインのキャッシュ版へ更新"
          git push
