name: Build CSV Cleaner Store Assets

on:
  push:
    branches: [main]
    paths:
      - 'auto-tools/csv-cleaner-deduper/**'
      - 'sidehustle-autopublish/microsoft-store/ms_csv_cleaner_deduper/**'
      - '.github/workflows/ms-csv-cleaner-store-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ms-csv-cleaner-store-assets
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture actual app screenshots
        run: |
          mkdir -p sidehustle-autopublish/microsoft-store/ms_csv_cleaner_deduper/store-assets
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url='https://noto-rebloom.github.io/noto-rebloom/auto-tools/csv-cleaner-deduper/';
          const out='sidehustle-autopublish/microsoft-store/ms_csv_cleaner_deduper/store-assets';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          let ok=false,last='';
          for(let i=0;i<12;i++){
            try{const r=await page.goto(url,{waitUntil:'networkidle',timeout:30000}); if(r?.status()===200 && await page.getByText('CSV Cleaner & Duplicate Remover').count()){ok=true;break;} last='status='+r?.status();}catch(e){last=String(e)}
            await page.waitForTimeout(15000);
          }
          if(!ok) throw new Error('public PWA not ready: '+last);
          await page.screenshot({path:`${out}/screenshot-01-home.png`,fullPage:false});
          fs.writeFileSync('/tmp/sample.csv','name,email,company\n 山田 太郎 ,taro@example.com, A社\n山田  太郎,taro@example.com,A社\n佐藤 花子,hanako@example.com,B社\n,,\n');
          await page.locator('#file').setInputFiles('/tmp/sample.csv');
          await page.waitForSelector('#work:not(.hidden)');
          await page.screenshot({path:`${out}/screenshot-02-loaded.png`,fullPage:false});
          await page.locator('#dedupe').selectOption(['1']);
          await page.locator('#run').click();
          await page.waitForTimeout(300);
          await page.screenshot({path:`${out}/screenshot-03-cleaned.png`,fullPage:false});
          await browser.close();
          EOF
          node /tmp/capture.mjs
      - name: Record Store asset state
        run: |
          python - <<'PY'
          import json,pathlib,datetime
          p=pathlib.Path('sidehustle-autopublish/microsoft-store/ms_csv_cleaner_deduper/store_asset_state.json')
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds')
          data={'version':1,'updatedAt':now,'status':'screenshots_ready','screenshots':[
            {'path':'store-assets/screenshot-01-home.png','size':'1440x900','scenario':'home'},
            {'path':'store-assets/screenshot-02-loaded.png','size':'1440x900','scenario':'csv loaded preview'},
            {'path':'store-assets/screenshot-03-cleaned.png','size':'1440x900','scenario':'cleaned result'}],
            'captureMode':'Playwright screenshot of buyer-visible GitHub Pages PWA','publicUrl':'https://noto-rebloom.github.io/noto-rebloom/auto-tools/csv-cleaner-deduper/'}
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit generated assets
        run: |
          git config user.name 'ms-store-asset-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add sidehustle-autopublish/microsoft-store/ms_csv_cleaner_deduper/store-assets sidehustle-autopublish/microsoft-store/ms_csv_cleaner_deduper/store_asset_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate CSV Cleaner Microsoft Store screenshots'
          git push origin HEAD:main
