name: Force 2026-08-23 publication retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-publication-retry-20260823.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: force-publication-retry-20260823
  cancel-in-progress: false

jobs:
  force:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh only today's publication queues
        shell: python
        run: |
          import json, pathlib, datetime
          JST=datetime.timezone(datetime.timedelta(hours=9))
          now=datetime.datetime.now(JST)
          stamp=now.isoformat(timespec='seconds')
          nonce='force-all-20260823-'+now.strftime('%Y%m%dT%H%M%S%z')

          paid_note_ids={
            'note_20260823_17_sponsor_deliverables',
            'note_20260823_18_event_incident_response',
            'note_20260823_19_grant_tracker',
            'note_20260823_20_meeting_decision_log',
            'note_20260823_21_literature_matrix'
          }
          booth_ids={
            '024_grant_evidence_expense_os_20260823',
            '025_event_decision_authority_os_20260823',
            '026_research_claim_evidence_os_20260823',
            '027_sponsor_contact_history_os_20260823',
            '028_team_backup_coverage_os_20260823'
          }
          free_ids={
            'free_note_20260823_01_sponsor_after_yes',
            'free_note_20260823_02_grant_deadline_reverse_plan'
          }

          def load(path):
            p=pathlib.Path(path)
            return p,json.loads(p.read_text(encoding='utf-8-sig'))
          def save(p,d):
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          np, nq = load('sidehustle-autopublish/note/queue/index.json')
          nq['retryGeneration']=int(nq.get('retryGeneration',0))+1
          nq['updatedAt']=stamp
          nq['recoveryBatch']={
            'mode':'force_all_2026-08-23_paid_now',
            'requiredStrictPublications':5,
            'orderedIds':list(paid_note_ids),
            'instruction':'Process all five 2026-08-23 paid NOTE entries; do not stop after first success; skip briefly blocked entries and continue.',
            'strictChecks':['readerVisibleUrl','title','price','paidBoundary','dedicatedCover'],
            'forcedAt':stamp,
            'nonce':nonce
          }
          seen=[]
          for e in nq.get('entries',[]):
            if e.get('id') in paid_note_ids:
              seen.append(e.get('id'))
              if not e.get('publicUrlVerified',False):
                e['enabled']=True
                e['forceRetry']=True
                e['forceRetryNonce']=nonce
                e['invalidateLocalSuccessWithoutReaderVerification']=True
                e['recoveryMode']='decrypt, publish, strict reader-visible verify; current-day forced recovery'
          missing=paid_note_ids-set(seen)
          if missing: raise SystemExit('Missing paid NOTE ids: '+','.join(sorted(missing)))
          save(np,nq)

          bp,bq = load('booth-autopublish/queue/index.json')
          bq['retryGeneration']=int(bq.get('retryGeneration',0))+1
          bq['updatedAt']=stamp
          seen=[]
          for e in bq.get('entries',[]):
            if e.get('id') in booth_ids:
              seen.append(e.get('id'))
              if not e.get('publicUrlVerified',False):
                e['enabled']=True
                e['forceRetry']=True
                e['forceRetryNonce']=nonce
                e['invalidateLocalSuccessWithoutVerifiedLedger']=True
          missing=booth_ids-set(seen)
          if missing: raise SystemExit('Missing BOOTH ids: '+','.join(sorted(missing)))
          save(bp,bq)

          fp,fq = load('sidehustle-autopublish/note/free_queue/index.json')
          fq['updatedAt']=stamp
          seen=[]
          for e in fq.get('entries',[]):
            if e.get('id') in free_ids:
              seen.append(e.get('id'))
              if not e.get('publicUrlVerified',False):
                e['enabled']=True
                e['forceRetry']=False
          missing=free_ids-set(seen)
          if missing: raise SystemExit('Missing free NOTE ids: '+','.join(sorted(missing)))
          save(fp,fq)

          cp=pathlib.Path('booth-autopublish/monitor/recovery_control.json')
          c=json.loads(cp.read_text(encoding='utf-8-sig'))
          c['version']=int(c.get('version',0))+1
          c['updatedAt']=stamp
          c['activeRecovery']={'date':'2026-08-23','mode':'force_current_day_all_now','requiredStrictNewPublications':5,'remaining':5}
          c['readyPaidRecoveryBatch']=c.get('readyPaidRecoveryBatch',{})
          c['readyPaidRecoveryBatch']['queueIds']=list(booth_ids)
          c['readyPaidRecoveryBatch']['queueRetryGeneration']=bq['retryGeneration']
          c['readyPaidRecoveryBatch']['forcedRecoveryAt']=stamp
          c['readyPaidRecoveryBatch']['forceRetryNonce']=nonce
          save(cp,c)

          req=pathlib.Path('sidehustle-autopublish/windows_publication_request.json')
          req.write_text(json.dumps({
            'version':1,'requestedAt':stamp,'nonce':nonce,
            'mode':'publish_all_current_day_now',
            'paidNoteIds':list(paid_note_ids),'boothIds':list(booth_ids),'freeNoteIds':list(free_ids),
            'completion':'strict public verification only'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Commit forced retry state
        run: |
          git config user.name 'publication-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add sidehustle-autopublish/note/queue/index.json \
                  sidehustle-autopublish/note/free_queue/index.json \
                  booth-autopublish/queue/index.json \
                  booth-autopublish/monitor/recovery_control.json \
                  sidehustle-autopublish/windows_publication_request.json
          git commit -m 'Force all 2026-08-23 publications now'
          git pull --rebase origin main
          git push origin HEAD:main
