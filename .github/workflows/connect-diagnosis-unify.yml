name: Finalize Diagnosis Unity

on:
  push:
    paths:
      - '.github/workflows/connect-diagnosis-unify.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate diagnosis unity layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('diagnosis.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('\n<link rel="stylesheet" href="diagnosis-unify.css?v=20260827a">','')
          s=s.replace('<script defer src="diagnosis-unify.js?v=20260827a"></script>','')
          s=s.replace('diagnosis-fixes.css?v=20260827e','diagnosis-fixes.css?v=20260827f')
          s=s.replace('diagnosis-group-colors.js?v=20260827e','diagnosis-group-colors.js?v=20260827f')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f diagnosis-unify.css diagnosis-unify.js
      - name: Validate final diagnosis layer
        run: |
          node --check diagnosis.js
          node --check diagnosis-visual-v2.js
          node --check diagnosis-group-colors.js
          grep -q 'diagnosis-fixes.css?v=20260827f' diagnosis.html
          grep -q 'diagnosis-group-colors.js?v=20260827f' diagnosis.html
          ! grep -q 'diagnosis-unify' diagnosis.html
      - name: Commit clean final state
        run: |
          git config user.name 'NOTO-ReBloom Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnosis.html diagnosis-group-colors.js
          git add -u diagnosis-unify.css diagnosis-unify.js
          git rm .github/workflows/connect-diagnosis-unify.yml
          git commit -m 'Finalize diagnosis typography and group color system'
          git push
