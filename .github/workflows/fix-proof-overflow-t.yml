name: Finalize crowdfunding proof cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove decorative overflow and bump cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          css=Path('rebloom-purpose-complete.css')
          t=css.read_text(encoding='utf-8')
          marker='/* CROWDFUNDING CARD OVERFLOW FINAL */'
          if marker not in t:
              t += '\n'+marker+'\nbody.rb-unified #crowdfunding-result .rb-proof-card::after{display:none!important}\n'
          css.write_text(t,encoding='utf-8')
          pages=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']
          for name in pages:
              p=Path(name); x=p.read_text(encoding='utf-8')
              x=re.sub(r'rebloom-purpose-complete\\.css\\?v=20260817[a-z]','rebloom-purpose-complete.css?v=20260817t',x)
              x=re.sub(r'rebloom-unified\\.js\\?v=20260817[a-z]','rebloom-unified.js?v=20260817t',x)
              p.write_text(x,encoding='utf-8')
          p=Path('rebloom-detail.js'); x=p.read_text(encoding='utf-8')
          x=re.sub(r'rebloom-purpose-complete\\.css\\?v=20260817[a-z]','rebloom-purpose-complete.css?v=20260817t',x)
          p.write_text(x,encoding='utf-8')
          p=Path('rebloom-unified.js'); x=p.read_text(encoding='utf-8')
          x=re.sub(r'rebloom-detail\\.js\\?v=20260817[a-z]','rebloom-detail.js?v=20260817t',x)
          p.write_text(x,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('rebloom-purpose-complete.css').read_text(encoding='utf-8')
          assert css.count('{')==css.count('}')
          assert 'rb-proof-card::after{display:none!important}' in css
          for n in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              x=Path(n).read_text(encoding='utf-8')
              assert 'rebloom-purpose-complete.css?v=20260817t' in x
              assert 'rebloom-unified.js?v=20260817t' in x
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebloom-purpose-complete.css rebloom-detail.js rebloom-unified.js index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "クラファン実績カードの横方向の余剰を解消"
          git push
