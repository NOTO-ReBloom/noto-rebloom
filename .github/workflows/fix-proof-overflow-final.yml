name: Final crowdfunding card overflow fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tiny final override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          css='<style id="crowdfunding-proof-final">body.rb-unified #crowdfunding-result .rb-proof-card::after{display:none!important}</style>'
          if 'id="crowdfunding-proof-final"' not in t:
              t=t.replace('</head>',css+'</head>',1)
          p.write_text(t,encoding='utf-8')
          assert 'id="crowdfunding-proof-final"' in t
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "クラファン実績カードの装飾オーバーフローを解消"
          git push
