name: Cleanup sponsor refinement temporary files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            .github/workflows/apply-sponsor-effect-s.yml \
            .github/workflows/apply-sponsor-effect-s3.yml \
            .github/workflows/audit-sponsor-effect-s.yml \
            .github/workflows/fix-proof-overflow-t.yml \
            .github/workflows/fix-proof-overflow-final.yml \
            .github/workflows/cleanup-sponsor-temp.yml \
            tools/apply_sponsor_effect.py \
            audit-trigger-final-sponsor.txt; do
            if [ -e "$f" ]; then git rm "$f"; fi
          done
          git diff --cached --quiet || git commit -m "協賛改善用の一時検証ファイルを削除"
          git push
