name: Apply complete purpose P

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete purpose system
        run: |
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          node --check rebloom-tight.js
          node --check rebloom-purpose.js
          node --check rebloom-purpose-complete.js
          test -f rebloom-purpose.css
          test -f rebloom-purpose-complete.css
          grep -Fq '農林水産省「荒廃農地の発生防止・解消等」' rebloom-purpose.js
          grep -Fq 'rebloom-purpose.css?v=20260817p' rebloom-detail.js
          grep -Fq 'rebloom-purpose-complete.css?v=20260817p' rebloom-detail.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ['rebloom-purpose.css','rebloom-purpose-complete.css']:
              t=Path(name).read_text(encoding='utf-8')
              assert t.count('{')==t.count('}'), (name,t.count('{'),t.count('}'))
          PY
      - name: Bump complete loading chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('rebloom-unified.js')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'rebloom-detail\.js\?v=20260817[a-z]', 'rebloom-detail.js?v=20260817p', t)
          p.write_text(t,encoding='utf-8')
          assert 'rebloom-detail.js?v=20260817p' in t
          for name in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              p=Path(name)
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'rebloom-unified\.js\?v=20260817[a-z]', 'rebloom-unified.js?v=20260817p', t)
              p.write_text(t,encoding='utf-8')
              assert 'rebloom-unified.js?v=20260817p' in t, name
          PY
      - name: Commit public complete pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebloom-unified.js index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "全セクション目的別改善版を公開"
          git push
