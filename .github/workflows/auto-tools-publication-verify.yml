name: Auto Tools Publication Verify

on:
  push:
    branches: [main]
    paths:
      - 'auto-tools/**'
      - '.github/workflows/auto-tools-publication-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tools-publication-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify published auto tools
        shell: python
        run: |
          import json, pathlib, urllib.request, urllib.error, re, datetime, time
          idx = json.loads(pathlib.Path('auto-tools/index.json').read_text(encoding='utf-8-sig'))
          ledger_path = pathlib.Path('auto-tools/publication_ledger.json')
          if ledger_path.exists():
              ledger = json.loads(ledger_path.read_text(encoding='utf-8-sig'))
          else:
              ledger = {'version':1,'updatedAt':None,'entries':[]}
          by_slug = {e.get('slug'):e for e in ledger.get('entries',[])}
          base = 'https://noto-rebloom.github.io/noto-rebloom/'
          changed = False
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds')
          for tool in idx.get('tools', []):
              slug = tool['slug']
              url = base + tool['path']
              ok = False; status = None; title_ok = False; ui_ok = False; err = None
              html = ''
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 publication-verifier'})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          status = r.status
                          html = r.read().decode('utf-8','replace')
                      title_ok = tool['title'] in html
                      ui_ok = ('<main' in html.lower() or '<body' in html.lower()) and len(re.sub(r'<[^>]+>','',html).strip()) > 80
                      ok = status == 200 and title_ok and ui_ok
                      if ok: break
                  except Exception as e:
                      err = repr(e)
                  time.sleep(15)
              prev = by_slug.get(slug, {})
              entry = {
                  'slug':slug,
                  'title':tool['title'],
                  'publicUrl':url,
                  'publicUrlVerified':bool(ok),
                  'httpStatus':status,
                  'titleVerified':bool(title_ok),
                  'majorUiVerified':bool(ui_ok),
                  'verifiedAt':now if ok else prev.get('verifiedAt'),
                  'lastCheckedAt':now,
                  'error':None if ok else err
              }
              if prev != entry:
                  by_slug[slug] = entry; changed = True
          ledger['entries'] = [by_slug[t['slug']] for t in idx.get('tools',[]) if t['slug'] in by_slug]
          ledger['updatedAt'] = now
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Commit verification ledger
        run: |
          if git diff --quiet -- auto-tools/publication_ledger.json; then
            echo 'No publication verification changes.'
            exit 0
          fi
          git config user.name 'auto-tools-publication-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add auto-tools/publication_ledger.json
          git commit -m 'Verify GitHub Pages auto tools publication'
          git push origin HEAD:main
