name: Verify paid NOTE recovery quietly

on:
  workflow_dispatch:
  push:
    paths:
      - 'sidehustle-autopublish/note/queue/index.json'
      - 'sidehustle-autopublish/completion_gate.json'
      - '.github/workflows/note-paid-public-verifier.yml'
  schedule:
    - cron: '12,27,42,57 * * * *'

permissions:
  contents: write

concurrency:
  group: note-paid-public-verifier
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Discover and strictly verify current paid NOTE debt
        shell: python
        run: |
          import urllib.request, json, re, html, pathlib, datetime
          USER='royal_lion645'
          UA={'User-Agent':'Mozilla/5.0 (compatible; strict-publication-verifier/3.0)','Cache-Control':'no-cache'}
          def load(p): return json.loads(pathlib.Path(p).read_text(encoding='utf-8-sig'))
          def save(p,o): pathlib.Path(p).write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def get(url,timeout=20):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,r.read().decode('utf-8','replace')
          def jget(url): s,t=get(url); return s,json.loads(t)
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items(): yield k,v; yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          def has_price(obj,price):
              return price in [int(v) for k,v in walk(obj) if str(k).lower() in ('price','price_yen','amount') and isinstance(v,(int,float))]
          def cover(obj):
              for k,v in walk(obj):
                  kl=str(k).lower()
                  if ('eyecatch' in kl or 'thumbnail' in kl or kl in ('coverimage','cover_image')) and isinstance(v,str) and v.startswith('http'): return v
          gate=load('sidehustle-autopublish/completion_gate.json')
          TARGETS=set(gate.get('completionConditions',{}).get('notePaid',{}).get('requiredIds',[]))
          if not TARGETS:
              print('NO_CURRENT_PAID_TARGETS'); raise SystemExit(0)
          qp=pathlib.Path('sidehustle-autopublish/note/queue/index.json'); q=load(qp)
          targets={e['id']:e for e in q.get('entries',[]) if e.get('id') in TARGETS}
          if set(targets)!=TARGETS: raise SystemExit('QUEUE_MISSING_CURRENT_TARGETS '+','.join(sorted(TARGETS-set(targets))))
          titles={x['title'] for x in targets.values()}; public={}
          for pn in range(1,12):
              try: _,o=jget(f'https://note.com/api/v2/creators/{USER}/contents?kind=note&disabled_pinned=true&page={pn}')
              except Exception as ex: print('LIST_API_WARN',pn,repr(ex)); continue
              data=o.get('data') or {}; contents=data.get('contents') or []
              for it in contents:
                  if isinstance(it,dict) and it.get('name') in titles: public[it.get('name')]=it
              if data.get('isLastPage'): break
          newly=[]
          for iid,e in targets.items():
              if e.get('publicUrlVerified') is True: continue
              it=public.get(e['title'])
              if not it: continue
              key=it.get('key'); url=it.get('noteUrl') or it.get('note_url') or it.get('url')
              if not key and isinstance(url,str):
                  m=re.search(r'/n/(n[0-9A-Za-z]+)',url); key=m.group(1) if m else None
              if key and not url: url=f'https://note.com/{USER}/n/{key}'
              if not key or not url: continue
              try: ds,detail=jget(f'https://note.com/api/v3/notes/{key}'); ps,page=get(url)
              except Exception as ex: print('DETAIL_WARN',iid,repr(ex)); continue
              dobj=detail.get('data',detail) if isinstance(detail,dict) else detail
              price=int(e.get('expectedPriceJPY') or 0); text=html.unescape(page); compact=re.sub(r'[\s,，]','',text)
              title_ok=e['title'] in text; price_api=has_price(it,price) or has_price(dobj,price)
              price_page=(str(price)+'円' in compact or '¥'+str(price) in compact or '￥'+str(price) in compact)
              cov=cover(it) or cover(dobj); paid_boundary=any(w in text for w in ('購入して続きをみる','購入手続き','この記事を購入','この続きをみる','有料記事'))
              ok=ps==200 and ds==200 and title_ok and price_api and price_page and bool(cov) and paid_boundary
              print('CHECK',iid,ok,url)
              if not ok: continue
              now=datetime.datetime.now(datetime.timezone.utc).isoformat()
              e.update({'enabled':False,'forceRetry':False,'forcePublicationNow':False,'publicUrlVerified':True,'publicUrl':url,'verificationState':'reader_visible_verified','verificationEvidence':'Independent unauthenticated verifier confirmed HTTP 200, exact title, expected price, paid purchase boundary and dedicated cover.','verifiedAt':now})
              rp=pathlib.Path('sidehustle-autopublish/note/publication_receipts')/(iid+'.json'); rp.parent.mkdir(parents=True,exist_ok=True)
              rp.write_text(json.dumps({'id':iid,'title':e['title'],'publicUrl':url,'priceJPY':price,'readerHttpStatus':ps,'detailHttpStatus':ds,'titleVerified':True,'priceVerified':True,'paidBoundaryVerified':True,'coverVerified':True,'coverUrl':cov,'verifiedAt':now},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              newly.append(iid)
          stamp=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds')
          if newly:
              q['updatedAt']=stamp; save(qp,q)
          # Recompute canonical completion counters from all three current queues without claiming unverified items.
          freeq=load('sidehustle-autopublish/note/free_queue/index.json'); boothq=load('booth-autopublish/queue/index.json')
          cc=gate.get('completionConditions',{})
          def done(queue,ids):
              m={(e.get('id') or e.get('queueId')):e for e in queue.get('entries',[])}
              return sum(1 for i in ids if m.get(i,{}).get('publicUrlVerified') is True)
          pids=list(cc.get('notePaid',{}).get('requiredIds',[])); fids=list(cc.get('noteFree',{}).get('requiredIds',[])); bids=list(cc.get('BOOTH',{}).get('requiredIds',[]))
          pd=done(q,pids); fd=done(freeq,fids); bd=done(boothq,bids); total=pd+fd+bd; required=len(pids)+len(fids)+len(bids)
          gate['updatedAt']=stamp; gate['completionCounts']={'strictVerifiedInThisRequest':total,'required':required,'remaining':required-total,'paidNoteRemaining':len(pids)-pd,'freeNoteRemaining':len(fids)-fd,'BOOTHRemaining':len(bids)-bd}
          gate['status']='complete_strict_verified' if total==required else f'in_progress_{total}_of_{required}'
          save('sidehustle-autopublish/completion_gate.json',gate)
          quota=load('sidehustle-autopublish/publication_quota.json'); st=quota['channels']['note']['operationalState']
          st['todayStrictVerifiedPublicationsCount']=pd; st['todayRemainingToTarget']=max(0,len(pids)-pd); st['strictPublicationState']=f"{gate.get('date')} {pd}/{len(pids)} strict verified"; st['lastStrictVerificationAt']=stamp
          quota['updatedAt']=stamp; quota['version']=int(quota.get('version',0))+1; save('sidehustle-autopublish/publication_quota.json',quota)
          print('CURRENT_PAID_VERIFIED',pd,'OF',len(pids),'NEW',newly)
      - name: Commit verifier reconciliation
        run: |
          if git diff --quiet -- sidehustle-autopublish/note/queue/index.json sidehustle-autopublish/publication_quota.json sidehustle-autopublish/completion_gate.json sidehustle-autopublish/note/publication_receipts; then exit 0; fi
          git config user.name 'note-paid-public-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add sidehustle-autopublish/note/queue/index.json sidehustle-autopublish/publication_quota.json sidehustle-autopublish/completion_gate.json sidehustle-autopublish/note/publication_receipts
          git commit -m 'Reconcile current paid NOTE strict publications'
          git pull --rebase origin main
          git push origin HEAD:main
