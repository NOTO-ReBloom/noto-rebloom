name: Visual Review Temp
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.55.0
      - name: Render all pages
        run: |
          cat > visual-review.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          (async()=>{
            fs.mkdirSync('visual-review',{recursive:true});
            const pages=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html'];
            const views=[['desktop',1440,1000],['mobile',390,844]];
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            const report=[];
            for(const [label,w,h] of views){
              const ctx=await b.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'});
              for(const f of pages){
                const p=await ctx.newPage(); const errors=[]; p.on('pageerror',e=>errors.push(String(e)));
                await p.route('**/*',r=>{const u=r.request().url();if(u.startsWith('http://127.0.0.1:8000/')||u.startsWith('data:')||u.startsWith('blob:'))r.continue();else r.abort();});
                const res=await p.goto('http://127.0.0.1:8000/'+f,{waitUntil:'load',timeout:20000});
                await p.waitForTimeout(1000);
                const metrics=await p.evaluate(()=>{
                  const all=[...document.querySelectorAll('main section')];
                  return {
                    title:document.title,
                    overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                    height:document.documentElement.scrollHeight,
                    sections:all.map((s,i)=>({i,id:s.id||'',cls:s.className||'',h:Math.round(s.getBoundingClientRect().height),text:(s.innerText||'').trim().slice(0,120)})),
                    buttons:[...document.querySelectorAll('a.btn,button')].filter(x=>{const r=x.getBoundingClientRect();return r.width&&r.height}).map(x=>({t:(x.innerText||'').trim(),w:Math.round(x.getBoundingClientRect().width),h:Math.round(x.getBoundingClientRect().height)})),
                    images:[...document.images].map(i=>({src:i.getAttribute('src'),w:i.naturalWidth,h:i.naturalHeight,display:[i.getBoundingClientRect().width,i.getBoundingClientRect().height]}))
                  }
                });
                report.push({page:f,view:label,status:res&&res.status(),errors,metrics});
                await p.screenshot({path:`visual-review/${f.replace('.html','')}-${label}.png`,fullPage:true});
                await p.close();
              }
              await ctx.close();
            }
            await b.close();
            fs.writeFileSync('visual-review/report.json',JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8000 >/tmp/site.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1; node visual-review.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: visual-review
