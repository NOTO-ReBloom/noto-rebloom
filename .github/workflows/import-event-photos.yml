name: Import event photos
on:
  push:
    paths:
      - '.github/workflows/import-event-photos.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download optimized event photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/event-2026
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/8cf1fd65-0406-4382-9312-8fa6afbed0ab.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmM2MDZlZDRhZjAyNGQ2ZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDI2Nzg2MH0.L-d-UTTAkeG2PIjc98phTUrbhdzRlp0_vsXv3-iqlmI' -o assets/event-2026/group.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f4e04f85-3a60-462e-ada9-67a1cea4a04a.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGUwYjFlOTdhNzlhY2RhZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDI1Mzk3NX0.MQqfwmiS36crxkO0dTNR6xBj91Fvny514frggm_Tjus' -o assets/event-2026/child.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/6d17d696-3c0c-4099-9ebf-c7093799cebc.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDE5MDNjZDg2M2RhNzM1YiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDIyMzcwNH0.CmuRUGnBlEKhAvTPiCoSBKnUV-jQ4e8GzQ6TwmLI2lk' -o assets/event-2026/field.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/07e87422-f0c8-4ab6-8c3d-25c869e3b433.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzJlM2Y0NTlhZWNmN2U1MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDI5MTkyOX0.bFW69yhSPoizY2MPI5SkAu29P3wEC5Krt3bsQgijmzg' -o assets/event-2026/game.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/0556dc32-054d-4cd5-9ea1-3b4c5009d4db.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWFiYmZiM2M2OGE4NTIyZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDIzNTA2OH0.nFcO1jevwbsi56FgGT5duZKCSIwMG68eyLOZdHaPIII' -o assets/event-2026/cup.webp
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d4384b84-8b1c-4a37-b255-eebc3fe7939f.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTkxNzI3OTg0ODNiMjBiOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDI2NjM5Mn0.J_nIn8Thk0tzgVeRdA4njZ4kzw1Gtyc8bzyshnL8VbY' -o assets/event-2026/cup-making.webp
          file assets/event-2026/*
          test $(stat -c%s assets/event-2026/group.webp) -gt 100000
          test $(stat -c%s assets/event-2026/child.webp) -gt 150000
          test $(stat -c%s assets/event-2026/field.webp) -gt 150000
      - name: Commit photos
        shell: bash
        run: |
          git config user.name "NOTO-ReBloom"
          git config user.email "ryoya20041219@gmail.com"
          git add assets/event-2026
          git diff --cached --quiet && exit 0
          git commit -m "Add high-quality original event photography"
          git push
