name: Note Queue Integrity Repair

on:
  push:
    paths:
      - '.github/workflows/note-queue-integrity-repair.yml'
      - 'sidehustle-autopublish/note/queue/*.enc.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile encrypted payload SHA-256 values
        shell: python
        run: |
          import hashlib, json, pathlib
          idx_path = pathlib.Path('sidehustle-autopublish/note/queue/index.json')
          idx = json.loads(idx_path.read_text(encoding='utf-8'))
          changed = False
          for e in idx.get('entries', []):
              p = pathlib.Path(e.get('path',''))
              if not p.name.endswith('.enc.json') or not p.exists():
                  continue
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if e.get('sha256') != actual:
                  print(f"REPAIR_SHA {e.get('id')} {e.get('sha256')} -> {actual}")
                  e['sha256'] = actual
                  changed = True
          if changed:
              idx_path.write_text(json.dumps(idx, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          else:
              print('QUEUE_SHA_OK')
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- sidehustle-autopublish/note/queue/index.json; then
            echo 'NO_REPAIR_COMMIT_NEEDED'
            exit 0
          fi
          git config user.name 'note-queue-integrity-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sidehustle-autopublish/note/queue/index.json
          git commit -m 'Repair note queue encrypted payload hashes'
          git push
