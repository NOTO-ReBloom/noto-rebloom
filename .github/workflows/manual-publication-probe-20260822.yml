name: One-shot publication probe after Windows run

on:
  push:
    paths:
      - '.github/workflows/manual-publication-probe-20260822.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Probe NOTE and BOOTH public surfaces
        shell: python
        run: |
          import urllib.request, urllib.parse, re, html, json, pathlib, datetime
          UA={'User-Agent':'Mozilla/5.0 (compatible; one-shot-publication-probe/1.0)','Accept-Language':'ja,en;q=0.7','Cache-Control':'no-cache'}
          def get(url,timeout=25):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,r.read().decode('utf-8','replace')
          def jget(url):
              s,t=get(url); return s,json.loads(t)
          def visible_text(src):
              src=re.sub(r'<script\b[^>]*>.*?</script>',' ',src,flags=re.I|re.S)
              src=re.sub(r'<style\b[^>]*>.*?</style>',' ',src,flags=re.I|re.S)
              return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',src))).strip()
          out={'checkedAt':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds'),'note':[],'booth':[]}
          nq=json.loads(pathlib.Path('sidehustle-autopublish/note/queue/index.json').read_text(encoding='utf-8-sig'))
          note_targets=[e for e in nq.get('entries',[]) if e.get('enabled') is True and e.get('publicUrlVerified') is not True]
          public={}
          for pn in range(1,8):
              try:
                  _,o=jget(f'https://note.com/api/v2/creators/royal_lion645/contents?kind=note&disabled_pinned=true&page={pn}')
              except Exception as ex:
                  out.setdefault('noteErrors',[]).append(f'page{pn}:{ex!r}'); continue
              data=o.get('data') or {}
              for it in data.get('contents') or []:
                  if isinstance(it,dict): public[it.get('name')]=it
              if data.get('isLastPage'): break
          for e in note_targets:
              it=public.get(e.get('title'))
              rec={'id':e.get('id'),'title':e.get('title'),'expectedPriceJPY':e.get('expectedPriceJPY'),'foundInCreatorApi':bool(it)}
              if it:
                  key=it.get('key'); url=it.get('noteUrl') or it.get('note_url') or it.get('url')
                  if key and not url:url=f'https://note.com/royal_lion645/n/{key}'
                  rec['publicUrlCandidate']=url
                  if key:
                      try:
                          ds,d=jget(f'https://note.com/api/v3/notes/{key}'); rec['detailHttpStatus']=ds
                      except Exception as ex:rec['detailError']=repr(ex)
                  if url:
                      try:
                          ps,p=get(url); txt=html.unescape(p); comp=re.sub(r'[\s,，]','',txt); price=int(e.get('expectedPriceJPY') or 0)
                          rec.update({'readerHttpStatus':ps,'titleOnPage':e.get('title') in txt,'priceOnPage':(f'{price}円' in comp or f'¥{price}' in comp or f'￥{price}' in comp),'paidSignal':any(w in txt for w in ('購入して続きをみる','購入手続き','この記事を購入','この続きをみる','有料記事'))})
                      except Exception as ex:rec['readerError']=repr(ex)
              out['note'].append(rec)
          bq=json.loads(pathlib.Path('booth-autopublish/queue/index.json').read_text(encoding='utf-8-sig'))
          booth_targets=[e for e in bq.get('entries',[]) if e.get('enabled') is True and e.get('publicUrlVerified') is not True]
          for e in booth_targets:
              title=e.get('title'); price=int(e.get('expectedPriceJPY') or 0); rec={'id':e.get('id'),'title':title,'expectedPriceJPY':price,'candidateUrls':[],'strictMatches':[]}
              search='https://booth.pm/ja/search/'+urllib.parse.quote(title,safe='')+'?sort=new'
              try:ss,sh=get(search);rec['searchHttpStatus']=ss
              except Exception as ex:rec['searchError']=repr(ex);out['booth'].append(rec);continue
              links=[]
              for m in re.finditer(r'href=["\'](?:https://booth\.pm)?(/ja/items/(\d+))["\']',sh):
                  u='https://booth.pm'+m.group(1)
                  if u not in links:links.append(u)
              for u in links[:12]:
                  try:
                      ps,page=get(u);text=visible_text(page);comp=re.sub(r'[\s,，]','',text)
                      checks={'url':u,'httpStatus':ps,'titleOk':title in text,'priceOk':(f'¥{price}' in comp or f'￥{price}' in comp or f'{price}円' in comp),'downloadOk':any(x in text for x in ('ダウンロード商品','ダウンロード版','Download Product','digital download')),'purchaseOk':any(x in text for x in ('カートに入れる','購入する'))}
                      rec['candidateUrls'].append(checks)
                      if all(checks[k] for k in ('titleOk','priceOk','downloadOk','purchaseOk')) and ps==200:rec['strictMatches'].append(u)
                  except Exception:pass
              out['booth'].append(rec)
          p=pathlib.Path('sidehustle-autopublish/monitor/manual_publication_probe_20260822.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit one-shot probe result
        run: |
          git config user.name 'manual-publication-probe'
          git config user.email 'actions@users.noreply.github.com'
          git add sidehustle-autopublish/monitor/manual_publication_probe_20260822.json
          git commit -m 'Record one-shot NOTE and BOOTH publication probe'
          git pull --rebase origin main
          git push origin HEAD:main
