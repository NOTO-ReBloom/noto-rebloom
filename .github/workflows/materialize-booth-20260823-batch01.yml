name: Materialize BOOTH 2026-08-23 paid batch

on:
  push:
    paths:
      - 'sidehustle-autopublish/builders/materialize_booth_20260823_batch01.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: booth-20260823-batch01-materialization
  cancel-in-progress: false

jobs:
  build-encrypt-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check cryptography pillow
      - name: Build, QA, encrypt and queue 5 complete products
        run: python sidehustle-autopublish/builders/materialize_booth_20260823_batch01.py
      - name: Commit encrypted queue materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add booth-autopublish/queue booth-autopublish/monitor/cloud_materialization_20260823_batch01.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize five BOOTH 2026-08-23 paid products'
          git pull --rebase origin main
          git push
