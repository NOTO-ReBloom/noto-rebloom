name: Bump cinematic mud cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire cinematic layer and bump cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          detail=Path('rebloom-detail.js')
          t=detail.read_text(encoding='utf-8')
          if 'rebloom-cinematic.js' not in t:
              snippet='''\n\n  /* Cinematic layer: full-screen mud impacts and the live project overview diagram. */\n  if(!document.querySelector('link[href*="rebloom-cinematic.css"]')){\n    const cinemaStyle=document.createElement('link');\n    cinemaStyle.rel='stylesheet';\n    cinemaStyle.href='rebloom-cinematic.css?v=20260817j';\n    document.head.appendChild(cinemaStyle);\n  }\n  if(!document.querySelector('script[src*="rebloom-cinematic.js"]')){\n    const cinemaScript=document.createElement('script');\n    cinemaScript.src='rebloom-cinematic.js?v=20260817j';\n    cinemaScript.defer=true;\n    document.body.appendChild(cinemaScript);\n  }'''
              idx=t.rfind('\n})();')
              if idx==-1: raise SystemExit('detail closure not found')
              t=t[:idx]+snippet+t[idx:]
          detail.write_text(t,encoding='utf-8')

          css=Path('rebloom-cinematic.css')
          c=css.read_text(encoding='utf-8')
          if '.rb-fun-wipe-mark{display:none!important}' not in c:
              c += '\n/* Keep the big transition visual-only: no extra interstitial copy. */\n.rb-fun-wipe-mark{display:none!important}\n'
          css.write_text(c,encoding='utf-8')

          unified=Path('rebloom-unified.js')
          u=unified.read_text(encoding='utf-8').replace('rebloom-detail.js?v=20260817i','rebloom-detail.js?v=20260817j')
          unified.write_text(u,encoding='utf-8')

          for name in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8').replace('rebloom-unified.js?v=20260817i','rebloom-unified.js?v=20260817j')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check rebloom-cinematic.js
          node --check rebloom-detail.js
          node --check rebloom-unified.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebloom-cinematic.css rebloom-detail.js rebloom-unified.js index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "全画面の泥演出と動く企画図を公開ページへ反映"
          git push
