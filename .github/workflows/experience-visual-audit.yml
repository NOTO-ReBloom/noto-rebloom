name: Experience visual audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bump experience cache chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          u=Path('rebloom-unified.js')
          s=u.read_text(encoding='utf-8').replace("rebloom-detail.js?v=20260817v","rebloom-detail.js?v=20260817z")
          u.write_text(s,encoding='utf-8')
          for f in ['index.html','event.html']:
              p=Path(f); t=p.read_text(encoding='utf-8').replace('rebloom-unified.js?v=20260817v','rebloom-unified.js?v=20260817z'); p.write_text(t,encoding='utf-8')
          PY
      - name: Install browser runtime
        run: npm install --no-save playwright-core@1.55.0
      - name: Render home and event
        run: |
          cat > experience-audit.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          (async()=>{
            fs.mkdirSync('experience-audit',{recursive:true});
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            for(const vp of [{n:'desktop',width:1440,height:1000},{n:'mobile',width:390,height:844}]){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              for(const file of ['index.html','event.html']){
                const page=await ctx.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
                await page.route('**/*',r=>{const u=r.request().url(); if(u.startsWith('http://127.0.0.1:8000/')||u.startsWith('data:')||u.startsWith('blob:')) r.continue(); else r.abort();});
                const res=await page.goto('http://127.0.0.1:8000/'+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(1100);
                const m=await page.evaluate(file=>{
                  const overflow=document.documentElement.scrollWidth-document.documentElement.clientWidth;
                  if(file==='index.html'){
                    const s=document.querySelector('.rb-project-glance'); const cards=[...document.querySelectorAll('.rb-glance-flow article')];
                    return {overflow,section:!!s,cards:cards.length,svgs:document.querySelectorAll('.rb-glance-flow svg').length,headline:s?.querySelector('h2')?.innerText||''};
                  }
                  const s=document.querySelector('.rb-mud-play-section'); const cards=[...document.querySelectorAll('.rb-play-grid article')];
                  const text=(s?.innerText||'');
                  return {overflow,section:!!s,cards:cards.length,svgs:document.querySelectorAll('.rb-play-grid svg').length,note:!!document.querySelector('.rb-play-note'),pending:text.includes('検討中')};
                },file);
                if(!res||res.status()>=400||errors.length||m.overflow>2||!m.section||m.cards!==4||m.svgs!==4||(file==='event.html'&&(!m.note||!m.pending))) throw new Error(`${file}/${vp.n} ${JSON.stringify({errors,...m})}`);
                await page.screenshot({path:`experience-audit/${file.replace('.html','')}-${vp.n}.png`,fullPage:true});
                await page.close();
              }
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node experience-audit.cjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: experience-visual-audit
          path: experience-audit
          retention-days: 2
      - name: Commit cache bump
        run: |
          rm -f experience-audit.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html event.html rebloom-unified.js
          git diff --cached --quiet && exit 0
          git commit -m 'ホームと泥ん子運動会の新ビジュアルを公開反映'
          git push
