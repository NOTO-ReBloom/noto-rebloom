name: Bump fun conversion cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump participation layer versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rebloom-detail.js')
          t=p.read_text(encoding='utf-8').replace('rebloom-fun.css?v=20260817h','rebloom-fun.css?v=20260817i').replace('rebloom-fun.js?v=20260817h','rebloom-fun.js?v=20260817i')
          p.write_text(t,encoding='utf-8')
          p=Path('rebloom-unified.js')
          t=p.read_text(encoding='utf-8').replace('rebloom-detail.js?v=20260817h','rebloom-detail.js?v=20260817i')
          p.write_text(t,encoding='utf-8')
          for name in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
            p=Path(name)
            t=p.read_text(encoding='utf-8').replace('rebloom-unified.js?v=20260817h','rebloom-unified.js?v=20260817i')
            p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebloom-detail.js rebloom-unified.js index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "参加したくなる学生らしい演出を全ページへ反映"
          git push
