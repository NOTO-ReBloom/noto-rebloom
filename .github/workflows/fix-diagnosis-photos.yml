name: Fix Diagnosis Photos

on:
  push:
    paths:
      - '.github/workflows/fix-diagnosis-photos.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Download representative flower photos
        run: |
          python - <<'PY'
          import io, json, pathlib, time, urllib.parse, urllib.request
          from PIL import Image, ImageOps

          root=pathlib.Path('.')
          targets={
            'tsubaki':'Camellia_japonica',
            'ajisai':'Hydrangea_macrophylla',
            'kasumisou':'Gypsophila_paniculata',
          }
          headers={'User-Agent':'NOTO-ReBloom-website/1.0 (https://github.com/NOTO-ReBloom/noto-rebloom)'}

          def request_json(url):
            last=None
            for wait in (0,2,5,10):
              if wait: time.sleep(wait)
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=35) as r: return json.load(r)
              except Exception as exc: last=exc
            raise last

          def request_bytes(url):
            last=None
            for wait in (0,2,5,10):
              if wait: time.sleep(wait)
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=40) as r: return r.read()
              except Exception as exc: last=exc
            raise last

          for slug,title in targets.items():
            api='https://en.wikipedia.org/api/rest_v1/page/summary/'+urllib.parse.quote(title,safe='()_')
            data=request_json(api)
            src=(data.get('originalimage') or data.get('thumbnail') or {}).get('source')
            if not src: raise SystemExit(f'No image for {title}')
            raw=request_bytes(src)
            im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
            scale=max(900/im.width,675/im.height)
            nw,nh=max(1,round(im.width*scale)),max(1,round(im.height*scale))
            im=im.resize((nw,nh),Image.Resampling.LANCZOS)
            left=(nw-900)//2;top=(nh-675)//2
            im=im.crop((left,top,left+900,top+675))
            im.save(root/f'flower-photo-{slug}.webp','WEBP',quality=84,method=6)
            print(slug,src)
            time.sleep(1)

          clover=root/'flower-photo-clover.webp'
          if clover.exists(): clover.unlink()

          html_path=root/'diagnosis.html'
          html=html_path.read_text(encoding='utf-8')
          html=html.replace('diagnosis-visual-v2.js?v=20260827b','diagnosis-visual-v2.js?v=20260827c')
          html=html.replace('diagnosis-visual-v2.js?v=20260827c','diagnosis-visual-v2.js?v=20260827c')
          html_path.write_text(html,encoding='utf-8')

          # Audit: every flower defined by diagnosis.js must have a photographic asset.
          import re
          text=(root/'diagnosis.js').read_text(encoding='utf-8')
          slugs=re.findall(r'"slug"\s*:\s*"([a-z]+)"',text.split('const FLOWER_MAP',1)[0])
          missing=[s for s in slugs if not (root/f'flower-photo-{s}.webp').exists()]
          print('flower count',len(slugs),'missing',missing)
          if len(slugs)!=32 or missing: raise SystemExit('Flower photo audit failed')
          PY
      - name: Syntax check diagnosis scripts
        run: |
          node --check diagnosis.js
          node --check diagnosis-visual-v2.js
      - name: Commit repairs
        run: |
          git config user.name 'NOTO-ReBloom Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnosis.html diagnosis-visual-v2.js diagnosis-fixes.css flower-photo-tsubaki.webp flower-photo-ajisai.webp flower-photo-kasumisou.webp
          git add -u flower-photo-clover.webp || true
          git commit -m 'Repair diagnosis navigation and flower photography'
          git push
