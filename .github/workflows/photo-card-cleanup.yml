name: Photo card cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply photo-card fix
        env:
          CSS_PATCH_B64: ""
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('rebloom-fit.css')
          s=p.read_text(encoding='utf-8')
          marker='/* FINAL Y — photo-card cleanup:'
          patch=base64.b64decode(os.environ['CSS_PATCH_B64']).decode('utf-8')
          if marker not in s:
              p.write_text(s.rstrip()+"\n\n"+patch.strip()+"\n",encoding='utf-8')
          d=Path('rebloom-detail.js')
          ds=d.read_text(encoding='utf-8').replace("rebloom-fit.css?v=20260817w","rebloom-fit.css?v=20260817y")
          d.write_text(ds,encoding='utf-8')
          PY
      - name: Install browser runtime
        run: npm install --no-save playwright-core@1.55.0
      - name: Audit photo cards on PC and mobile
        run: |
          cat > /tmp/audit.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          const files=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html'];
          const vps=[['desktop',1440,1000],['mobile',390,844]];
          (async()=>{
            fs.mkdirSync('/tmp/photo-audit',{recursive:true});
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            for(const [name,width,height] of vps){
              const ctx=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'});
              for(const file of files){
                const page=await ctx.newPage(); const errs=[]; page.on('pageerror',e=>errs.push(String(e)));
                await page.route('**/*',r=>{const u=r.request().url(); if(u.startsWith('http://127.0.0.1:8000/')||u.startsWith('data:')||u.startsWith('blob:')) r.continue(); else r.abort();});
                const res=await page.goto('http://127.0.0.1:8000/'+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(900);
                const m=await page.evaluate(()=>{
                  const tiles=[...document.querySelectorAll('.visual-mosaic .visual-tile')];
                  const bad=tiles.filter(t=>{
                    const tr=t.getBoundingClientRect(),img=t.querySelector('img'),cap=t.querySelector('figcaption'),lab=t.querySelector('.visual-label');
                    if(!img||!cap)return true;
                    const ir=img.getBoundingClientRect(),cr=cap.getBoundingClientRect();
                    const inside=r=>r.left>=tr.left-1&&r.right<=tr.right+1&&r.top>=tr.top-1&&r.bottom<=tr.bottom+1;
                    return !inside(ir)||!inside(cr)||getComputedStyle(img).objectFit!=='contain'||(lab&&getComputedStyle(lab).display!=='none');
                  }).length;
                  return {overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,tiles:tiles.length,bad};
                });
                if(!res||res.status()>=400||errs.length||m.overflow>2||m.bad) throw new Error(`${file}/${name} failed ${JSON.stringify({status:res&&res.status(),errs, ...m})}`);
                await page.screenshot({path:`/tmp/photo-audit/${file.replace('.html','')}-${name}.png`,fullPage:true});
                await page.close();
              }
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node /tmp/audit.cjs
      - name: Commit fixed photo cards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rebloom-fit.css rebloom-detail.js
          git diff --cached --quiet && exit 0
          git commit -m '写真カードの端残りと画像切れを解消'
          git push
