name: Remove Kanazawa Port Once

on:
  push:
    paths:
      - '.github/workflows/remove-kanazawa-port-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove partner entry and rebalance layouts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Shared acknowledgement strip shown above every footer.
          p=Path('site.js')
          s=p.read_text(encoding='utf-8')
          anchor='<a class="site-partner-strip__logo" href="https://www.kanazawa-port.jp/" target="_blank" rel="noopener" aria-label="金沢ポート"><img src="kanazawa-port-logo.png" alt="金沢ポート" loading="lazy" decoding="async"></a>'
          if anchor not in s:
              raise SystemExit('Shared-strip entry not found')
          s=s.replace(anchor,'',1)
          s=s.replace('site-finishing.css?v=20260827b','site-finishing.css?v=20260827d')
          p.write_text(s,encoding='utf-8')

          # Dedicated cooperation card on partner page.
          p=Path('partner.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<article class="industry-partner-card industry-partner--kanazawa-port">.*?</article>','',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one cooperation card, removed {n}')
          p.write_text(s,encoding='utf-8')

          # Force fresh shared JS/CSS on every HTML page so old cached strips disappear.
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'site\.js\?v=[^"\']+','site.js?v=20260827d',s)
              s=re.sub(r'site-finishing\.css\?v=[^"\']+','site-finishing.css?v=20260827d',s)
              p.write_text(s,encoding='utf-8')

          # Six logos now: 3 + 3 on tablet, 2 + 2 + 2 on mobile.
          p=Path('site-finishing.css')
          s=p.read_text(encoding='utf-8')
          old='.site-partner-strip__logos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}'
          new='.site-partner-strip__logos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}'
          if old not in s:
              raise SystemExit('Partner strip tablet grid marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Cooperation page: three equal columns on desktop, two on tablet, one on mobile.
          p=Path('brand-refresh.css')
          s=p.read_text(encoding='utf-8')
          old='body.rb-unified #partner-network-grid{\n  grid-template-columns:repeat(2,minmax(0,1fr))!important;'
          new='body.rb-unified #partner-network-grid{\n  grid-template-columns:repeat(3,minmax(0,1fr))!important;'
          if old not in s:
              raise SystemExit('Cooperation grid marker not found')
          s=s.replace(old,new,1)
          s,n=re.subn(r'\n?\.industry-partner-logo--kanazawa-port img\{[^}]*\}\n?','\n',s,flags=re.S)
          if n < 2:
              raise SystemExit(f'Expected at least two obsolete logo CSS rules, removed {n}')
          tablet='''\n@media(max-width:900px){\n  body.rb-unified #partner-network-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}\n}\n'''
          if '@media(max-width:900px)' not in s:
              insert_at=s.find('@media(max-width:820px)')
              if insert_at < 0:
                  raise SystemExit('Responsive insertion marker not found')
              s=s[:insert_at]+tablet+'\n'+s[insert_at:]
          p.write_text(s,encoding='utf-8')
          PY

          rm -f kanazawa-port-logo.png

      - name: Validate complete removal
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden=('kanazawa-port','kanazawa-port.jp','金沢ポート','KANAZAWA PORT')
          hits=[]
          for p in Path('.').iterdir():
              if p.is_file() and p.suffix.lower() in {'.html','.js','.css'}:
                  text=p.read_text(encoding='utf-8',errors='ignore')
                  for token in forbidden:
                      if token.lower() in text.lower():
                          hits.append(f'{p}: {token}')
          if Path('kanazawa-port-logo.png').exists():
              hits.append('obsolete logo asset still exists')
          if hits:
              raise SystemExit('Remaining web-facing references:\n'+'\n'.join(hits))
          print('All web-facing references removed and obsolete asset deleted.')
          PY
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' site-finishing.css
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))!important' brand-refresh.css

      - name: Commit clean final state
        run: |
          rm -f .github/workflows/remove-kanazawa-port-once.yml
          git config user.name 'NOTO-ReBloom Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Kanazawa Port from sponsor and partner listings'
          git push
