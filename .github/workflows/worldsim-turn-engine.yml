name: Worldsim turn engine

on:
  push:
    branches: [main]
    paths:
      - 'sidehustle-autopublish/note/worldsim/simulation/run_request.json'
      - 'sidehustle-autopublish/note/worldsim/simulation/prepare_turn_v1.mjs'
      - 'sidehustle-autopublish/note/worldsim/simulation/resolve_turn_v1.mjs'
      - 'sidehustle-autopublish/note/worldsim/simulation/policy_catalog_v1.json'
      - 'sidehustle-autopublish/note/worldsim/editorial/generate_turn_posts_v1.mjs'
      - '.github/workflows/worldsim-turn-engine.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'

permissions:
  contents: write

concurrency:
  group: worldsim-turn-engine
  cancel-in-progress: false

jobs:
  turn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve gate and next turn
        shell: python
        run: |
          import json, os, pathlib, re
          root=pathlib.Path('sidehustle-autopublish/note/worldsim')
          req=json.loads((root/'simulation/run_request.json').read_text())
          event=os.environ.get('GITHUB_EVENT_NAME','push')
          active=False
          turn=int(req.get('requestedTurn',0))
          mode='manual'

          if event=='schedule':
              rebuild=json.loads((root/'rebuild_request.json').read_text())
              active=(rebuild.get('status')=='completed' and rebuild.get('launchVerified') is True)
              mode='weekly_schedule'
              turns=[]
              for p in (root/'state').glob('turn_*/world_state.json'):
                  m=re.search(r'turn_(\d+)',str(p))
                  if m: turns.append(int(m.group(1)))
              turn=(max(turns)+1) if turns else 1
          else:
              active=req.get('status')=='requested'
              mode='explicit_request'

          print('active=',active,'turn=',turn,'mode=',mode,'event=',event)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('WORLDSIM_ACTIVE='+('true' if active else 'false')+'\n')
              f.write('WORLDSIM_TURN='+str(turn)+'\n')
              f.write('WORLDSIM_MODE='+mode+'\n')

      - name: Verify previous canonical state
        shell: bash
        run: |
          if [ "$WORLDSIM_ACTIVE" != "true" ]; then echo "Worldsim gate is closed"; exit 0; fi
          python - <<'PY'
          import json, pathlib, os
          turn=int(os.environ['WORLDSIM_TURN'])
          assert turn>=1
          prev=pathlib.Path(f'sidehustle-autopublish/note/worldsim/state/turn_{turn-1:04d}/world_state.json')
          assert prev.exists(),prev
          d=json.loads(prev.read_text())
          assert d['turn']==turn-1,(d['turn'],turn)
          current=pathlib.Path(f'sidehustle-autopublish/note/worldsim/state/turn_{turn:04d}/world_state.json')
          if current.exists() and os.environ.get('WORLDSIM_MODE')=='weekly_schedule':
              raise AssertionError(f'scheduled turn already exists: {current}')
          print('PREVIOUS_STATE_OK',prev)
          PY

      - name: Prepare turn
        shell: bash
        run: |
          if [ "$WORLDSIM_ACTIVE" != "true" ]; then exit 0; fi
          node sidehustle-autopublish/note/worldsim/simulation/prepare_turn_v1.mjs

      - name: Resolve turn
        shell: bash
        run: |
          if [ "$WORLDSIM_ACTIVE" != "true" ]; then exit 0; fi
          node sidehustle-autopublish/note/worldsim/simulation/resolve_turn_v1.mjs

      - name: Select and render meaningful stories
        shell: bash
        run: |
          if [ "$WORLDSIM_ACTIVE" != "true" ]; then exit 0; fi
          node sidehustle-autopublish/note/worldsim/editorial/generate_turn_posts_v1.mjs

      - name: Deep turn QA
        shell: bash
        run: |
          if [ "$WORLDSIM_ACTIVE" != "true" ]; then exit 0; fi
          python - <<'PY'
          import json, pathlib, os
          turn=int(os.environ['WORLDSIM_TURN'])
          root=pathlib.Path('sidehustle-autopublish/note/worldsim')
          td=root/f'turns/turn_{turn:04d}'
          state=json.loads((root/f'state/turn_{turn:04d}/world_state.json').read_text())
          inp=json.loads((td/'turn_input.json').read_text())
          votes=json.loads((td/'votes.json').read_text())
          demo=json.loads((td/'demography.json').read_text())
          summary=json.loads((td/'turn_summary.json').read_text())
          manifest=json.loads((root/f'editorial/generated/turn_{turn:04d}/manifest.json').read_text())
          assert state['turn']==turn
          assert inp['turn']==turn
          assert state['calendar']['turn']==turn
          assert set(votes)=={'ARCUS','MIREA','VALD'}
          proposed={c:{x['policyId'] for x in inp['proposals'][c]} for c in inp['proposals']}
          for country,rows in votes.items():
              for v in rows:
                  assert v['policyId'] in proposed[country],(country,v['policyId'])
                  assert 0<=v['yesShare']<=1
                  if v['passed']:
                      assert v['yesShare']>=v['threshold']
                      if v['dualMajority']: assert v['settlementMajority']
          for rid,res in state['worldDynamic']['resources'].items():
              assert 0<=res['stockIndex']<=100,(rid,res)
          for country,c in state['countries'].items():
              assert c['population']>100
              assert 0<c['meanFoodReserveDays']<250,(country,c['meanFoodReserveDays'])
              assert 0<c['meanHealth']<=100
              assert 0<=c['meanStress']<=100
              assert c['institution']['nationalBody']['members']
              assert c['institution']['executive']['memberIds']
          births=[]; deaths=[]
          for country,d in demo['countries'].items():
              births += d['births']; deaths += d['deaths']
          assert len({x['citizenId'] for x in births})==len(births)
          assert len({x['citizenId'] for x in deaths})==len(deaths)
          assert not ({x['citizenId'] for x in births}&{x['citizenId'] for x in deaths})
          assert len({x['citizenId'] for x in state['roster']['newCitizens']})==len(state['roster']['newCitizens'])
          assert len(state['roster']['inactiveCitizenIds'])==len(set(state['roster']['inactiveCitizenIds']))
          assert summary['turn']==turn
          assert manifest['turn']==turn
          assert len(manifest['stories'])<=2
          for st in manifest['stories']:
              assert st['score']>=8
              body=pathlib.Path(st['bodyPath'])
              assert body.exists()
              n=len(body.read_text())
              assert 250<=n<=12000,(st['id'],n)
          print('TURN_QA_OK',turn,'stories=',len(manifest['stories']),summary)
          PY

      - name: Close explicit request and commit resolved turn
        shell: bash
        run: |
          if [ "$WORLDSIM_ACTIVE" != "true" ]; then exit 0; fi
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('sidehustle-autopublish/note/worldsim')
          p=root/'simulation/run_request.json'
          d=json.loads(p.read_text())
          turn=int(os.environ['WORLDSIM_TURN'])
          d['status']='hold'
          d['lastResolvedTurn']=turn
          d['requestedTurn']=turn+1
          d['reason']='Previous turn resolved and audited. Scheduled operation waits for next weekly cadence.'
          d['requestNonce']='hold-after-turn-'+str(turn)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

          PAD=$(printf "%04d" "$WORLDSIM_TURN")
          git config user.name 'worldsim-turn-engine'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            "sidehustle-autopublish/note/worldsim/state/turn_$PAD" \
            "sidehustle-autopublish/note/worldsim/turns/turn_$PAD" \
            "sidehustle-autopublish/note/worldsim/editorial/generated/turn_$PAD" \
            sidehustle-autopublish/note/worldsim/publication_queue.json \
            sidehustle-autopublish/note/worldsim/simulation/run_request.json
          if git diff --cached --quiet; then echo 'No turn change'; exit 0; fi
          git commit -m "Resolve and editorialize LYRA turn $WORLDSIM_TURN"
          git pull --rebase origin main
          git push origin HEAD:main
