name: Bump mud FX final cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump all mud effect asset versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rebloom-detail.js')
          t=p.read_text(encoding='utf-8').replace('rebloom-mudfx.css?v=20260817f','rebloom-mudfx.css?v=20260817g').replace('rebloom-mudfx.js?v=20260817f','rebloom-mudfx.js?v=20260817g')
          p.write_text(t,encoding='utf-8')
          p=Path('rebloom-unified.js')
          t=p.read_text(encoding='utf-8').replace('rebloom-detail.js?v=20260817f','rebloom-detail.js?v=20260817g')
          p.write_text(t,encoding='utf-8')
          for name in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
            p=Path(name)
            t=p.read_text(encoding='utf-8').replace('rebloom-unified.js?v=20260817f','rebloom-unified.js?v=20260817g')
            p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebloom-detail.js rebloom-unified.js index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "泥演出の最終版を全公開ページへ反映"
          git push
