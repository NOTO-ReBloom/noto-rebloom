name: Validate public site integrity

on:
  push:
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'site.webmanifest'
      - 'site-core.js'
      - 'site-postevent.js'
      - 'site.js'
      - 'diagnosis.js'
      - 'diagnosis-visual-v2.js'
      - 'diagnosis-shell.js'
      - 'rebloom-unified.js'
      - 'rebloom-detail.js'
      - 'site-consistency.css'
      - 'rebloom-2026.css'
      - 'rebloom-2026.js'
      - 'diagnosis-2026.css'
      - 'diagnosis-loader-2026.js'
      - 'plant-art-20260929.css'
      - 'plant-art-20260929.js'
      - '*-polish-*.css'
      - 'home-hero-focus-20260928.css'
      - '.github/scripts/home-hero-check.cjs'
      - 'typography-responsive-20260928.css'
      - 'diagnosis-font-match-20260928.css'
      - 'diagnosis-site-match-20260929.css'
      - 'responsive-text-20260928.css'
      - 'refresh-core.css'
      - 'refresh-sponsor.css'
      - 'visual-text-tuning.css'
      - '.github/scripts/site-browser-smoke.cjs'
      - '.github/scripts/learn-browser-check.cjs'
      - 'home-final-20260924.css'
      - 'event-final-bundle-20260926.css'
      - 'partner-pre-20260924.css'
      - 'partner-post-20260924.css'
      - 'report-final-bundle-20260924.css'
      - '.github/workflows/site-integrity.yml'
  workflow_dispatch:

concurrency:
  group: noto-rebloom-site-integrity-v2
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public JavaScript syntax
        run: |
          for f in plant-art-20260929.js rebloom-2026.js diagnosis-loader-2026.js diagnosis.js diagnosis-visual-v2.js diagnosis-shell.js site-core.js site-postevent.js site-content-20261004.js site-content-renderer-20261004.js site.js rebloom-unified.js rebloom-detail.js; do
            node --check "$f"
          done

      - name: Validate public HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          pages = sorted(p.name for p in Path('.').glob('*.html'))

          class Checker(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
                  self.ids = []
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get('id'):
                      self.ids.append(a['id'])
                  if tag == 'img' and 'alt' not in a:
                      self.errors.append('img without alt')
                  if tag == 'a':
                      href = (a.get('href') or '').strip()
                      target = (a.get('target') or '').lower()
                      internal = bool(href) and not re.match(r'^(?:https?:|mailto:|tel:|#)', href, re.I)
                      if internal and target == '_blank':
                          self.errors.append(f'internal link opens new tab: {href}')

          failures = []
          for page in pages:
              p = Path(page)
              if not p.exists():
                  failures.append(f'{page}: missing')
                  continue
              html = p.read_text(encoding='utf-8')
              if re.search(r'<script\b[^>]*>\s*<script\b', html, re.I):
                  failures.append(f'{page}: nested/unclosed script tag')
              if re.search(r'<img\b[^>]*\/\s+(?:loading|decoding|srcset|sizes|fetchpriority)=', html, re.I):
                  failures.append(f'{page}: malformed img self-closing slash before attributes')
              if len(re.findall(r'<script\b', html, re.I)) != len(re.findall(r'</script\s*>', html, re.I)):
                  failures.append(f'{page}: script open/close count mismatch')

              c = Checker(page)
              c.feed(html)
              dup = sorted({x for x in c.ids if c.ids.count(x) > 1})
              if dup:
                  failures.append(f'{page}: duplicate ids {dup}')
              failures.extend(f'{page}: {e}' for e in c.errors)

          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'OK: validated {len(pages)} public pages.')
          PY

      - name: Validate internal links and sitemap
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import re
          import xml.etree.ElementTree as ET

          pages = sorted(p.name for p in Path('.').glob('*.html'))
          base = 'https://noto-rebloom.github.io/noto-rebloom/'

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
                  self.links=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if a.get('id'):
                      self.ids.add(a['id'])
                  if tag == 'a' and a.get('href'):
                      self.links.append(a['href'].strip())

          parsed={}
          htmls={}
          failures=[]
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              htmls[page]=text
              p=LinkParser()
              p.feed(text)
              parsed[page]=p

          for page,p in parsed.items():
              for href in p.links:
                  if not href or re.match(r'^(?:https?:|mailto:|tel:|javascript:)',href,re.I):
                      continue
                  if href.startswith('#'):
                      anchor=unquote(href[1:])
                      if anchor and anchor not in p.ids:
                          failures.append(f'{page}: missing local anchor #{anchor}')
                      continue
                  target,sep,fragment=href.partition('#')
                  target=target.lstrip('./') or page
                  if target.endswith('.html') and target not in parsed:
                      failures.append(f'{page}: missing internal page {target}')
                      continue
                  if sep and target in parsed:
                      anchor=unquote(fragment)
                      if anchor and anchor not in parsed[target].ids:
                          failures.append(f'{page}: {href} points to missing anchor')

          sitemap=ET.parse('sitemap.xml').getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap_urls={el.text.strip() for el in sitemap.findall('sm:url/sm:loc',ns) if el.text}

          for page,text in htmls.items():
              noindex=bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',text,re.I) or
                           re.search(r'<meta[^>]+content=["\'][^"\']*noindex[^"\']*["\'][^>]+name=["\']robots["\']',text,re.I))
              canonical_match=(re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)["\']',text,re.I) or
                               re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',text,re.I))
              canonical=canonical_match.group(1) if canonical_match else None

              if page != '404.html' and not noindex and not canonical:
                  failures.append(f'{page}: indexable page missing canonical')

              expected_url = base if page == 'index.html' else base + page
              if noindex:
                  if expected_url in sitemap_urls:
                      failures.append(f'{page}: noindex page must not be in sitemap')
              else:
                  if page != '404.html' and expected_url not in sitemap_urls:
                      failures.append(f'{page}: indexable page missing from sitemap')

          if failures:
              raise SystemExit('\n'.join(failures))
          print('OK: internal links, anchors, canonicals and sitemap are consistent.')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser runner
        run: |
          npm install --no-save puppeteer-core axe-core
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Serve public site for browser QA
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/rebloom-integrity-http.log 2>&1 &
          sleep 2

      - name: Run focused home hero browser check
        run: node .github/scripts/home-hero-check.cjs

      - name: Run focused learn page browser check
        run: node .github/scripts/learn-browser-check.cjs

      - name: Run cross-page browser smoke
        run: node .github/scripts/site-browser-smoke.cjs

