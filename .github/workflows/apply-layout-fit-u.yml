name: Apply layout fit U
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual density and card fit pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          css=Path('rebloom-purpose-complete.css')
          t=css.read_text(encoding='utf-8')
          marker='/* VISUAL DENSITY + CARD FIT U / 2026-08-17 */'
          block=r'''
          /* VISUAL DENSITY + CARD FIT U / 2026-08-17 */
          body.rb-unified :is(.join-facts,.nr-choice-grid,.rbpc-process-flow,.rbpc-logistics-grid,.rbpc-program-grid,.rbpc-safety-grid,.nr-value-grid,.industry-grid,.nr-navi-guide,.rbpc-data-proof,.rbpc-comparison-grid,.rbpc-benefit-grid,.rbpc-network-grid)>*{min-width:0;max-width:100%}
          body.rb-unified :is(.join-fact,.nr-choice,.rbpc-process-step,.rbpc-logistics-grid>div,.rbpc-program-grid>article,.rbpc-safety-grid>div,.nr-value-grid>article,.industry-grid>article,.definition-card,.rbpc-data-proof>article,.diagnosis-start-card){box-sizing:border-box;height:auto!important;max-height:none!important}
          body.rb-unified :is(.join-fact,.nr-choice,.rbpc-process-step,.rbpc-logistics-grid>div,.rbpc-program-grid>article,.rbpc-safety-grid>div,.nr-value-grid>article,.industry-grid>article,.definition-card,.rbpc-data-proof>article,.diagnosis-start-card) :is(h2,h3,strong,b,p,span,small){max-width:100%;overflow-wrap:anywhere}
          body.rb-unified main>section.hero,body.rb-unified main>section.page-hero{min-height:0!important;height:auto!important;padding-top:clamp(92px,8vw,112px)!important;padding-bottom:clamp(42px,4vw,58px)!important}
          body.rb-unified main>section:not(.hero):not(.page-hero){padding-top:clamp(46px,5.2vw,70px)!important;padding-bottom:clamp(46px,5.2vw,70px)!important}
          body.rb-unified :is(.section-heading,.nr-section-head,.visual-mosaic-head){margin-bottom:clamp(20px,2.6vw,32px)!important}
          body.rb-unified :is(.nr-choice,.rbpc-process-step,.nr-value-grid>article,.industry-grid>article,.rbpc-program-grid>article){padding:clamp(16px,1.7vw,22px)!important}
          body.rb-unified .join-facts{gap:10px!important}
          body.rb-unified .join-fact{min-height:96px!important;padding:13px 15px!important;overflow:clip!important}
          body.rb-unified .join-fact strong{font-size:clamp(22px,2vw,29px)!important;line-height:1.05!important}
          body.rb-unified .nr-choice-grid{gap:12px!important;max-width:980px;margin-inline:auto}
          body.rb-unified .nr-choice{min-height:0!important;overflow:visible!important}
          body.rb-unified #purpose .rbpc-process-flow{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;max-width:960px;margin-inline:auto;padding-top:0!important}
          body.rb-unified #purpose .rbpc-process-flow::before{display:none!important}
          body.rb-unified #purpose .rbpc-process-step{min-height:0!important;overflow:visible!important}
          body.rb-unified #purpose .rbpc-process-step h3{font-size:clamp(18px,1.6vw,21px)!important;line-height:1.35!important}
          body.rb-unified #purpose .rbpc-process-step p{font-size:14px!important;line-height:1.75!important}
          body.rb-unified #words .rbpc-comparison-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
          body.rb-unified #words .definition-card{min-height:0!important;overflow:visible!important;padding:18px 20px!important}
          body.rb-unified #words .definition-card h3{font-size:clamp(19px,1.7vw,23px)!important;line-height:1.3!important}
          body.rb-unified #numbers .rbpc-data-proof{gap:10px!important}
          body.rb-unified #numbers .rbpc-data-proof article{min-height:0!important;padding:18px!important;overflow:visible!important}
          body.rb-unified #numbers .rbpc-data-proof article strong{font-size:clamp(30px,3.1vw,44px)!important;line-height:1.05!important;white-space:normal!important}
          body.rb-unified .rbpc-logistics-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px!important}
          body.rb-unified .rbpc-logistics-grid>div{min-height:88px!important;padding:14px 16px!important;overflow:visible!important}
          body.rb-unified .rbpc-logistic-1{grid-column:span 2}
          body.rb-unified .rbpc-logistic-4,body.rb-unified .rbpc-logistic-5{grid-column:span 2}
          body.rb-unified .rbpc-logistics-grid b{font-size:clamp(21px,2vw,27px)!important;line-height:1.1!important;white-space:normal!important}
          body.rb-unified .rbpc-program-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;max-width:960px;margin-inline:auto}
          body.rb-unified .rbpc-program-grid article{min-height:0!important;overflow:visible!important}
          body.rb-unified .rbpc-program-grid article h3{font-size:clamp(18px,1.7vw,21px)!important;line-height:1.35!important}
          body.rb-unified .rbpc-safety-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important}
          body.rb-unified .rbpc-safety-grid>div{min-height:0!important;padding:20px!important;overflow:visible!important}
          body.rb-unified .nr-value-grid,body.rb-unified .rbpc-benefit-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;max-width:920px;margin-inline:auto}
          body.rb-unified .nr-value-grid>article{min-height:0!important;overflow:visible!important;display:grid!important;grid-template-columns:44px minmax(0,1fr)!important;column-gap:13px;align-items:start!important}
          body.rb-unified .nr-value-grid>article>span{grid-row:1/3!important}
          body.rb-unified .nr-value-grid>article h3{font-size:clamp(18px,1.65vw,22px)!important;line-height:1.35!important;margin-top:1px!important}
          body.rb-unified .nr-value-grid>article p{font-size:14px!important;line-height:1.7!important}
          body.rb-unified .nr-main-sponsor--navi{grid-template-columns:minmax(220px,.72fr) minmax(0,1.28fr)!important;gap:24px!important;height:auto!important;max-height:none!important;overflow:visible!important}
          body.rb-unified .nr-main-sponsor--navi>*{min-width:0;max-width:100%}
          body.rb-unified .nr-sponsor-logo{max-width:100%!important;box-sizing:border-box}
          body.rb-unified .nr-sponsor-logo img{max-width:100%!important;height:auto!important}
          body.rb-unified .nr-navi-guide{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}
          body.rb-unified .nr-navi-guide article{min-width:0!important;padding:12px!important;height:auto!important}
          body.rb-unified .nr-navi-guide strong{font-size:14px!important;line-height:1.35!important}
          body.rb-unified .nr-navi-guide span{font-size:12px!important;line-height:1.55!important}
          body.rb-unified .industry-grid{gap:0!important}
          body.rb-unified .industry-grid article{min-height:0!important;overflow:visible!important}
          body.rb-unified .diagnosis-start-card{min-height:0!important;overflow:visible!important;padding:clamp(20px,3vw,30px)!important}
          @media (max-width:1050px){
            body.rb-unified main>section.hero,body.rb-unified main>section.page-hero{padding-top:88px!important;padding-bottom:40px!important}
            body.rb-unified .rbpc--orientation :is(.hero-grid,.page-hero-grid){grid-template-columns:minmax(0,1fr) minmax(300px,.82fr)!important;gap:28px!important}
            body.rb-unified .rbpc-safety-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            body.rb-unified .rbpc-safety-grid>div:last-child{grid-column:1/-1}
          }
          @media (max-width:720px){
            body.rb-unified main>section.hero,body.rb-unified main>section.page-hero{padding-top:72px!important;padding-bottom:30px!important}
            body.rb-unified main>section:not(.hero):not(.page-hero){padding-top:38px!important;padding-bottom:38px!important}
            body.rb-unified :is(.section-heading,.nr-section-head,.visual-mosaic-head){margin-bottom:20px!important}
            body.rb-unified .rbpc--orientation :is(.hero-grid,.page-hero-grid){grid-template-columns:1fr!important;gap:22px!important}
            body.rb-unified #purpose .rbpc-process-flow{grid-template-columns:1fr!important;gap:9px!important}
            body.rb-unified #words .rbpc-comparison-grid{grid-template-columns:1fr!important}
            body.rb-unified #words .definition-card{border-right:0!important;border-bottom:1px solid var(--rbpc-line)!important;padding:17px 18px!important}
            body.rb-unified #numbers .rbpc-data-proof{grid-template-columns:1fr!important}
            body.rb-unified .rbpc-logistics-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
            body.rb-unified .rbpc-logistic-1{grid-column:1/-1!important}
            body.rb-unified .rbpc-logistic-4,body.rb-unified .rbpc-logistic-5{grid-column:auto!important}
            body.rb-unified .rbpc-logistics-grid>div{min-height:82px!important;padding:12px 13px!important}
            body.rb-unified .rbpc-logistics-grid b{font-size:21px!important}
            body.rb-unified .rbpc-program-grid{grid-template-columns:1fr!important;gap:9px!important}
            body.rb-unified .rbpc-safety-grid{grid-template-columns:1fr!important;gap:9px!important}
            body.rb-unified .rbpc-safety-grid>div:last-child{grid-column:auto!important}
            body.rb-unified .nr-value-grid,body.rb-unified .rbpc-benefit-grid{grid-template-columns:1fr!important;gap:9px!important}
            body.rb-unified .nr-value-grid>article{grid-template-columns:38px minmax(0,1fr)!important;padding:15px 14px!important}
            body.rb-unified .nr-main-sponsor--navi{grid-template-columns:1fr!important;gap:18px!important;padding:16px!important;width:auto!important;max-width:100%!important;margin-inline:0!important;overflow:visible!important}
            body.rb-unified .nr-main-sponsor--navi>*{width:auto!important;min-width:0!important;max-width:100%!important}
            body.rb-unified .nr-sponsor-identity{padding-right:0!important;border-right:0!important;border-bottom:1px solid rgba(23,58,49,.12);padding-bottom:18px!important}
            body.rb-unified .nr-navi-guide{grid-template-columns:1fr!important;gap:7px!important}
            body.rb-unified .nr-navi-guide article{display:grid!important;grid-template-columns:30px minmax(0,1fr)!important;column-gap:8px!important;padding:10px 11px!important}
            body.rb-unified .nr-navi-guide article>b{grid-row:1/3}
            body.rb-unified .nr-sponsor-primary{width:100%!important;box-sizing:border-box;text-align:center;justify-content:center}
            body.rb-unified .industry-grid{grid-template-columns:1fr!important}
            body.rb-unified .join-fact{padding:12px!important;min-height:88px!important}
            body.rb-unified .join-fact strong{font-size:22px!important}
            body.rb-unified .diagnosis-start-card{padding:18px!important;margin-inline:0!important;width:auto!important;max-width:100%!important}
          }
          '''
          if marker not in t:
              t += '\n'+block+'\n'
          css.write_text(t,encoding='utf-8')
          # Bump only the final CSS cache key; JS behavior is unchanged.
          for name in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              p=Path(name); x=p.read_text(encoding='utf-8')
              x=re.sub(r'rebloom-purpose-complete\.css\?v=20260817[a-z]','rebloom-purpose-complete.css?v=20260817u',x)
              p.write_text(x,encoding='utf-8')
          p=Path('rebloom-detail.js'); x=p.read_text(encoding='utf-8')
          x=re.sub(r'rebloom-purpose-complete\.css\?v=20260817[a-z]','rebloom-purpose-complete.css?v=20260817u',x)
          p.write_text(x,encoding='utf-8')
          PY
      - name: Validate files
        run: |
          node --check rebloom-detail.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('rebloom-purpose-complete.css').read_text(encoding='utf-8')
          assert css.count('{')==css.count('}')
          assert 'VISUAL DENSITY + CARD FIT U' in css
          for n in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              assert 'rebloom-purpose-complete.css?v=20260817u' in Path(n).read_text(encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rebloom-purpose-complete.css rebloom-detail.js index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet && exit 0
          git commit -m 'PC・スマホのカード収まりと余白を改善'
          git push
