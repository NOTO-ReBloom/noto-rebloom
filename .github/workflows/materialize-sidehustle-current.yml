name: Materialize current sidehustle day

on:
  push:
    paths:
      - 'sidehustle-autopublish/builders/daily_plan_current.json'
      - 'sidehustle-autopublish/builders/materialize_daily_current.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sidehustle-current-materialization
  cancel-in-progress: false

jobs:
  build-encrypt-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check cryptography pillow
      - name: Build, QA, encrypt and queue current-day inventory
        run: python sidehustle-autopublish/builders/materialize_daily_current.py
      - name: Commit current-day materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sidehustle-autopublish/note/queue sidehustle-autopublish/note/staging sidehustle-autopublish/note/free_queue sidehustle-autopublish/note/free_drafts booth-autopublish/queue booth-autopublish/monitor sidehustle-autopublish/completion_gate.json sidehustle-autopublish/publication_quota.json sidehustle-autopublish/metrics/current.json sidehustle-autopublish/windows_publication_request.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize current sidehustle publication batch'
          git pull --rebase origin main
          git push
