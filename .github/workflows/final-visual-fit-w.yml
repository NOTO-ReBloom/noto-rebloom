name: Final visual fit W
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten text-heavy card layouts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('rebloom-fit.css')
          s=p.read_text(encoding='utf-8')
          s=s.replace('body.rb-unified .nr-new-partner .nr-value-grid','body.rb-unified.nr-new-partner .nr-value-grid')
          s=s.replace('body.rb-unified .nr-new-partner .nr-value-grid article','body.rb-unified.nr-new-partner .nr-value-grid article')
          s=s.replace('body.rb-unified .nr-new-event :is(.rbpc-question-grid,.faq-grid)','body.rb-unified.nr-new-event :is(.rbpc-question-grid,.faq-grid)')
          s=s.replace('body.rb-unified .nr-new-event .rbpc-question-grid .faq-card','body.rb-unified.nr-new-event .rbpc-question-grid .faq-card')
          s=s.replace('max-width:1040px!important;margin-inline:auto!important','max-width:none!important;margin-inline:auto!important')
          if '/* FINAL READABILITY OVERRIDES W */' not in s:
              s += '''\n\n/* FINAL READABILITY OVERRIDES W */\nbody.rb-unified.nr-new-partner .nr-value-prop .nr-value-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;max-width:1040px!important;margin-inline:auto!important}\nbody.rb-unified.nr-new-partner .nr-sponsor-feature--spotlight .nr-main-sponsor--navi{width:100%!important;max-width:none!important}\n@media(max-width:700px){\n  body.rb-unified.nr-new-event #event-faq .faq-grid,body.rb-unified.nr-new-event #event-faq .rbpc-question-grid{grid-template-columns:1fr!important}\n  body.rb-unified.nr-new-partner .nr-value-prop .nr-value-grid{grid-template-columns:1fr!important}\n}\n@media(max-width:620px){\n  body.rb-unified #purpose .event-values.rbpc-process-flow{grid-template-columns:1fr!important}\n  body.rb-unified #purpose .rbpc-process-flow::before{display:none!important}\n}\n'''
          p.write_text(s,encoding='utf-8')

          p=Path('rebloom-detail.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"rebloom-fit\.css\?v=20260817[a-z]","rebloom-fit.css?v=20260817w",s)
          # Move fit once more at the very end of loader execution so it remains the final cascade layer.
          marker="ensureScript('rebloom-purpose-complete.js','rebloom-purpose-complete.js?v=20260817q');"
          tail="\n  ensureStyle('rebloom-fit.css','rebloom-fit.css?v=20260817w');"
          if marker in s and marker+tail not in s:
              s=s.replace(marker,marker+tail)
          p.write_text(s,encoding='utf-8')

          p=Path('rebloom-unified.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'rebloom-detail\.js\?v=20260817[a-z]','rebloom-detail.js?v=20260817w',s)
          p.write_text(s,encoding='utf-8')

          for name in ['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=re.sub(r'rebloom-unified\.js\?v=20260817[a-z]','rebloom-unified.js?v=20260817w',s)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate source
        run: |
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('rebloom-fit.css').read_text(encoding='utf-8')
          assert s.count('{')==s.count('}')
          assert 'body.rb-unified.nr-new-partner .nr-value-prop .nr-value-grid{grid-template-columns:repeat(2' in s
          assert 'body.rb-unified.nr-new-event #event-faq .faq-grid' in s
          assert '#purpose .event-values.rbpc-process-flow{grid-template-columns:1fr' in s
          assert Path('rebloom-detail.js').read_text(encoding='utf-8').count("ensureStyle('rebloom-fit.css','rebloom-fit.css?v=20260817w');") >= 1
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit runtime
        run: npm install --no-save playwright-core@1.55.0
      - name: Render final desktop and mobile layouts
        run: |
          mkdir -p visual-fit-w
          python3 -m http.server 8000 >/tmp/rebloom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > visual-fit-w.cjs <<'JS'
          const { chromium }=require('playwright-core');
          const fs=require('fs');
          const base='http://127.0.0.1:8000/';
          const files=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html'];
          const vps=[{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            const report=[];
            for(const vp of vps){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              for(const file of files){
                const page=await ctx.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
                await page.route('**/*',route=>{const u=route.request().url();if(u.startsWith(base)||u.startsWith('data:')||u.startsWith('blob:'))return route.continue();return route.abort()});
                const res=await page.goto(base+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(1200);
                await page.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=620){scrollTo(0,y);await new Promise(r=>setTimeout(r,8));}scrollTo(0,0)});
                await page.waitForTimeout(200);
                const m=await page.evaluate(()=>{
                  const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>4&&r.height>4};
                  const cards=[...document.querySelectorAll('.join-fact,.summary-grid>div,.event-values article,.definition-card,.cause-grid article,.game-grid article,.check-list>div,.nr-value-grid article,.industry-grid article,.faq-card,.nr-main-sponsor--navi')].filter(visible);
                  const outside=[];
                  for(const c of cards){const cr=c.getBoundingClientRect();for(const n of [...c.querySelectorAll('h2,h3,p,strong,b,small,a')].filter(visible)){if(getComputedStyle(n).position==='absolute')continue;const r=n.getBoundingClientRect();if(r.left<cr.left-3||r.right>cr.right+3||r.top<cr.top-3||r.bottom>cr.bottom+3){outside.push({card:(c.className||c.tagName).toString().slice(0,90),text:(n.innerText||'').trim().replace(/\s+/g,' ').slice(0,70),cw:Math.round(cr.width),nw:Math.round(r.width),bottom:Math.round(r.bottom-cr.bottom)});break}}}
                  const colCount=sel=>{const e=document.querySelector(sel);if(!e||!visible(e))return 0;const cols=getComputedStyle(e).gridTemplateColumns.trim();return cols?cols.split(/\s+/).length:0};
                  return {docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,outside,partnerBenefitCols:colCount('.nr-value-prop .nr-value-grid'),faqCols:colCount('#event-faq .faq-grid'),processCols:colCount('#purpose .event-values')};
                });
                if(!res||res.status()>=400)throw new Error(`${file}/${vp.name}: HTTP`);
                if(errors.length)throw new Error(`${file}/${vp.name}: JS ${errors.join(' | ')}`);
                if(m.docOverflow>2)throw new Error(`${file}/${vp.name}: overflow ${m.docOverflow}`);
                if(m.outside.length)throw new Error(`${file}/${vp.name}: outside ${JSON.stringify(m.outside.slice(0,4))}`);
                if(file==='partner.html'&&vp.name==='desktop'&&m.partnerBenefitCols!==2)throw new Error(`partner desktop cols ${m.partnerBenefitCols}`);
                if(file==='partner.html'&&vp.name==='mobile'&&m.partnerBenefitCols!==1)throw new Error(`partner mobile cols ${m.partnerBenefitCols}`);
                if(file==='event.html'&&vp.name==='mobile'&&m.faqCols!==1)throw new Error(`faq mobile cols ${m.faqCols}`);
                if(file==='index.html'&&vp.name==='mobile'&&m.processCols!==1)throw new Error(`process mobile cols ${m.processCols}`);
                report.push({file,vp:vp.name,...m});
                await page.screenshot({path:`visual-fit-w/${file.replace('.html','')}-${vp.name}.png`,fullPage:true});
                await page.close();
              }
              await ctx.close();
            }
            fs.writeFileSync('visual-fit-w/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-fit-w.cjs
      - name: Commit final visual fit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rebloom-fit.css rebloom-detail.js rebloom-unified.js index.html learn.html event.html partner.html diagnosis.html 404.html
          git commit -m '横並びカードの可読性を最終調整'
          git push
      - name: Upload final visual review
        uses: actions/upload-artifact@v4
        with:
          name: visual-fit-w
          path: visual-fit-w
          retention-days: 2
