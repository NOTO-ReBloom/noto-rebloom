name: Normalize and materialize current sidehustle plan

on:
  push:
    paths:
      - '.github/workflows/sidehustle-plan-schema-normalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize free NOTE compatibility fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('sidehustle-autopublish/builders/daily_plan_current.json')
          d=json.loads(p.read_text('utf-8'))
          paid=d.get('paid',[])
          palette=['#315E81','#6B4E71','#2E6F5E','#7A5A32']
          changed=False
          for i,x in enumerate(d.get('free',[])):
              defaults={
                  'paired': x.get('pairedPaid') or (paid[i]['id'] if i < len(paid) else ''),
                  'coverLabel': '無料チェック',
                  'coverCopy': x.get('title','').split('｜')[0][:24],
                  'accent': palette[i % len(palette)],
              }
              for k,v in defaults.items():
                  if not x.get(k):
                      x[k]=v
                      changed=True
          if changed:
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n','utf-8')
              print('NORMALIZED_CURRENT_PLAN')
          else:
              print('PLAN_ALREADY_NORMALIZED')
          PY
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check cryptography pillow
      - name: Build, QA, encrypt and queue current-day inventory
        run: python sidehustle-autopublish/builders/materialize_daily_current.py
      - name: Commit normalization and materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sidehustle-autopublish/builders/daily_plan_current.json sidehustle-autopublish/note/queue sidehustle-autopublish/note/staging sidehustle-autopublish/note/free_queue sidehustle-autopublish/note/free_drafts booth-autopublish/queue booth-autopublish/monitor sidehustle-autopublish/completion_gate.json sidehustle-autopublish/publication_quota.json sidehustle-autopublish/metrics/current.json sidehustle-autopublish/windows_publication_request.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize current sidehustle publication batch'
          git pull --rebase origin main
          git push
