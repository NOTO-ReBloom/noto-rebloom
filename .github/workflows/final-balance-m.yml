name: Final balance M

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate final scripts
        run: |
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          node --check rebloom-refine.js
          test -f rebloom-refine.css
          test -f rebloom-balance.css
      - name: Bump all public pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html']
          for name in names:
              p=Path(name)
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'rebloom-unified\.js\?v=20260817[a-z]', 'rebloom-unified.js?v=20260817m', t)
              p.write_text(t,encoding='utf-8')
              assert 'rebloom-unified.js?v=20260817m' in t, name
          PY
      - name: Commit public cache update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html learn.html event.html partner.html diagnosis.html 404.html
          git diff --cached --quiet || git commit -m "最終バランス版を全公開ページへ反映"
          git push
