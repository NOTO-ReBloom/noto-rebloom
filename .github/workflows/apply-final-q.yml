name: Apply final Q

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final improvements
        run: python3 final_q_patch.py
      - name: Validate JavaScript
        run: |
          node --check site.js
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          node --check rebloom-tight.js
          node --check rebloom-purpose.js
          node --check rebloom-purpose-complete.js
      - name: Commit final Q
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html learn.html event.html partner.html diagnosis.html 404.html site.js rebloom-purpose.js rebloom-purpose-complete.css rebloom-detail.js rebloom-unified.js
          git diff --cached --quiet || git commit -m "全ページの最終表示と導線を改善"
          git push
