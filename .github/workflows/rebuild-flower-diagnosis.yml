name: Rebuild Flower Diagnosis

on:
  push:
    paths:
      - '.github/workflows/rebuild-flower-diagnosis.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Download botanical photos and connect diagnosis v2
        run: |
          python - <<'PY'
          import io, json, pathlib, time, urllib.error, urllib.parse, urllib.request
          from PIL import Image, ImageOps

          root=pathlib.Path('.')
          pages={
            'himawari':'Common_sunflower','gerbera':'Gerbera','salvia':'Salvia','dahlia':'Dahlia','tulip':'Tulip','marigold':'Tagetes','poppy':'Poppy','hibiscus':'Hibiscus',
            'freesia':'Freesia','cosmos':'Cosmos_(plant)','anemone':'Anemone','clematis':'Clematis','iris':'Iris_(plant)','nemophila':'Nemophila','lupinus':'Lupinus','kasumisou':'Gypsophila',
            'shirotsumekusa':'Trifolium_repens','renge':'Astragalus_sinicus','clover':'Clover','nadeshiko':'Dianthus_superbus','nanohana':'Brassica_rapa','mimosa':'Acacia_dealbata','rindou':'Gentiana_scabra','edelweiss':'Edelweiss',
            'ajisai':'Hydrangea','lavender':'Lavandula','suiren':'Nymphaea','kikyo':'Platycodon','wasurenagusa':'Myosotis','sumire':'Viola_mandshurica','tanpopo':'Taraxacum','chamomile':'Chamomile'
          }
          headers={'User-Agent':'NOTO-ReBloom-website/1.0 (https://github.com/NOTO-ReBloom/noto-rebloom)'}

          params={
            'action':'query','format':'json','formatversion':'2','prop':'pageimages','piprop':'thumbnail','pithumbsize':'1200',
            'titles':'|'.join(pages.values())
          }
          api='https://en.wikipedia.org/w/api.php?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(api,headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
              query=json.load(r)
          by_title={p.get('title',''):p.get('thumbnail',{}).get('source') for p in query.get('query',{}).get('pages',[])}
          reverse={title.replace('_',' '):slug for slug,title in pages.items()}
          image_for={reverse[title]:src for title,src in by_title.items() if title in reverse and src}

          def fetch_bytes(url):
              last=None
              for attempt,wait in enumerate((0,3,7,15,30),start=1):
                  if wait: time.sleep(wait)
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=40) as r:
                          return r.read()
                  except urllib.error.HTTPError as exc:
                      last=exc
                      if exc.code!=429: raise
                      print('rate limited; retry',attempt,url)
              raise last or RuntimeError('download failed')

          failures=[]
          for index,(slug,title) in enumerate(pages.items(),start=1):
              try:
                  image=image_for.get(slug)
                  if not image: raise RuntimeError(f'no thumbnail for {title}')
                  raw=fetch_bytes(image)
                  im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
                  scale=max(900/im.width,675/im.height)
                  nw,nh=max(1,round(im.width*scale)),max(1,round(im.height*scale))
                  fitted=im.resize((nw,nh),Image.Resampling.LANCZOS)
                  left=(nw-900)//2; top=(nh-675)//2
                  canvas=fitted.crop((left,top,left+900,top+675))
                  canvas.save(root/f'flower-photo-{slug}.webp','WEBP',quality=82,method=6)
                  print(f'[{index:02d}/32] saved {slug}')
                  time.sleep(.55)
              except Exception as exc:
                  failures.append((slug,str(exc)))
                  print('FAILED',slug,exc)

          html_path=root/'diagnosis.html'
          html=html_path.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="diagnosis-v2.css?v=20260827b">'
          visual='<script defer src="diagnosis-visual-v2.js?v=20260827b"></script>'
          import re
          if 'diagnosis-v2.css' not in html:
              html=html.replace('</head>',css+'\n</head>')
          else:
              html=re.sub(r'<link[^>]+diagnosis-v2\.css[^>]*>',css,html)
          if 'diagnosis-visual-v2.js' not in html:
              html=html.replace('</body>',visual+'\n</body>')
          else:
              html=re.sub(r'<script[^>]+diagnosis-visual-v2\.js[^>]*></script>',visual,html)
          html=html.replace('30種類以上','32種類')
          html=html.replace('花の絵、花言葉、開花時期、タイプの短い特徴を一覧にしました。','実際の花の写真、花言葉、開花時期、タイプの短い特徴を一覧にしました。')
          html=html.replace('alt="レンゲの花を描いたイメージ"','alt="レンゲの花の写真"')
          html_path.write_text(html,encoding='utf-8')

          print('photo failures:',failures)
          if failures:
              raise SystemExit(f'flower photo failures: {len(failures)}')
          PY
      - name: Commit rebuilt diagnosis assets
        run: |
          git config user.name 'NOTO-ReBloom Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnosis.html diagnosis-visual-v2.js flower-photo-*.webp
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Rebuild flower diagnosis with botanical photography'
            git push
          fi