name: Rematerialize BOOTH batch with proven category mapping

on:
  push:
    paths:
      - '.github/workflows/rematerialize-booth-batch-category-compatible.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography pillow
      - name: Add proven BOOTH parent/child category aliases and rebuild
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('sidehustle-autopublish/builders/materialize_booth_debt_batch.py').read_text(encoding='utf-8')
          old="'category':'ソフトウェア・ハードウェア','digital':True"
          new="'category':'ソフトウェア・ハードウェア','categoryParent':'ソフトウェア・ハードウェア','categoryChild':'ソフトウェア','categoryValue':'ソフトウェア','subcategory':'ソフトウェア','digital':True"
          if old not in src:
              raise SystemExit('expected category pattern not found')
          src=src.replace(old,new)
          Path('/tmp/materialize_booth_debt_batch_category.py').write_text(src,encoding='utf-8')
          PY
          cp /tmp/materialize_booth_debt_batch_category.py sidehustle-autopublish/builders/_materialize_booth_tmp.py
          python sidehustle-autopublish/builders/_materialize_booth_tmp.py
          rm sidehustle-autopublish/builders/_materialize_booth_tmp.py
      - name: Commit regenerated encrypted queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add booth-autopublish/queue booth-autopublish/monitor/cloud_materialization_20260822.json
          git commit -m 'Rematerialize BOOTH batch with software category child mapping' || exit 0
          git push
