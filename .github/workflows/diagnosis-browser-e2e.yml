name: Validate Flower Diagnosis Browser Flow

on:
  push:
    paths:
      - 'diagnosis.html'
      - 'diagnosis.js'
      - 'diagnosis-visual-v2.js'
      - 'diagnosis-shell.js'
      - 'rebloom-unified.js'
      - 'diagnosis-v2.css'
      - 'diagnosis-fixes.css'
      - 'diagnosis-ux-v3.css'
      - '.github/scripts/diagnosis-browser-e2e.cjs'
      - '.github/scripts/static-gzip-server.cjs'
      - '.github/workflows/diagnosis-browser-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save puppeteer-core
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Serve site
        run: |
          node .github/scripts/static-gzip-server.cjs >/tmp/rebloom-diagnosis-http.log 2>&1 &
          sleep 2
      - name: Run diagnosis browser flow
        run: node .github/scripts/diagnosis-browser-e2e.cjs

