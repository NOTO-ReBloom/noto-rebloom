name: Final layout pass
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final layout rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('rebloom-fit.css')
          t=p.read_text(encoding='utf-8')
          marker='/* FINAL W — strict card containment + balanced desktop grids */'
          block=r'''
          /* FINAL W — strict card containment + balanced desktop grids */
          body.rb-unified :is(.nr-home-hero,.page-hero):not(.page-hero--diagnosis){padding-top:clamp(86px,7vw,98px)!important;padding-bottom:28px!important}

          /* Sponsor benefits: 2×2 on desktop, one column on phones. */
          body.rb-unified.nr-new-partner .nr-value-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;max-width:940px!important;margin-inline:auto!important}
          body.rb-unified.nr-new-partner .nr-value-grid>article{width:auto!important;max-width:none!important;min-width:0!important;height:auto!important;overflow:hidden!important}

          /* Event facts: 3 balanced cards + 2 balanced cards. */
          body.rb-unified .rbpc-logistics-grid{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:9px!important;background:transparent!important}
          body.rb-unified .rbpc-logistics-grid>:nth-child(1),body.rb-unified .rbpc-logistics-grid>:nth-child(2),body.rb-unified .rbpc-logistics-grid>:nth-child(3){grid-column:span 2!important}
          body.rb-unified .rbpc-logistics-grid>:nth-child(4),body.rb-unified .rbpc-logistics-grid>:nth-child(5){grid-column:span 3!important}
          body.rb-unified .rbpc-logistics-grid>div{width:auto!important;max-width:none!important;min-width:0!important;height:auto!important;overflow:hidden!important}

          /* Photo captions stay inside their photo cards. */
          body.rb-unified .visual-tile{position:relative!important;overflow:hidden!important}
          body.rb-unified .visual-tile figcaption{position:absolute!important;left:8px!important;right:8px!important;bottom:8px!important;top:auto!important;transform:none!important;margin:0!important;padding:8px 10px!important;max-width:calc(100% - 16px)!important;box-sizing:border-box!important;border-radius:10px!important;background:rgba(255,250,241,.94)!important;color:#27463c!important;font-size:clamp(10.5px,1vw,12.5px)!important;line-height:1.45!important;box-shadow:0 2px 10px rgba(23,58,49,.08)!important;overflow-wrap:anywhere!important;z-index:3}
          body.rb-unified .visual-tile .visual-label{z-index:4}

          /* Schedule time labels stay inside each schedule card. */
          body.rb-unified .rbpc-schedule-flow article{position:relative!important;padding-top:16px!important;overflow:hidden!important;min-height:0!important;height:auto!important}
          body.rb-unified .rbpc-schedule-flow .flow-time{position:static!important;inset:auto!important;transform:none!important;margin:0 auto 9px!important;display:grid!important;place-items:center!important;flex:0 0 auto!important}

          @media(max-width:720px){
            body.rb-unified :is(.nr-home-hero,.page-hero):not(.page-hero--diagnosis){padding-top:72px!important;padding-bottom:24px!important}
            body.rb-unified.nr-new-partner .nr-value-grid{grid-template-columns:1fr!important;gap:9px!important}
            body.rb-unified .rbpc-logistics-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
            body.rb-unified .rbpc-logistics-grid>:nth-child(1){grid-column:1/-1!important}
            body.rb-unified .rbpc-logistics-grid>:nth-child(2),body.rb-unified .rbpc-logistics-grid>:nth-child(3),body.rb-unified .rbpc-logistics-grid>:nth-child(4),body.rb-unified .rbpc-logistics-grid>:nth-child(5){grid-column:auto!important}
            body.rb-unified .visual-tile figcaption{left:7px!important;right:7px!important;bottom:7px!important;max-width:calc(100% - 14px)!important;padding:7px 9px!important;font-size:10.5px!important}
            body.rb-unified .rbpc-schedule-flow article{padding:14px!important}
          }
          '''
          if marker not in t:
              t += '\n'+block+'\n'
          p.write_text(t,encoding='utf-8')
          d=Path('rebloom-detail.js')
          x=d.read_text(encoding='utf-8')
          x=re.sub(r"rebloom-fit\.css\?v=20260817[a-z]","rebloom-fit.css?v=20260817w",x)
          d.write_text(x,encoding='utf-8')
          PY
          node --check rebloom-detail.js
          python3 - <<'PY'
          from pathlib import Path
          c=Path('rebloom-fit.css').read_text(encoding='utf-8')
          assert c.count('{')==c.count('}')
          assert 'FINAL W — strict card containment' in c
          assert 'rebloom-fit.css?v=20260817w' in Path('rebloom-detail.js').read_text(encoding='utf-8')
          PY
      - name: Install browser audit
        run: npm install --no-save playwright-core@1.55.0
      - name: Render all pages and enforce fit
        run: |
          mkdir -p final-layout-audit
          python3 -m http.server 8000 >/tmp/rebloom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > final-layout-audit.cjs <<'JS'
          const { chromium }=require('playwright-core');
          const fs=require('fs');
          const base='http://127.0.0.1:8000/';
          const files=['index.html','learn.html','event.html','partner.html','diagnosis.html','404.html'];
          const vps=[{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            const report=[];
            for(const vp of vps){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              for(const file of files){
                const page=await ctx.newPage(); const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                await page.route('**/*',r=>{const u=r.request().url();if(u.startsWith(base)||u.startsWith('data:')||u.startsWith('blob:'))return r.continue();return r.abort()});
                const res=await page.goto(base+file,{waitUntil:'load',timeout:20000});
                await page.waitForTimeout(1000);
                await page.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=650){scrollTo(0,y);await new Promise(r=>setTimeout(r,12));}scrollTo(0,0)});
                await page.waitForTimeout(180);
                const m=await page.evaluate(({file,vpName})=>{
                  const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>8&&r.height>8};
                  const selectors='article,.join-fact,.nr-choice,.definition-card,.faq-card,.visual-tile,.nr-value-grid>article,.industry-grid>article,.rbpc-logistics-grid>div';
                  const cards=[...new Set([...document.querySelectorAll(selectors)])].filter(visible);
                  const outside=[];
                  for(const card of cards){const r=card.getBoundingClientRect();const walker=document.createTreeWalker(card,NodeFilter.SHOW_TEXT);let n,bad=false,sample='';while(n=walker.nextNode()){if(!n.textContent.trim())continue;const range=document.createRange();range.selectNodeContents(n);for(const tr of range.getClientRects()){if(tr.width<1||tr.height<1)continue;if(tr.left<r.left-2||tr.right>r.right+2||tr.top<r.top-2||tr.bottom>r.bottom+2){bad=true;sample=n.textContent.trim().slice(0,60);break}}if(bad)break}if(bad)outside.push({cls:(card.className||'').toString().slice(0,140),sample,w:Math.round(r.width),h:Math.round(r.height)})}
                  const value=document.querySelector('.nr-value-grid');
                  const valueCols=value?getComputedStyle(value).gridTemplateColumns.split(/\s+/).filter(Boolean).length:null;
                  const logistics=document.querySelector('.rbpc-logistics-grid');
                  let logisticsRows=null;
                  if(logistics){const tops=[...logistics.children].map(e=>Math.round(e.getBoundingClientRect().top));const groups=[];for(const t of tops){let g=groups.find(x=>Math.abs(x.top-t)<3);if(g)g.count++;else groups.push({top:t,count:1})}logisticsRows=groups.map(x=>x.count)}
                  const sections=[...document.querySelectorAll('main>section')].filter(visible).map(sec=>{const r=sec.getBoundingClientRect(),s=getComputedStyle(sec);return {h:Math.round(r.height),pt:Math.round(parseFloat(s.paddingTop)||0),pb:Math.round(parseFloat(s.paddingBottom)||0)}});
                  return {docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,outside,valueCols,logisticsRows,hugeSpace:sections.filter(x=>x.h>680&&x.pt+x.pb>145).length};
                },{file,vpName:vp.name});
                const badSponsor=file==='partner.html'&&((vp.name==='desktop'&&m.valueCols!==2)||(vp.name==='mobile'&&m.valueCols!==1));
                const badLogistics=file==='event.html'&&vp.name==='desktop'&&JSON.stringify(m.logisticsRows)!=='[3,2]';
                report.push({file,vp:vp.name,status:res?.status(),errors,m,badSponsor,badLogistics});
                await page.screenshot({path:`final-layout-audit/${file.replace('.html','')}-${vp.name}.png`,fullPage:true});
                await page.close();
              }
              await ctx.close();
            }
            fs.writeFileSync('final-layout-audit/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report.map(x=>({file:x.file,vp:x.vp,status:x.status,doc:x.m.docOverflow,outside:x.m.outside.length,valueCols:x.m.valueCols,logisticsRows:x.m.logisticsRows,hugeSpace:x.m.hugeSpace,errors:x.errors.length,badSponsor:x.badSponsor,badLogistics:x.badLogistics})),null,2));
            const hard=report.filter(x=>x.status>=400||x.errors.length||x.m.docOverflow>2||x.m.outside.length||x.badSponsor||x.badLogistics);
            if(hard.length){console.error('HARD FAIL',JSON.stringify(hard,null,2));process.exit(1)}
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node final-layout-audit.cjs
      - name: Commit passed layout and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/final-layout-pass.yml
          git add rebloom-fit.css rebloom-detail.js
          git commit -m 'PC・スマホの最終ビジュアル調整を完了'
          git push
      - name: Upload final screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-layout-audit
          path: final-layout-audit
          retention-days: 2
