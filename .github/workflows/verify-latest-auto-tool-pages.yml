name: Verify latest auto tool on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'auto-tools/**'
      - '!auto-tools/publication_ledger.json'
      - '.github/workflows/verify-latest-auto-tool-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-latest-auto-tool-pages
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve latest tool
        id: meta
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('auto-tools/index.json','utf8'));
          const t=x.tools[x.tools.length-1];
          if(!t || !t.slug || !t.title || !t.path) process.exit(2);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `slug=${t.slug}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${t.title}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${t.path}\n`);
          NODE

      - name: Verify public page
        id: verify
        shell: bash
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
          EXPECTED_TITLE: ${{ steps.meta.outputs.title }}
          TOOL_PATH: ${{ steps.meta.outputs.path }}
        run: |
          set -euo pipefail
          URL="https://noto-rebloom.github.io/noto-rebloom/${TOOL_PATH}"
          STATUS=0
          for i in $(seq 1 18); do
            STATUS=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "$URL" || true)
            if [ "$STATUS" = 200 ] && grep -Fq "$EXPECTED_TITLE" /tmp/page.html; then break; fi
            sleep 10
          done
          TITLE_OK=false; UI_OK=false; H1_OK=false
          grep -Fq "$EXPECTED_TITLE" /tmp/page.html && TITLE_OK=true || true
          grep -Eiq '<(main|body)[ >]' /tmp/page.html && UI_OK=true || true
          grep -Eiq '<h1[ >]' /tmp/page.html && H1_OK=true || true
          VERIFIED=false
          if [ "$STATUS" = 200 ] && [ "$TITLE_OK" = true ] && [ "$UI_OK" = true ] && [ "$H1_OK" = true ]; then VERIFIED=true; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "title_ok=$TITLE_OK" >> "$GITHUB_OUTPUT"
          echo "ui_ok=$UI_OK" >> "$GITHUB_OUTPUT"
          echo "h1_ok=$H1_OK" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          test "$VERIFIED" = true

      - name: Persist evidence only when semantic state changes
        shell: python
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
          EXPECTED_TITLE: ${{ steps.meta.outputs.title }}
          URL: ${{ steps.verify.outputs.url }}
          STATUS: ${{ steps.verify.outputs.status }}
          TITLE_OK: ${{ steps.verify.outputs.title_ok }}
          UI_OK: ${{ steps.verify.outputs.ui_ok }}
          H1_OK: ${{ steps.verify.outputs.h1_ok }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
        run: |
          import json, os, pathlib, datetime
          p=pathlib.Path('sidehustle-autopublish/monitor/pages-verification/latest.json')
          prev={}
          if p.exists():
              try: prev=json.loads(p.read_text(encoding='utf-8'))
              except Exception: prev={}
          semantic={
              'slug':os.environ['SLUG'],
              'title':os.environ['EXPECTED_TITLE'],
              'publicUrl':os.environ['URL'],
              'httpStatus':int(os.environ.get('STATUS') or 0),
              'titleOk':os.environ.get('TITLE_OK')=='true',
              'majorUiOk':os.environ.get('UI_OK')=='true',
              'h1Ok':os.environ.get('H1_OK')=='true',
              'publicUrlVerified':os.environ.get('VERIFIED')=='true'
          }
          old={k:prev.get(k) for k in semantic}
          if old==semantic:
              print('NO_SEMANTIC_CHANGE')
              raise SystemExit(0)
          semantic['checkedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(semantic,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Commit evidence if changed
        run: |
          if git diff --quiet -- sidehustle-autopublish/monitor/pages-verification/latest.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sidehustle-autopublish/monitor/pages-verification/latest.json
          git commit -m "Record GitHub Pages verification state"
          git push origin HEAD:main
