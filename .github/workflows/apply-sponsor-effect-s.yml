name: Apply sponsor effect and crowdfunding visual fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply content and visual refinements
        run: python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode(''))).decode())"
      - name: Validate JavaScript and CSS
        run: |
          node --check site.js
          node --check rebloom-unified.js
          node --check rebloom-detail.js
          node --check rebloom-purpose.js
          node --check rebloom-purpose-complete.js
          python3 -c "from pathlib import Path; t=Path('rebloom-purpose-complete.css').read_text(); assert t.count('{')==t.count('}')"
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html partner.html learn.html event.html diagnosis.html 404.html rebloom-purpose-complete.css rebloom-detail.js rebloom-unified.js
          git diff --cached --quiet || git commit -m "協賛紹介の効果とクラファン実績カードを改善"
          git push
