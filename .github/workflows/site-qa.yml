name: Site QA

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - ".github/scripts/site_qa.py"
      - ".github/workflows/site-qa.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - ".github/scripts/site_qa.py"
      - ".github/workflows/site-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate static site
        run: python .github/scripts/site_qa.py
