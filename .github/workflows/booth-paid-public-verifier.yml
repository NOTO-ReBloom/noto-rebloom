name: Verify BOOTH paid recovery quietly

on:
  workflow_dispatch:
  push:
    paths:
      - 'booth-autopublish/queue/index.json'
      - '.github/workflows/booth-paid-public-verifier.yml'
  schedule:
    - cron: '17,32,47,2 * * * *'

permissions:
  contents: write

concurrency:
  group: booth-paid-public-verifier
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Discover and strictly verify buyer-visible BOOTH pages
        shell: python
        run: |
          import urllib.request,urllib.parse,re,html,json,pathlib,datetime,time
          TARGETS={f'{n:03d}_'+s for n,s in [
            (10,'event_risk_register_os_20260822'),(11,'small_org_role_os_20260822'),(12,'sponsor_deliverables_tracker_20260822'),
            (13,'research_interview_coding_os_20260822'),(14,'volunteer_shift_comms_os_20260822'),(15,'creator_profit_pricing_os_20260822'),
            (16,'event_sponsor_bundle_os_20260822'),(17,'jobhunt_interview_bundle_os_20260822'),(18,'grant_application_tracker_os_20260822'),
            (19,'event_incident_log_os_20260822'),(20,'meeting_decision_action_os_20260822'),(21,'small_npo_donor_crm_os_20260822'),
            (22,'research_literature_matrix_os_20260822'),(23,'campus_project_budget_os_20260822')]}
          UA={'User-Agent':'Mozilla/5.0 (compatible; buyer-visible-publication-verifier/2.0)','Accept-Language':'ja,en;q=0.7','Cache-Control':'no-cache'}
          def get(url,timeout=25):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,r.read().decode('utf-8','replace')
          def visible_text(src):
              src=re.sub(r'<script\b[^>]*>.*?</script>',' ',src,flags=re.I|re.S);src=re.sub(r'<style\b[^>]*>.*?</style>',' ',src,flags=re.I|re.S)
              return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',src))).strip()
          qpath=pathlib.Path('booth-autopublish/queue/index.json');q=json.loads(qpath.read_text(encoding='utf-8-sig'))
          ledger_path=pathlib.Path('booth-autopublish/monitor/publication_ledger.json');ledger=json.loads(ledger_path.read_text(encoding='utf-8-sig'))
          known={x.get('queueId'):x for x in ledger.get('entries',[])}
          newly=[]
          for e in q.get('entries',[]):
              iid=e.get('id')
              if iid not in TARGETS or known.get(iid,{}).get('publicUrlVerified') is True:continue
              title=e['title'];price=int(e.get('expectedPriceJPY') or 0)
              search='https://booth.pm/ja/search/'+urllib.parse.quote(title,safe='')+'?sort=new'
              try:ss,sh=get(search)
              except Exception as ex:print('SEARCH_WARN',iid,repr(ex));continue
              links=[]
              for m in re.finditer(r'href=["\'](?:https://booth\.pm)?(/ja/items/(\d+))["\']',sh):
                  u='https://booth.pm'+m.group(1)
                  if u not in links:links.append(u)
              if not links:
                  for m in re.finditer(r'https://booth\.pm/ja/items/(\d+)',sh):
                      u='https://booth.pm/ja/items/'+m.group(1)
                      if u not in links:links.append(u)
              for url in links[:12]:
                  try:ps,page=get(url)
                  except Exception:continue
                  text=visible_text(page);compact=re.sub(r'[\s,，]','',text)
                  title_ok=title in text
                  price_ok=(f'¥{price}' in compact or f'￥{price}' in compact or f'{price}円' in compact)
                  download_ok=any(x in text for x in ('ダウンロード商品','ダウンロード版','Download Product','digital download'))
                  purchase_ok=any(x in text for x in ('カートに入れる','購入する','入荷お知らせメールを受け取る')) and ('在庫なし' not in text or 'カートに入れる' in text)
                  if not (ps==200 and title_ok and price_ok and download_ok and purchase_ok):continue
                  item_id=url.rsplit('/',1)[-1];verified_at=datetime.datetime.now(datetime.timezone.utc).isoformat()
                  rec={'queueId':iid,'title':title,'boothItemId':item_id,'publicUrl':url,'publicUrlVerified':True,'verifiedAt':verified_at,'verificationEvidence':'Independent unauthenticated verifier confirmed buyer HTTP 200, exact title, expected price, downloadable-product signal and purchase/cart path.','publishMode':'independent-reconcile'}
                  ledger.setdefault('entries',[]).append(rec);known[iid]=rec;newly.append(iid)
                  e['enabled']=False;e['forceRetry']=False;e['publicUrlVerified']=True;e['publicUrl']=url;e['verificationState']='buyer_visible_verified';e['verifiedAt']=verified_at
                  print('STRICT_BOOTH_VERIFIED',iid,url);break
          if not newly:
              print('NO_NEW_STRICT_PUBLICATION');raise SystemExit(0)
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds')
          q['updatedAt']=now;qpath.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          ledger['updatedAt']=now;ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          quota_path=pathlib.Path('sidehustle-autopublish/publication_quota.json');quota=json.loads(quota_path.read_text(encoding='utf-8-sig'))
          verified=sum(1 for x in ledger.get('entries',[]) if x.get('queueId') in TARGETS and x.get('publicUrlVerified') is True)
          st=quota['channels']['BOOTH']['operationalState']
          st['carriedPublicationDebt']=max(0,9-verified);st['todayStrictVerifiedPublicationsCount']=max(0,min(5,verified-9));st['todayRemainingToTarget']=max(0,5-st['todayStrictVerifiedPublicationsCount']);st['totalVerifiedPublicationsRequiredBeforeDaySatisfied']=st['carriedPublicationDebt']+st['todayRemainingToTarget'];st['lastStrictVerificationAt']=now;st['lastStrictVerifiedIds']=newly
          quota['updatedAt']=now;quota['version']=int(quota.get('version',0))+1;quota_path.write_text(json.dumps(quota,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit only newly verified BOOTH publications
        run: |
          if git diff --quiet -- booth-autopublish/queue/index.json booth-autopublish/monitor/publication_ledger.json sidehustle-autopublish/publication_quota.json; then exit 0; fi
          git config user.name 'booth-paid-public-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add booth-autopublish/queue/index.json booth-autopublish/monitor/publication_ledger.json sidehustle-autopublish/publication_quota.json
          git commit -m 'Record strict BOOTH publications'
          git pull --rebase origin main
          git push origin HEAD:main
