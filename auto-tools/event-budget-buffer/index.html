<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イベント予算・予備費計算機</title><meta name="description" content="イベントの費目別予算と不確実性から必要な予備費、総予算、1人あたり必要原資を計算する無料ツール。"><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #0001}h1{font-size:clamp(28px,5vw,44px)}label{display:block;font-weight:700;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd2dd;border-radius:10px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.result{font-size:30px;font-weight:800}.note{background:#eef4ff;padding:12px;border-radius:12px}.cta{display:inline-block;padding:12px 16px;background:#172033;color:#fff;border-radius:10px;text-decoration:none;font-weight:700}</style></head><body><main class="wrap"><section class="card"><small>無料・登録不要・ブラウザ内で計算</small><h1>イベント予算・予備費計算機</h1><p>会場、備品、広報、保険、交通、飲食などの見積額に「不確実性」を加味し、予算超過に備える予備費を自動計算します。</p></section><section class="card"><h2>見積条件</h2><div class="grid"><div><label>会場・設備費（円）</label><input id="venue" type="number" min="0" value="50000"></div><div><label>備品・制作費（円）</label><input id="goods" type="number" min="0" value="30000"></div><div><label>広報・印刷費（円）</label><input id="promo" type="number" min="0" value="10000"></div><div><label>保険・安全費（円）</label><input id="safety" type="number" min="0" value="10000"></div><div><label>交通・謝金等（円）</label><input id="other" type="number" min="0" value="20000"></div><div><label>想定参加者数</label><input id="people" type="number" min="1" value="50"></div><div><label>不確実性</label><select id="risk"><option value="5">低い（予備5%）</option><option value="10" selected>普通（予備10%）</option><option value="15">高い（予備15%）</option><option value="20">かなり高い（予備20%）</option></select></div><div><label>確定済み協賛・補助（円）</label><input id="support" type="number" min="0" value="30000"></div></div></section><section class="card"><h2>必要予算</h2><div class="grid"><div><small>基本見積</small><div class="result" id="base">-</div></div><div><small>推奨予備費</small><div class="result" id="reserve">-</div></div><div><small>予備費込み総予算</small><div class="result" id="total">-</div></div><div><small>支援差引後の必要原資</small><div class="result" id="need">-</div></div></div><p class="note" id="per"></p></section><section class="card"><h2>判断の目安</h2><p>見積がまだ固まっていない費目が多いほど予備率を高めます。予備費は最初から使い切る前提ではなく、価格上昇、追加備品、欠損・破損、参加者増などへのバッファとして確保します。</p><p><a class="cta" href="../event-break-even/">損益分岐点・参加費も計算する</a></p></section></main><script>const ids=['venue','goods','promo','safety','other','people','risk','support'];const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';function v(id){return Math.max(0,Number(document.getElementById(id).value)||0)}function calc(){const b=v('venue')+v('goods')+v('promo')+v('safety')+v('other');const r=Math.ceil(b*v('risk')/100);const t=b+r;const n=Math.max(0,t-v('support'));const p=Math.max(1,v('people'));base.textContent=yen(b);reserve.textContent=yen(r);total.textContent=yen(t);need.textContent=yen(n);per.textContent='参加者 '+p+'人で割ると、支援差引後の必要原資は1人あたり約 '+yen(Math.ceil(n/p))+' です。';}ids.forEach(x=>document.getElementById(x).addEventListener('input',calc));calc();</script></body></html>
