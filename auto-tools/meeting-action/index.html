<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会議アクション・宿題管理メーカー</title><meta name="description" content="学生団体・サークル・小規模NPO向け。会議で決まった宿題を担当者・期限・状態つきで整理し、未担当・期限超過・確認待ちを見つける無料ツール。"><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1040px;margin:auto;padding:24px}header{padding:28px 0 14px}h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0 0 10px}.lead{color:#536078;line-height:1.8}.panel{background:#fff;border:1px solid #e3e7ef;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 8px 30px rgba(20,30,55,.06)}.grid,.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#f7f8fb;border:1px solid #e8ebf2;border-radius:14px;padding:14px}.stat b{display:block;font-size:26px;margin-top:4px}.muted{color:#6b7487;font-size:13px}label{display:block;font-weight:700;margin:8px 0 6px}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd6e4;border-radius:10px;font:inherit;background:#fff}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{border-bottom:1px solid #edf0f5;padding:10px;text-align:left}th{font-size:13px;color:#5f6a7d;background:#fafbfc}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#172033;color:#fff}.sub{background:#edf0f5}.danger{background:#fff1ee;color:#8a2d19}.issues{line-height:1.9}.notice{font-size:13px;color:#687387;line-height:1.7}footer{padding:28px 0;color:#7a8496;font-size:13px}@media(max-width:760px){.grid,.stats{grid-template-columns:1fr 1fr}.wrap{padding:16px}.panel{padding:15px}}@media(max-width:480px){.grid,.stats{grid-template-columns:1fr}}@media print{button,.notice,footer{display:none}.panel{box-shadow:none}body{background:#fff}}</style></head><body><main class="wrap"><header><h1>会議アクション・宿題管理メーカー</h1><p class="lead">学生団体・サークル・小規模NPO向け。<strong>「誰が・何を・いつまでにやるか」</strong>を会議直後に整理し、担当漏れ・期限超過・確認待ちを見つけます。入力内容は外部送信せず、このブラウザ内だけで扱います。</p></header><section class="panel"><div class="grid"><div><label>会議名</label><input id="meeting" placeholder="例：9月イベント定例"></div><div><label>会議日</label><input id="date" type="date"></div><div><label>次回会議</label><input id="next" type="date"></div><div><label>進行役</label><input id="facilitator" placeholder="例：代表・PM"></div></div></section><section class="panel"><div class="stats"><div class="stat"><span class="muted">アクション数</span><b id="count">0</b></div><div class="stat"><span class="muted">担当なし</span><b id="noOwner">0</b></div><div class="stat"><span class="muted">期限超過</span><b id="overdue">0</b></div><div class="stat"><span class="muted">確認待ち</span><b id="waiting">0</b></div></div><p id="output" class="lead">アクションを追加すると、自動で抜け漏れを確認します。</p></section><section class="panel"><div class="tablewrap"><table><thead><tr><th>アクション</th><th>担当</th><th>期限</th><th>状態</th><th>確認相手</th><th>メモ</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button class="primary" id="add">＋ アクション追加</button><button class="sub" id="sample">サンプル</button><button class="sub" id="csv">CSV保存</button><button class="sub" id="copy">次回確認用をコピー</button><button class="sub" onclick="window.print()">印刷・PDF</button><button class="danger" id="reset">リセット</button></div></section><section class="panel"><h2>自動チェック</h2><ul id="issues" class="issues"><li>まだアクションがありません。</li></ul><p class="notice">会議終了時に「担当・期限」を入れ、次回会議の冒頭で未完了項目だけ確認する使い方を想定しています。</p></section><footer>無料ツール｜会議後の宿題・アクション漏れを減らす簡易管理</footer></main><script>
const K='meeting-action-v1',R=document.getElementById('rows');function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addRow(d={}){let tr=document.createElement('tr');tr.innerHTML=`<td><input class="task" placeholder="例：会場へ最終確認" value="${E(d.task||'')}"></td><td><input class="owner" placeholder="担当" value="${E(d.owner||'')}"></td><td><input class="due" type="date" value="${E(d.due||'')}"></td><td><select class="status"><option>未着手</option><option>進行中</option><option>確認待ち</option><option>完了</option></select></td><td><input class="checker" placeholder="例：代表" value="${E(d.checker||'')}"></td><td><input class="memo" placeholder="補足" value="${E(d.memo||'')}"></td><td><button class="danger del">削除</button></td>`;tr.querySelector('.status').value=d.status||'未着手';tr.querySelector('.del').onclick=()=>{tr.remove();save()};R.appendChild(tr)}function data(){return [...R.querySelectorAll('tr')].map(tr=>({task:tr.querySelector('.task').value.trim(),owner:tr.querySelector('.owner').value.trim(),due:tr.querySelector('.due').value,status:tr.querySelector('.status').value,checker:tr.querySelector('.checker').value.trim(),memo:tr.querySelector('.memo').value.trim()})).filter(x=>x.task||x.owner||x.due||x.memo)}function calc(){let a=data(),t=new Date();t.setHours(0,0,0,0);let no=a.filter(x=>x.task&&!x.owner),late=a.filter(x=>x.due&&x.status!=='完了'&&new Date(x.due+'T00:00:00')<t),wait=a.filter(x=>x.status==='確認待ち'),list=[];count.textContent=a.length;noOwner.textContent=no.length;overdue.textContent=late.length;waiting.textContent=wait.length;if(no.length)list.push(`担当未設定が ${no.length} 件：${no.slice(0,3).map(x=>x.task).join('、')}`);if(late.length)list.push(`期限超過が ${late.length} 件：${late.slice(0,3).map(x=>x.task||'名称未入力').join('、')}`);if(wait.length)list.push(`確認待ちが ${wait.length} 件あります。確認相手と次の一手を決めましょう。`);if(!a.length)list=['まだアクションがありません。'];else if(!list.length)list=['大きな担当漏れ・期限超過・確認待ちは見つかりませんでした。'];issues.innerHTML=list.map(x=>`<li>${E(x)}</li>`).join('');output.textContent=a.length?`現在 ${a.length} 件。担当なし ${no.length} 件、期限超過 ${late.length} 件、確認待ち ${wait.length} 件です。`:'アクションを追加すると、自動で抜け漏れを確認します。'}function save(){localStorage.setItem(K,JSON.stringify({meeting:meeting.value,date:date.value,next:next.value,facilitator:facilitator.value,rows:data()}));calc()}function load(){try{let d=JSON.parse(localStorage.getItem(K)||'{}');meeting.value=d.meeting||'';date.value=d.date||'';next.value=d.next||'';facilitator.value=d.facilitator||'';(d.rows||[]).forEach(addRow)}catch{}if(!R.children.length)addRow();calc()}add.onclick=()=>{addRow();save()};sample.onclick=()=>{[['会場へ最終確認','田中',2,'進行中','代表','利用時間を確認'],['参加者名簿を確定','佐藤',3,'未着手','受付担当',''],['協賛企業へロゴ確認','鈴木',1,'確認待ち','企業担当','返信待ち']].forEach(x=>{let d=new Date();d.setDate(d.getDate()+x[2]);addRow({task:x[0],owner:x[1],due:d.toISOString().slice(0,10),status:x[3],checker:x[4],memo:x[5]})});save()};csv.onclick=()=>{let lines=[['アクション','担当','期限','状態','確認相手','メモ'],...data().map(x=>[x.task,x.owner,x.due,x.status,x.checker,x.memo])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')),b=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='meeting-actions.csv';a.click();URL.revokeObjectURL(u)};copy.onclick=async()=>{let s=[`【会議アクション】${meeting.value||'会議名未入力'} ${date.value||''}`,...data().filter(x=>x.status!=='完了').map(x=>`・${x.task||'名称未入力'}｜担当:${x.owner||'未定'}｜期限:${x.due||'-'}｜${x.status}${x.checker?'｜確認:'+x.checker:''}`)].join('\n');try{await navigator.clipboard.writeText(s);copy.textContent='コピーしました';setTimeout(()=>copy.textContent='次回確認用をコピー',1200)}catch{alert('CSV保存をご利用ください')}};reset.onclick=()=>{if(confirm('入力内容を消しますか？')){localStorage.removeItem(K);R.innerHTML='';meeting.value=date.value=next.value=facilitator.value='';addRow();calc()}};document.addEventListener('input',e=>{if(e.target.matches('input,select'))save()});document.addEventListener('change',e=>{if(e.target.matches('input,select'))save()});load();
</script></body></html>
